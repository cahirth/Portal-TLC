<!-- Portal TLC | eventos.html | v2026.08.09.6 (Ítems de checklist ahora son responsivos — pasan de <input> de una sola línea (cortaba el texto largo) a <textarea rows="1"> que crece solo con el contenido (mismo patrón auto-resize que otros campos del Portal). Se dispara al tipear (oninput) y también al abrir la tarjeta / repintar el checklist, para que los ítems ya guardados con texto largo se vean expandidos desde el primer render, no recién al tocarlos. Pedido por Cristian con captura resaltando el corte de texto: "fijate que los campos de ítems sean responsivos".) -->
<!-- Portal TLC | eventos.html | v2026.08.09.5 (3 pedidos de Cristian con captura: (1) el campo "Agregar ítem" se veía gigante — bug relacionado al anterior pero distinto: el picker de menciones (.ev-mencion-sug) quedaba DENTRO de la fila flex .ev-check-add-row-chico junto al input y el botón, y como esa fila no tenía align-items definido (default: stretch), cuando el picker se poblaba con varios candidatos y crecía en alto, TODO el input y el botón se estiraban para igualar esa altura. Fix: el picker sale de la fila flex y pasa a ser un hermano debajo (mismo patrón que ya usa el chat) — así solo el picker crece, sin arrastrar al resto. (2) La portada de la tarjeta ahora es clickeable — abre en grande con un lightbox (tocar afuera o en la imagen la cierra), tanto desde el modal como desde la tarjeta cerrada en el tablero. (3) Sobre "no aparecen los 10 destinatarios": confirmado con test que si listarInternos devuelve 10, el picker efectivamente pinta los 10 — no hay ningún límite ni filtro adicional en el código de Eventos. El picker tiene scroll interno (max-height:160px, igual que Negocios) — si Cristian los ve incompletos incluso scrolleando, el problema estaría en la hoja Vendedores, no en el código.) -->
<!-- Portal TLC | eventos.html | v2026.08.09.4 (BUG REAL encontrado tras descartar caché — Cristian confirmó con captura que solo pasaba en Listas de comprobación, no en Mensajes internos, lo cual apuntaba a código y no a versión vieja. Causa: el picker de menciones (.ev-mencion-sug) queda anidado DENTRO de .ev-check-add-row-chico (la fila del input "Agregar ítem" + botón "+ Agregar"), y la regla ".ev-check-add-row-chico button" (pensada solo para el botón verde "+ Agregar") tiene la MISMA especificidad CSS que ".ev-mencion-sug button" pero está definida más abajo en la hoja de estilos — por cascada, le ganaba y pintaba TODOS los botones de sugerencias de verde (menos el resaltado, que sí ganaba por tener 2 clases ".activo"). En el chat no pasaba porque ahí el picker no está anidado dentro de ningún contenedor con esa regla. Fix: los selectores pasan a usar combinador de hijo directo (".ev-check-add-row-chico > button/input"), así solo afectan al input y botón que son hijos directos, sin filtrarse a los botones del picker anidado más adentro. Confirmado con getComputedStyle real vía jsdom: los botones no-activos ahora dan rgba(0,0,0,0) en vez de verde.) -->
<!-- Portal TLC | eventos.html | v2026.08.09.3 (Chat "Mensajes internos" ahora usa EXACTAMENTE el mismo formato que Negocios (cotizaciones.html): lista de mensajes envuelta en su propia caja con borde y scroll interno (max-height:340px) — antes era un <div> suelto sin caja, por eso el contenido se mezclaba con el resto de la página en vez de quedar contenido; esto también resuelve de raíz el problema de que el título se perdía de scroll (se sacó el parche sticky, ya no hace falta). Título "Mensajes internos" pasa a texto plano bold 13px, igual que Negocios (antes tenía tratamiento de section-titulo). Pedido por Cristian con capturas comparando ambos módulos: "así ya está hecho en Negocios y funciona... usa misma tipografía y mismo formato que en negocios". Confirmado con jsdom: caja con clase ev-msg-lista-box, picker de menciones position:static (no absolute), resaltado del primero con clase .activo — todo calcado del comportamiento real de cotizaciones.html.) -->
<!-- Portal TLC | eventos.html | v2026.08.09.2 (2 fixes con captura de Cristian: (1) el input del chat de "Mensajes internos" se iba de pantalla en mobile — bug clásico de flexbox, el <input flex:1> se negaba a encogerse por debajo de su ancho intrínseco sin min-width:0, agregado ahí y en los otros 2 lugares con el mismo patrón (fila de agregar ítem de checklist, título de checklist). De paso, título de "Mensajes internos" ahora sticky y más grande, para que nunca se pierda de vista al hacer scroll, y overflow-x:hidden defensivo en el panel del modal. (2) Los ítems de checklist ahora son editables (antes solo se podían tildar o borrar) — usa la nueva acción ev_editarChecklistItem de FotoMap.gs v162.) -->
<!-- Portal TLC | eventos.html | v2026.08.09.1 (REDISEÑO GRANDE — módulo Eventos v2, conectado a FotoMap.gs v161. Reusa TODO lo que ya funcionaba en producción (sesión, tema, campanita, picker de reacciones, drag&drop entre columnas, sistema de menciones) y suma: (1) Checklists múltiples agrupados con título editable — reemplaza el checklist único plano; (2) Descripción/Propósito de la tarjeta; (3) Notas Generales con historial (autor+fecha); (4) Archivos Adjuntos (máx 10MB, PDF/PNG/JPG/XLSX) con portada — banner arriba del modal y arriba de la tarjeta cerrada en el tablero; (5) Buscador de texto libre (título, descripción, responsable, categoría, checklists, notas, adjuntos); (6) Filtros nuevos de Vencimiento y Progreso, sumados a los de Responsable/Categoría que ya existían; (7) Vista Lista además del Tablero; (8) Menú mobile real (antes no existía, header colapsaba sin forma de cambiar vista/tema/evento en pantallas chicas); (9) Columnas con color propio; (10) Permisos — crear/borrar EVENTOS y COLUMNAS enteras ahora exige Administrador (mismo criterio que borrar empresas), renombrar/recolorear columna queda abierto a cualquier interno. FIX de bug real encontrado y confirmado con test (jsdom): el picker de @menciones no resaltaba el primer candidato por defecto (arrancaba en índice -1, Enter no hacía nada hasta apretar una flecha) y, con checklists múltiples, dos pickers de menciones podían quedar abiertos a la vez sin cerrarse entre sí — ahora resalta el primero al abrir y cierra cualquier otro picker abierto antes de mostrar uno nuevo. Todo validado con jsdom simulando login, apertura de evento, checklists, notas, y la mezcla de menciones entre chat y checklist — no solo leído a ojo. Pedido por Cristian: "quiero reformular por completo eventos.html... usa todo lo que puedas de la nueva UX eventos-v5, pero ajustado a toda nuestra pwa".) -->
<!-- Portal TLC | eventos.html | v2026.08.06.1 (Fix robusto del picker de reacciones: ver detalle completo en servicio.html v2026.08.06.3 — mismo mecanismo (_abrirReaccionPicker), un solo picker global con position:fixed en vez de uno por mensaje que quedaba cortado por el overflow-y:auto del contenedor.) -->
<!-- Portal TLC | eventos.html | v2026.08.04.6 (Mismo rediseño de reacciones que servicio.html: ícono "🙂" que despliega los 3 emojis en vez de tenerlos siempre visibles sueltos, en mensajes de tarjeta y campanita.) -->
<!-- Portal TLC | eventos.html | v2026.08.04.4 (2 pedidos de Cristian para uniformar con el resto de la PWA: (1) el detalle de tarjeta ahora es de dos columnas en pantallas grandes, con Mensajes internos fijo a la derecha (sticky) — mismo patrón que negocios y tickets de Servicio, en vez de todo apilado en una sola columna; (2) barra de filtros nueva arriba del tablero (Responsable, Categoría) — el filtro por columna/etapa no se agregó porque en un Kanban las columnas ya están agrupadas visualmente, sería redundante.) -->
<!-- Portal TLC | eventos.html | v2026.08.04.3 (Faltaba el botón de tema — el CSS de "tema-claro" ya existía pero nunca se aplicaba ni había forma de togglearlo desde acá, por eso quedaba siempre en modo oscuro. Agregado con la misma clave compartida (tlc_tema) que usa el resto del Portal. Reportado por Cristian: "tiene solo modo oscuro?".) -->
<!-- Portal TLC | eventos.html | v2026.08.04.1 (Módulo nuevo "Gestión Eventos / Congresos" (TLC Planner) — v1 recortado: tablero Kanban con columnas dinámicas (crear/renombrar/borrar), tarjetas con categoría/responsable/fecha límite, checklist con @menciones, chat interno con hover-zoom y reacciones (reutiliza al 100% la infraestructura de Ventas/Servicio, cero código duplicado). Selector de eventos (arranca con Faco Extrema 2026). Falta para v2: duplicar tarjeta, bitácora de cambios, reordenar columnas por drag. Pedido por Cristian, spec completa "TLC Planner".) -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Eventos / Congresos — Portal TLC</title>
<script src="version.js"></script>
<script src="permisos.js"></script>
<style>
:root {
  --bg:#030712; --panel-dark:#0f172a; --panel-darker:#0a1424; --border-glow:#1e3050;
  --text-main:#f1f5f9; --text-muted:#94a3b8; --text-dim:#64748b;
  --accent-blue:#3a86ff; --accent-green:#06d6a0; --accent-purple:#8b5cf6; --accent-orange:#f8961e;
}
body.tema-claro {
  --bg:#f0f4f8; --panel-dark:#ffffff; --panel-darker:#f8fafc; --border-glow:#e2e8f0;
  --text-main:#0f172a; --text-muted:#64748b; --text-dim:#94a3b8;
  color-scheme: light;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text-main); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:13px; min-height:100vh; color-scheme:dark; }
button { font-family:inherit; }
a { color:var(--accent-blue); }

.ev-header { position:sticky; top:0; z-index:100; background:var(--panel-dark); border-bottom:1px solid var(--border-glow);
  padding:12px 16px; display:flex; align-items:center; gap:12px; }
.ev-btn-back { width:38px; height:38px; border-radius:50%; background:var(--accent-blue); color:#fff; border:none;
  font-size:16px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.ev-header-title { flex:1; min-width:0; display:flex; align-items:center; gap:9px; }
.ev-header-title .ev-hdr-textos { min-width:0; }
.ev-hdr-logo { width:30px; height:30px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--panel-darker); border:1px solid var(--border-glow); }
.ev-selector-logo { width:34px; height:34px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--panel-darker); border:1px solid var(--border-glow); margin-right:4px; }
.ev-header-title h1 { font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ev-header-title p { font-size:10.5px; color:var(--text-muted); }
.ev-icon-btn { width:36px; height:36px; border-radius:50%; background:var(--panel-darker); border:1px solid var(--border-glow);
  color:var(--text-main); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; position:relative; flex-shrink:0; }
.ev-badge { position:absolute; top:-3px; right:-3px; background:#ef4444; color:#fff; font-size:9px; font-weight:800;
  border-radius:10px; min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

.ev-body { padding:14px; max-width:1400px; margin:0 auto; }

/* ── Selector de eventos ── */
.ev-selector-card { background:var(--panel-dark); border:1px solid var(--border-glow); border-radius:12px; padding:14px 16px;
  margin-bottom:10px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px; transition:border-color .15s; }
.ev-selector-card:hover { border-color:var(--accent-blue); }
.ev-selector-nombre { font-size:14px; font-weight:700; }
.ev-selector-meta { font-size:11px; color:var(--text-muted); margin-top:2px; }
.ev-btn-nuevo-evento { width:100%; padding:14px; border-radius:12px; border:1px dashed var(--border-glow); background:transparent;
  color:var(--text-muted); font-size:13px; font-weight:700; cursor:pointer; margin-top:6px; }
.ev-btn-nuevo-evento:hover { border-color:var(--accent-blue); color:var(--accent-blue); }

/* ── Tablero ── */
.ev-tablero-topbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.ev-select-evento { flex:1; min-width:180px; background:var(--panel-dark); border:1px solid var(--border-glow); border-radius:8px;
  padding:9px 12px; color:var(--text-main); font-size:13px; font-weight:700; }
.ev-btn-secundario { padding:9px 14px; border-radius:8px; border:1px solid var(--border-glow); background:var(--panel-dark);
  color:var(--text-main); font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
.ev-btn-secundario:hover { border-color:var(--accent-blue); }

/* ── Filtros — mismo criterio visual que Ventas/Servicio: barra
   compacta con selects, para no tener que buscar tarjetas a mano en
   eventos con muchas tareas. Pedido por Cristian: "Filtros Eventos,
   responsable, etapa, etc.". La "etapa" acá es la categoría (Diseño,
   Logística, etc.) — el filtro por columna/etapa real no aporta tanto
   en un Kanban, ya que las columnas están agrupadas visualmente una
   al lado de la otra. ── */
.ev-filtros { display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.ev-filtros select { background:var(--panel-dark); border:1px solid var(--border-glow); border-radius:8px;
  padding:7px 10px; color:var(--text-main); font-size:12px; font-weight:600; cursor:pointer; min-width:140px; }
.ev-filtros select:focus { border-color:var(--accent-blue); }
.ev-filtros .ev-filtro-limpiar { background:none; border:none; color:var(--accent-blue); font-size:11.5px; font-weight:700; cursor:pointer; padding:4px 6px; }
.ev-card.ev-filtrada-fuera { display:none; }

.ev-board { display:flex; gap:12px; overflow-x:auto; padding-bottom:16px; align-items:flex-start; }
.ev-col { min-width:270px; max-width:270px; background:var(--panel-darker); border:1px solid var(--border-glow); border-radius:12px;
  padding:10px; flex-shrink:0; }
.ev-col.drag-over { border-color:var(--accent-blue); background:rgba(58,134,255,.06); }
.ev-col-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 2px; }
.ev-col-nombre { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; }
.ev-col-count { font-size:10px; color:var(--text-muted); background:var(--panel-dark); border-radius:10px; padding:1px 7px; margin-left:6px; }
.ev-col-menu-btn { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:13px; padding:2px 6px; }
.ev-col-menu-btn:hover { color:var(--text-main); }
.ev-col-add-tarjeta { width:100%; padding:8px; border-radius:8px; border:1px dashed var(--border-glow); background:transparent;
  color:var(--text-muted); font-size:11.5px; font-weight:700; cursor:pointer; margin-top:4px; }
.ev-col-add-tarjeta:hover { border-color:var(--accent-blue); color:var(--accent-blue); }
.ev-col-nueva { min-width:220px; max-width:220px; flex-shrink:0; background:transparent; border:1px dashed var(--border-glow);
  border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; min-height:60px; color:var(--text-muted); font-size:12px; font-weight:700; }
.ev-col-nueva:hover { border-color:var(--accent-blue); color:var(--accent-blue); }

.ev-card { background:var(--panel-dark); border:1px solid var(--border-glow); border-radius:10px; padding:10px 11px;
  margin-bottom:8px; cursor:grab; transition:border-color .15s, transform .1s, background .15s; }
.ev-card:hover { border-color:var(--accent-blue); }
.ev-card.dragging { opacity:.4; }
.ev-card.ev-card-tocada { background:var(--accent-blue); border-color:var(--accent-blue); opacity:.75; }
.ev-card-cat { display:inline-block; font-size:9px; font-weight:800; padding:2px 7px; border-radius:8px; margin-bottom:6px; }
.ev-card-titulo { font-size:12.5px; font-weight:700; margin-bottom:6px; line-height:1.35; }
.ev-card-meta { display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:10.5px; color:var(--text-muted); }
.ev-card-fecha { display:flex; align-items:center; gap:3px; }
.ev-card-fecha.vencida { color:#f87171; font-weight:700; }
.ev-card-fecha.proxima { color:#f8961e; font-weight:700; }
.ev-card-resp { background:var(--accent-blue); color:#fff; width:20px; height:20px; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-size:9px; font-weight:800; flex-shrink:0; }
.ev-card-resp-chip { display:flex; align-items:center; gap:5px; min-width:0; }
.ev-card-resp-nombre { font-size:10px; font-weight:700; color:var(--text-main); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:88px; }
.ev-card-progreso-wrap { height:4px; background:var(--panel-darker); border-radius:4px; margin-top:8px; overflow:hidden; }
.ev-card-progreso-bar { height:100%; background:var(--accent-green); border-radius:4px; transition:width .2s; }
.ev-card-progreso-txt { font-size:9.5px; color:var(--text-muted); margin-top:3px; }
.ev-list-progreso { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.ev-list-progreso-bar-wrap { width:42px; height:5px; background:var(--panel-darker); border-radius:4px; overflow:hidden; flex-shrink:0; }
.ev-list-progreso-bar { height:100%; background:var(--accent-green); border-radius:4px; }
.ev-list-progreso-txt { font-size:10px; color:var(--text-muted); white-space:nowrap; }

/* ── Overlay tarjeta ── */
.ev-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:500; display:none; align-items:flex-end; justify-content:center; }
.ev-overlay.open { display:flex; }
@media (min-width:720px) { .ev-overlay { align-items:center; } }
.ev-overlay-panel { background:var(--bg); width:100%; max-width:640px; max-height:92vh; overflow-y:auto; overflow-x:hidden; border-radius:16px 16px 0 0; }
@media (min-width:720px) { .ev-overlay-panel { border-radius:16px; max-height:88vh; } }
@media (min-width:960px) { .ev-overlay-panel { max-width:1040px; } }
.ev-overlay-header { position:sticky; top:0; background:var(--panel-dark); border-bottom:1px solid var(--border-glow);
  padding:14px 16px; display:flex; align-items:center; gap:10px; z-index:2; }
.ev-overlay-body { padding:16px; }
@media (min-width:960px) {
  .ev-overlay-body { display:flex; gap:16px; align-items:flex-start; }
  .ev-overlay-col-principal { flex:1; min-width:0; }
  .ev-overlay-col-mensajes { width:min(320px, 34vw); flex-shrink:0; position:sticky; top:0; }
}
.ev-campo { margin-bottom:14px; }
.ev-campo label { display:block; font-size:10px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:5px; }
.ev-campo input, .ev-campo select, .ev-campo textarea { width:100%; background:var(--panel-darker); border:1px solid var(--border-glow);
  border-radius:8px; padding:9px 11px; color:var(--text-main); font-size:12.5px; font-family:inherit; }
body.tema-claro .ev-campo input, body.tema-claro .ev-campo select, body.tema-claro .ev-campo textarea { background:#fff; }
.ev-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:480px) { .ev-grid2 { grid-template-columns:1fr; } }

/* Tarjetas con borde para los campos — mismo lenguaje visual que las
   tarjetas ID NEGOCIO / VENDEDOR / CONTACTO del detalle de negocio en
   Ventas, en vez de inputs sueltos. Pedido por Cristian: "respetes
   como es la tarjeta de negocios, quiero este mismo formato". */
.ev-det-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
@media (max-width:480px) { .ev-det-grid { grid-template-columns:1fr; } }
.ev-det-card { background:var(--panel-darker); border:1px solid var(--border-glow); border-radius:12px; padding:11px 12px; margin-bottom:10px; }
.ev-det-card-label { font-size:10px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.ev-det-card select, .ev-det-card input:not([type=checkbox]) { width:100%; background:none; border:none; color:var(--text-main);
  font-size:13.5px; font-weight:600; padding:0; font-family:inherit; cursor:pointer; }
.ev-det-card input[type=date] { cursor:pointer; }
.ev-det-card select:focus, .ev-det-card input:focus { outline:none; }
.ev-det-header-info { font-size:11px; color:var(--text-muted); margin:2px 0 16px; }
.ev-det-header-info b { color:var(--text-main); font-weight:600; }
.ev-det-titulo-input { width:100%; background:none; border:none; color:var(--text-main); font-size:16px; font-weight:800;
  padding:0; font-family:inherit; margin-bottom:2px; }
.ev-det-titulo-input:focus { outline:none; }
.ev-det-checklist-box { background:var(--panel-darker); border:1px solid var(--border-glow); border-radius:12px; padding:12px; }
.ev-det-progreso-track { height:5px; border-radius:4px; background:var(--border-glow); margin-bottom:10px; overflow:hidden; }
.ev-det-progreso-fill { height:100%; background:var(--accent-green); border-radius:4px; transition:width .2s ease; }

.ev-check-item { display:flex; align-items:flex-start; gap:8px; padding:7px 0; border-bottom:1px solid var(--border-glow); }
.ev-check-item:last-child { border-bottom:none; }
.ev-check-item input[type=checkbox] { margin-top:2px; flex-shrink:0; width:16px; height:16px; }
.ev-check-item.hecho .ev-check-texto { text-decoration:line-through; color:var(--text-muted); }
.ev-check-texto { font-size:12.5px; flex:1; }
.ev-check-mencion { font-size:10px; color:var(--accent-blue); }
.ev-check-add-row { display:flex; gap:6px; margin-top:8px; position:relative; }
.ev-check-add-row input { flex:1; min-width:0; }
.ev-check-add-row button { padding:0 14px; border-radius:8px; border:none; background:var(--accent-blue); color:#fff; font-weight:700; cursor:pointer; flex-shrink:0; }

.ev-section-titulo { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin:18px 0 8px; }
.ev-msg-titulo { font-size:13px; font-weight:800; color:var(--text-main); margin:0 0 8px; }
.ev-msg-lista-box { background:var(--panel-darker); border:1px solid var(--border-glow); border-radius:12px;

/* Reutilizado tal cual de Ventas/Servicio: hover-zoom + reacciones */
.msg-fila { transition: background .12s ease, border-color .12s ease; cursor:default; padding:8px 10px; border-radius:10px;

.ev-mencion-sug { position:static; margin-top:6px; background:#0f1b2e; border:1px solid var(--border-glow);

.ev-mencion-sug button { display:block; width:100%; text-align:left; padding:9px 10px; font-size:12px; border:none;

/* Campanita — copiado del mismo patrón que servicio.html */

.reaccion-trigger-wrap { position:relative; flex-shrink:0; }
.reaccion-trigger-btn { background:none; border:1px solid var(--border-glow); border-radius:50%; width:24px; height:24px;

/* ── v2 — buscador + vista Lista + menú mobile (pedido de Cristian:

.ev-search-input { background:var(--panel-dark); border:1px solid var(--border-glow); border-radius:8px; padding:7px 12px;

.ev-list-fila:hover { border-color:var(--accent-blue); }
.ev-list-fila.ev-card-tocada { background:var(--accent-blue); border-color:var(--accent-blue); opacity:.75; }
.ev-list-fila .ev-list-titulo { flex:1; font-size:12.5px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.ev-hamburger { display:none; }
@media (max-width:760px) { .ev-hamburger { display:flex; } }
.ev-mobile-menu-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:700; display:none; }
.ev-mobile-menu-overlay.abierto { display:block; }

  padding:18px; overflow-y:auto; box-shadow:4px 0 24px rgba(0,0,0,.4); }

/* ── Descripción ── */
.ev-descripcion-input { width:100%; background:var(--panel-darker); border:1px solid var(--border-glow); border-radius:8px;
  padding:9px 11px; color:var(--text-main); font-size:12.5px; font-family:inherit; resize:vertical; min-height:60px; }

/* ── Checklists múltiples agrupados ── */
.ev-checklist-grupo { background:var(--panel-darker); border:1px solid var(--border-glow); border-radius:11px; padding:12px; margin-bottom:10px; }
.ev-checklist-grupo-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.ev-checklist-titulo-input { flex:1; min-width:0; background:none; border:none; font-size:12.5px; font-weight:800; color:var(--text-main);
  font-family:inherit; padding:3px 0; border-bottom:1px dashed transparent; }
.ev-checklist-titulo-input:focus { outline:none; border-bottom-color:var(--accent-blue); }
.ev-checklist-progreso-chico { font-size:10px; color:var(--accent-green); font-weight:700; flex-shrink:0; white-space:nowrap; }
.ev-btn-borrar-checklist { background:none; border:none; color:var(--text-muted); font-size:13px; cursor:pointer; padding:2px 6px; flex-shrink:0; }
.ev-btn-borrar-checklist:hover { color:#ef4444; }
.ev-check-item-fila { display:flex; align-items:flex-start; gap:8px; padding:5px 0; }
.ev-check-item-fila input[type=checkbox] { width:16px; height:16px; cursor:pointer; flex-shrink:0; margin-top:3px; }
.ev-check-item-texto-fija { flex:1; min-width:0; font-size:12.5px; font-family:inherit; background:none; border:none;
  color:var(--text-main); padding:2px 0; border-bottom:1px dashed transparent; resize:none; overflow:hidden;
  white-space:pre-wrap; word-break:break-word; line-height:1.4; display:block; }
.ev-check-item-texto-fija:focus { outline:none; border-bottom-color:var(--accent-blue); }
.ev-check-item-fila.hecho .ev-check-item-texto-fija { text-decoration:line-through; color:var(--text-muted); }
.ev-btn-borrar-item { background:none; border:none; color:var(--text-dim); font-size:11px; cursor:pointer; flex-shrink:0; padding:2px 5px; margin-top:2px; }
.ev-btn-borrar-item:hover { color:#ef4444; }
.ev-check-add-row-chico { display:flex; gap:6px; margin-top:6px; position:relative; }
.ev-check-add-row-chico > input { flex:1; background:var(--panel-dark); border:1px solid var(--border-glow); border-radius:7px;
  padding:6px 9px; font-size:12px; color:var(--text-main); font-family:inherit; }
.ev-check-add-row-chico > button { background:var(--accent-green); color:#062015; border:none; border-radius:7px; padding:6px 11px;
  font-weight:800; font-size:11.5px; cursor:pointer; flex-shrink:0; }
.ev-btn-crear-checklist { background:var(--panel-darker); border:1px dashed var(--border-glow); color:var(--accent-green);
  font-size:11.5px; font-weight:800; padding:8px 12px; border-radius:8px; cursor:pointer; width:100%; margin-bottom:4px; }
.ev-mencion-aviso { font-size:10px; color:var(--text-dim); margin-top:6px; }

/* ── Notas Generales ── */
.ev-nota-item { background:var(--panel-darker); border:1px solid var(--border-glow); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
.ev-nota-item .txt { font-size:12.5px; line-height:1.4; margin-bottom:5px; white-space:pre-wrap; }
.ev-nota-item .ft-fila { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.ev-nota-item .ft { font-size:10px; color:var(--text-dim); }
.ev-nota-item .acciones { display:flex; gap:8px; flex-shrink:0; }
.ev-nota-item .acciones button { background:none; border:none; color:var(--text-dim); font-size:10.5px; cursor:pointer; padding:0; font-family:inherit; }
.ev-nota-item .acciones button:hover { color:var(--accent-blue); }
.ev-nota-item .acciones button.rojo:hover { color:#ef4444; }
.ev-textarea-nota { width:100%; background:var(--panel-darker); border:1px solid var(--border-glow); border-radius:9px;
  padding:10px 12px; color:var(--text-main); font-size:12.5px; font-family:inherit; resize:vertical; min-height:70px; }

/* ── Adjuntos + portada ── */
.ev-dropzone { border:2px dashed var(--border-glow); border-radius:11px; padding:14px; text-align:center; cursor:pointer; }
.ev-dropzone:hover { border-color:var(--accent-blue); }

  display:flex; align-items:center; justify-content:center; font-size:15px; border:1px solid var(--border-glow); }
.ev-adjunto-fila .info { flex:1; min-width:0; }
.ev-adjunto-fila .n { font-size:11.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ev-adjunto-fila .s { font-size:9.5px; color:var(--text-dim); }
.ev-btn-portada { background:var(--panel-dark); border:1px solid var(--border-glow); color:var(--text-muted); font-size:10px;
  font-weight:800; padding:4px 8px; border-radius:7px; cursor:pointer; flex-shrink:0; white-space:nowrap; }
.ev-btn-portada.activo { background:var(--accent-orange); border-color:var(--accent-orange); color:#0a1424; }
.ev-portada-banner { display:flex; align-items:center; gap:10px; background:var(--panel-darker); border:1px solid var(--border-glow);
  border-radius:11px; padding:9px 11px; margin-bottom:14px; }
.ev-portada-banner img { width:48px; height:48px; border-radius:8px; object-fit:cover; flex-shrink:0; }
.ev-card-portada { width:100%; height:64px; border-radius:9px 9px 0 0; margin:-10px -11px 8px; overflow:hidden; }
.ev-card-portada img { width:100%; height:100%; object-fit:cover; display:block; }
.ev-card-portada-icono { display:flex; align-items:center; justify-content:center; background:var(--panel-darker);
  cursor:pointer; font-size:22px; border-bottom:1px solid var(--border-glow); }

/* ── Responsive — listas de comprobación en pantalla chica ──
   Este archivo no tenía NINGUNA @media query (confirmado con grep) —
   el checklist ya usaba flexbox razonable (min-width:0, flex-shrink:0
   en checkbox/botón) así que no se rompía del todo, pero en celulares
   angostos quedaba todo apretado: el título del checklist + el
   contador + el botón de borrar peleando por espacio en una sola
   fila, y la fila de "Agregar ítem" (input + botón lado a lado) muy
   ajustada con el placeholder largo. Pedido por Cristian: "hacer las
   listas de comprobación responsivas". */
/* Ensanchado de 480px a 600px — Cristian reportó que el layout
   responsive "empieza en 2 renglones y al segundo se pone así"
   (vuelve al layout ancho, Agregar ítem + botón lado a lado). Con el
   corte pegado a 480px, cualquier cambio mínimo de ancho disponible
   entre el primer render (caché) y el segundo (datos frescos —
   scrollbar que aparece/desaparece según cambie el alto del
   contenido, por ejemplo) podía empujar el ancho justo por encima del
   corte y sacar la regla. 600px da mucho más margen — cubre incluso
   los celulares más anchos sin quedar al filo. */
/* Responsive INTRÍNSECO — el intento anterior (@media max-width)
   medía el ancho de TODA LA PANTALLA, pero este checklist vive
   ADENTRO de ".ev-overlay-col-principal", una columna que se achica
   cuando aparece el chat al lado (desde los 960px de ancho de
   pantalla, ver .ev-overlay-col-mensajes más arriba). Un breakpoint
   fijo no puede saber cuánto le queda a ESA columna puntual — a veces
   sobraba espacio y no hacía falta apilar, a veces faltaba y el corte
   no llegaba a tiempo. Reportado por Cristian con 2 capturas más:
   "empieza responsivo en 2 renglones y al segundo se pone así" seguía
   pasando incluso en pantallas anchas de escritorio, con el chat al
   lado achicando la columna real.
   Fix real: en vez de adivinar un ancho de pantalla, cada elemento se
   ajusta solo al espacio que tiene DISPONIBLE en ese momento —
   flex-wrap dice "poné el botón al lado si entra, si no, a la línea
   de abajo", sin ningún número mágico de por medio. Funciona igual en
   el celular más angosto que en la columna apretada del desktop. */
.ev-checklist-grupo-header { flex-wrap:wrap; row-gap:4px; }
.ev-check-add-row-chico { flex-wrap:wrap; }
.ev-check-add-row-chico > input { flex:1 1 180px; min-width:0; }
.ev-check-add-row-chico > button { flex:0 0 auto; }
.ev-det-grid { grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); }

/* Estos sí son puramente cosméticos (achicar letra/padding), tiene
   sentido que dependan del ancho real de PANTALLA (celular chico),
   no del contenedor — se dejan como @media, separados de las reglas
   estructurales de arriba. */
@media (max-width: 480px) {
  .ev-checklist-grupo { padding:10px; }
  .ev-checklist-titulo-input { font-size:12px; }
  .ev-check-item-fila { gap:6px; padding:6px 0; }
  .ev-check-item-texto-fija { font-size:13px; }
}
</style>

<body>

<div class="ev-header">
  <button class="ev-btn-back" onclick="_volverEventos()">←</button>
  <div class="ev-header-title">
    <img id="ev-hdr-logo" class="ev-hdr-logo" style="display:none;" alt="">
    <div class="ev-hdr-textos">
      <h1 id="ev-hdr-titulo">Gestión Eventos / Congresos</h1>
      <p id="ev-hdr-sub">TLC Planner</p>
    </div>
  </div>
  <button class="ev-icon-btn" onclick="_toggleTemaEv()" id="ev-btn-tema" title="Tema">🌙</button>
  <button class="ev-icon-btn" onclick="_toggleCampanaEv(event)" title="Notificaciones">
    🔔<span class="ev-badge" id="ev-campana-badge" style="display:none;">0</span>
  </button>
</div>

<div class="ev-body">

  <!-- ═══ VISTA: Tablero ═══ -->
  <div id="ev-vista-tablero" style="display:none;">
    <div class="ev-tablero-topbar">
      <select class="ev-select-evento" id="ev-select-evento" onchange="_cambiarEventoDesdeSelect(this.value)"></select>
      <div class="ev-view-switch" id="ev-view-switch">
        <button data-vista="board" onclick="_cambiarVistaEv('board')">▦ Tablero</button>
        <button data-vista="list" class="activo" onclick="_cambiarVistaEv('list')">☰ Lista</button>
      </div>
      <div style="position:relative;flex-shrink:0;">
        <button class="ev-btn-menu-tarjeta" onclick="_toggleMenuEvento(event)" title="Más acciones del evento">⋯</button>
        <div class="ev-menu-tarjeta-dropdown" id="ev-menu-evento-dropdown">
          <button onclick="_copiarLinkEvento()">🔗 Copiar link de este evento</button>
          <button id="ev-menu-logo-evento" onclick="document.getElementById('ev-menu-evento-dropdown').classList.remove('abierto'); document.getElementById('ev-input-logo-evento').click();" style="display:none;">🖼️ Agregar logo al evento</button>
          <button id="ev-menu-quitar-logo-evento" onclick="_quitarLogoEventoJs()" style="display:none;">🚫 Quitar logo del evento</button>
          <button id="ev-menu-duplicar-evento" onclick="_duplicarEventoActual()" style="display:none;">📋 Duplicar evento</button>
          <button id="ev-menu-borrar-evento" class="rojo" onclick="_confirmarBorrarEvento()" style="display:none;">🗑️ Borrar evento</button>
        </div>
        <input type="file" id="ev-input-logo-evento" accept=".png,.jpg,.jpeg,.webp,.svg" style="display:none;" onchange="_subirLogoEventoJs(event)">
      </div>
    </div>
    <div class="ev-filtros" id="ev-filtros">
      <input type="search" class="ev-search-input" id="ev-search-input" placeholder="Buscar tareas, responsables o checklists..." autocomplete="off" oninput="_onBuscarConDebounceEv()">
      <select id="ev-filtro-responsable" onchange="_aplicarFiltrosEv()"><option value="">Responsable: todos</option></select>
      <select id="ev-filtro-categoria" onchange="_aplicarFiltrosEv()"><option value="">Categoría: todas</option></select>
      <select id="ev-filtro-vencimiento" onchange="_aplicarFiltrosEv()">
        <option value="">Vencimiento: todas</option>
        <option value="overdue">Vencidas</option>
        <option value="today">Hoy</option>
        <option value="next-7">Próximos 7 días</option>
        <option value="no-date">Sin fecha</option>
      </select>
      <select id="ev-filtro-progreso" onchange="_aplicarFiltrosEv()">
        <option value="">Progreso: todos</option>
        <option value="no-checklist">Sin checklist</option>
        <option value="not-started">Sin empezar</option>
        <option value="in-progress">En curso</option>
        <option value="complete">Completo</option>
      </select>
      <button class="ev-filtro-limpiar" id="ev-filtro-limpiar" onclick="_limpiarFiltrosEv()" style="display:none;">✕ Limpiar filtros</button>
    </div>
    <div class="ev-board" id="ev-board"></div>

</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbww2WC4wuvCiZnl59SzaKCMLvF99Zm3DSI7jB2sfo9x7nZis3V79YjfElha2KGDG7sC/exec';
var SESSION_KEY = 'tlc_session_v1';
var TEMA_KEY = 'tlc_tema';
var _session = null;
var EVENTOS = [];
var EVENTO_ACTUAL = null; // objeto completo con columnas + tarjetas
var TARJETA_ACTUAL_ID = null;
var _internosCacheEv = null;
var _mencionCandidatosEv = [];
var _mencionIndiceResaltadoEv = -1;
var _dragTarjetaId = null;

function _esc(s) {
  return String(s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ── Tema (misma clave compartida que el resto del Portal — cambiarlo
//    acá también se refleja en index.html/servicio.html/etc.) ──
function _aplicarTemaEv() {
  var t = localStorage.getItem(TEMA_KEY) || 'dark';
  document.body.classList.toggle('tema-claro', t === 'light');
  var btn = document.getElementById('ev-btn-tema');
  if (btn) btn.textContent = t === 'light' ? '☀️' : '🌙';
}
window._toggleTemaEv = function() {
  var actual = localStorage.getItem(TEMA_KEY) || 'dark';
  localStorage.setItem(TEMA_KEY, actual === 'light' ? 'dark' : 'light');
  _aplicarTemaEv();
};
_aplicarTemaEv();

async function _cargarSesion() {
  try {
    var raw = localStorage.getItem(SESSION_KEY);
    if (!raw) { _redirigirLoginEv(); return false; }
    var payload = JSON.parse(raw);
    _session = payload && payload.account ? payload.account : payload;
    if (!_session || !_session.username) { _redirigirLoginEv(); return false; }
    return true;
  } catch(e) { _redirigirLoginEv(); return false; }
}
function _redirigirLoginEv() { window.location.href = 'index.html'; }

function _volverEventos() {
  window.location.href = 'index.html';
}

(async function() {
  var acceso = typeof validarAccesoModulo === 'function' ? await validarAccesoModulo('Eventos') : true;
  if (!acceso) return;
  var ok = await _cargarSesion();
  if (!ok) return;
  var params = new URLSearchParams(window.location.search);
  var idUrl = params.get('id');
  var tarjetaUrl = params.get('tarjeta');

  // Cache-first también acá — si no vino un ?id= puntual por URL pero
  // ya sabemos qué evento se abrió la última vez Y tenemos su caché
  // guardada, ni siquiera hace falta esperar la lista completa de
  // eventos (ev_listarEventos) para decidir cuál abrir: directo a
  // _abrirEvento con ese id, que YA sabe pintar desde caché al
  // instante y actualizar todo (lista incluida, vía _renderSelectEventos
  // después del fetch en segundo plano) sin bloquear nada. Pedido por
  // Cristian: "tanto el tablero como las tarjetas abran en 0
  // milisegundos desde caché local mientras se sincronizan en segundo
  // plano".
  var idCacheDirecto = null;
  if (!idUrl) {
    try {
      var idGuardadoTemprano = localStorage.getItem('ev_ultimo_evento_id');
      if (idGuardadoTemprano && localStorage.getItem('ev_cache_' + idGuardadoTemprano)) idCacheDirecto = idGuardadoTemprano;
    } catch(eLsTemprano) {}
  }
  if (idUrl || idCacheDirecto) {
    _abrirEvento(idUrl || idCacheDirecto, tarjetaUrl);
    // BUG encontrado por Cristian: al entrar directo desde caché (sin
    // esperar la lista completa primero), el desplegable de eventos
    // se pintaba con EVENTOS todavía vacío (la lista real se pide
    // ACÁ, en segundo plano) — y nunca se repintaba cuando esa lista
    // real llegaba, así que el desplegable se quedaba mostrando SOLO
    // "Crear nuevo evento", sin ninguno de los eventos existentes.
    // Ahora, cuando termina de cargar, se repinta el desplegable con
    // la lista real. Reportado por Cristian con captura: "no me carga
    // en la lista desplegable los eventos existentes que son 3".
    _cargarEventos().then(function() { _renderSelectEventos(); });
    _cargarNotificaciones(true);
    setInterval(function(){ _cargarNotificaciones(true); }, 45000);
    return;
  }

  // Sin ?id= ni caché de un evento previo — hace falta la lista sí o
  // sí, para decidir cuál abrir (primera vez en este navegador).
  document.getElementById('ev-vista-tablero').style.display = 'block';
  document.getElementById('ev-board').innerHTML = '<div style="padding:30px;text-align:center;"><div class="spinner" style="margin:0 auto 10px;"></div><span style="color:var(--text-muted);font-size:13px;">Cargando eventos...</span></div>';
  await _cargarEventos();
  // Ya no hay pantalla intermedia para "elegir evento" — entra directo
  // al tablero. Prioridad: (1) ?id= puntual en la URL (deep-link desde
  // una notificación o un link compartido), (2) el último evento que
  // se abrió en este navegador (localStorage), (3) el primero de la
  // lista si no hay ninguno guardado todavía. Pedido por Cristian:
  // "podés borrarla y aparecer directamente [en el tablero]".
  var idParaAbrir = idUrl;
  if (!idParaAbrir) {
    var idGuardado = null;
    try { idGuardado = localStorage.getItem('ev_ultimo_evento_id'); } catch(eLs) {}
    if (idGuardado && EVENTOS.some(function(e){ return e.id === idGuardado; })) idParaAbrir = idGuardado;
    else if (EVENTOS.length) idParaAbrir = EVENTOS[0].id;
  }
  if (idParaAbrir) {
    _abrirEvento(idParaAbrir, tarjetaUrl);
  } else if (_errorCargaEventos) {
    // El pedido al backend FALLÓ (404, timeout, sin conexión, etc.) —
    // antes esto mostraba el mismo mensaje que "no hay eventos", algo
    // engañoso: parecía que se habían borrado todos los eventos
    // cuando en realidad ni siquiera se pudo consultar el backend.
    // Reportado por Cristian con captura: "eventos no carga y no pone
    // el placeholder, no pone nada".
    document.getElementById('ev-vista-tablero').style.display = 'block';
    document.getElementById('ev-board').innerHTML =
      '<div style="text-align:center;padding:60px 20px;color:var(--text-muted);">' +
        '<div style="font-size:15px;font-weight:700;margin-bottom:10px;color:#dc2626;">⚠️ No se pudo conectar</div>' +
        '<div style="font-size:12.5px;margin-bottom:16px;">No se pudo traer la lista de eventos — puede ser un problema de conexión o del servidor. Tus eventos siguen ahí, esto no los borró.</div>' +
        '<button class="ev-btn-primario" style="width:auto;padding:9px 20px;" onclick="location.reload()">🔄 Reintentar</button>' +
      '</div>';
  } else {
    // Acá SÍ es un caso genuino: el pedido funcionó bien y la lista
    // vino realmente vacía — mensaje amigable en vez de un tablero
    // vacío/roto, con la acción de crear.
    document.getElementById('ev-vista-tablero').style.display = 'block';
    document.getElementById('ev-board').innerHTML =
      '<div style="text-align:center;padding:60px 20px;color:var(--text-muted);">' +
        '<div style="font-size:15px;font-weight:700;margin-bottom:10px;color:var(--text-main);">Todavía no hay eventos cargados</div>' +
        '<div style="font-size:12.5px;margin-bottom:16px;">Creá el primero para arrancar.</div>' +
        (_session.rol === 'Administrador' ? '<button class="ev-btn-primario" style="width:auto;padding:9px 20px;" onclick="_abrirModalNuevoEvento()">+ Crear evento</button>' : '') +
      '</div>';
  }
  _cargarNotificaciones(true);
  setInterval(function(){ _cargarNotificaciones(true); }, 45000);
})();

function _esAdministradorEv() { return _session && _session.rol === 'Administrador'; }

// ══════════════════════════════════════════════════════════════════
// EVENTOS — listar / crear / abrir
// ══════════════════════════════════════════════════════════════════
var _errorCargaEventos = false; // distingue "falló el pedido" de "no hay eventos de verdad" — antes ambos casos mostraban el mismo mensaje engañoso de "crear tu primer evento"
async function _cargarEventos() {
  _errorCargaEventos = false;
  try {
    var resp = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ accion:'ev_listarEventos' }) });
    var r = await resp.json();
    if (r.ok && Array.isArray(r.eventos)) {
      EVENTOS = r.eventos;
    } else {
      EVENTOS = [];
      _errorCargaEventos = true;
    }
  } catch(e) {
    EVENTOS = [];
    _errorCargaEventos = true;
  }
}

function _abrirModalNuevoEvento() {
  var nombre = prompt('Nombre del evento o congreso (ej. "Faco Extrema 2026"):');
  if (!nombre || !nombre.trim()) return;
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ accion:'ev_crearEvento', nombre: nombre.trim(), vendedorRol: _session.rol }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert('Error al crear: ' + (r.error||'desconocido')); return; }
      _abrirEvento(r.id);
    });
}

// ── Menú de acciones del evento (⋯) — mismo patrón que el de la
// tarjeta. Pedido por Cristian: "en el evento mismo efecto con 3
// puntitos, copiar este link del evento, duplicar, borrar, todos los
// eventos, etc".
window._toggleMenuEvento = function(ev) {
  ev.stopPropagation();
  document.getElementById('ev-menu-evento-dropdown').classList.toggle('abierto');
};
document.addEventListener('click', function(ev) {
  var dd = document.getElementById('ev-menu-evento-dropdown');
  if (dd && dd.classList.contains('abierto') && !dd.contains(ev.target) && !ev.target.closest('.ev-btn-menu-tarjeta')) {
    dd.classList.remove('abierto');
  }
});

function _copiarLinkEvento() {
  document.getElementById('ev-menu-evento-dropdown').classList.remove('abierto');
  if (!EVENTO_ACTUAL) return;
  var link = 'https://ir.tlcsrl.com.ar/eventos.html?id=' + encodeURIComponent(EVENTO_ACTUAL.id);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(function(){ alert('✅ Link copiado.'); }).catch(function(){ prompt('Copiá este link:', link); });
  } else {
    prompt('Copiá este link:', link);
  }
}

function _duplicarEventoActual() {
  document.getElementById('ev-menu-evento-dropdown').classList.remove('abierto');
  if (!EVENTO_ACTUAL) return;
  if (!confirm('¿Duplicar el evento "' + EVENTO_ACTUAL.nombre + '" con todas sus tarjetas y checklists (sin tildar)? Las notas, adjuntos y mensajes NO se copian.')) return;
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_duplicarEvento', id: EVENTO_ACTUAL.id, vendedorRol: _session.rol }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert('Error: ' + (r.error||'')); return; }
      _cargarEventos().then(function() { _abrirEvento(r.id); });
    });
}

// ── Logo del evento ──
function _actualizarLogoHeaderEv() {
  var img = document.getElementById('ev-hdr-logo');
  if (EVENTO_ACTUAL && EVENTO_ACTUAL.logo && EVENTO_ACTUAL.logo.url) {
    img.src = EVENTO_ACTUAL.logo.url;
    img.style.display = 'block';
  } else {
    img.style.display = 'none';
  }
}
function _subirLogoEventoJs(ev) {
  var file = ev.target.files[0];
  ev.target.value = '';
  if (!file || !EVENTO_ACTUAL) return;
  if (file.size > 3 * 1024 * 1024) { alert('El logo pesa más de 3MB — subí uno más liviano.'); return; }
  var extPermitidas = ['png','jpg','jpeg','webp','svg'];
  var ext = (file.name.split('.').pop() || '').toLowerCase();
  if (extPermitidas.indexOf(ext) === -1) { alert('Formato no permitido — usá PNG, JPG, WEBP o SVG.'); return; }
  var reader = new FileReader();
  reader.onload = function() {
    var base64 = reader.result.split(',')[1];
    fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({
      accion:'ev_subirLogoEvento', id: EVENTO_ACTUAL.id, nombre: file.name, tipoMime: file.type, base64: base64, vendedorRol: _session.rol,
    }) })
      .then(function(r){ return r.json(); })
      .then(function(r) {
        if (!r.ok) { alert('Error al subir el logo: ' + (r.error||'')); return; }
        EVENTO_ACTUAL.logo = r.logo;
        _actualizarLogoHeaderEv();
        var ev2 = EVENTOS.find(function(e){ return e.id === EVENTO_ACTUAL.id; });
        if (ev2) ev2.logo = r.logo;
        var btnLogoEv = document.getElementById('ev-menu-logo-evento');
        var btnQuitarLogoEv = document.getElementById('ev-menu-quitar-logo-evento');
        if (btnLogoEv) btnLogoEv.textContent = '🖼️ Cambiar logo del evento';
        if (btnQuitarLogoEv) btnQuitarLogoEv.style.display = 'block';
      });
  };
  reader.readAsDataURL(file);
}
function _quitarLogoEventoJs() {
  document.getElementById('ev-menu-evento-dropdown').classList.remove('abierto');
  if (!EVENTO_ACTUAL || !confirm('¿Quitar el logo de este evento?')) return;
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({
    accion:'ev_quitarLogoEvento', id: EVENTO_ACTUAL.id, vendedorRol: _session.rol,
  }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert('Error: ' + (r.error||'')); return; }
      EVENTO_ACTUAL.logo = null;
      _actualizarLogoHeaderEv();
      var ev2 = EVENTOS.find(function(e){ return e.id === EVENTO_ACTUAL.id; });
      if (ev2) ev2.logo = null;
      var btnLogoEv = document.getElementById('ev-menu-logo-evento');
      var btnQuitarLogoEv = document.getElementById('ev-menu-quitar-logo-evento');
      if (btnLogoEv) btnLogoEv.textContent = '🖼️ Agregar logo al evento';
      if (btnQuitarLogoEv) btnQuitarLogoEv.style.display = 'none';
    });
}

function _confirmarBorrarEvento() {
  document.getElementById('ev-menu-evento-dropdown').classList.remove('abierto');
  _borrarEventoActual();
}

function _borrarEventoActual() {
  if (!EVENTO_ACTUAL) return;
  if (!confirm('¿Borrar el evento "' + EVENTO_ACTUAL.nombre + '" con TODAS sus tarjetas, checklists y adjuntos? No se puede deshacer.')) return;
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_borrarEvento', id: EVENTO_ACTUAL.id, vendedorRol: _session.rol }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert('Error: ' + (r.error||'')); return; }
      _volverASelectorEventos();
    });
}

// Aplica los datos de un evento (de caché o recién bajados) al DOM —
// separado de _abrirEvento para poder reusarlo tanto en el pintado
// instantáneo desde caché como en la actualización silenciosa cuando
// llega la respuesta real del backend.
function _aplicarEventoActualEv(id, tarjetaId) {
  document.getElementById('ev-hdr-titulo').textContent = EVENTO_ACTUAL.nombre;
  document.getElementById('ev-hdr-sub').textContent = EVENTO_ACTUAL.tarjetas.length + ' tarjetas';
  _actualizarLogoHeaderEv();
  var esAdmin = _esAdministradorEv();
  var btnDuplicarEv = document.getElementById('ev-menu-duplicar-evento');
  var btnBorrarEv = document.getElementById('ev-menu-borrar-evento');
  var btnLogoEv = document.getElementById('ev-menu-logo-evento');
  var btnQuitarLogoEv = document.getElementById('ev-menu-quitar-logo-evento');
  if (btnDuplicarEv) btnDuplicarEv.style.display = esAdmin ? 'block' : 'none';
  if (btnBorrarEv) btnBorrarEv.style.display = esAdmin ? 'block' : 'none';
  if (btnLogoEv) {
    btnLogoEv.style.display = esAdmin ? 'block' : 'none';
    btnLogoEv.textContent = (EVENTO_ACTUAL.logo && EVENTO_ACTUAL.logo.url) ? '🖼️ Cambiar logo del evento' : '🖼️ Agregar logo al evento';
  }
  if (btnQuitarLogoEv) btnQuitarLogoEv.style.display = (esAdmin && EVENTO_ACTUAL.logo && EVENTO_ACTUAL.logo.url) ? 'block' : 'none';
  if (!_internosCacheEv) _cargarInternosEv();
  _renderSelectEventos();
  _renderFiltrosEv();
  _renderTablero();
  _cambiarVistaEv(VISTA_ACTUAL_EV);
  history.replaceState(null, '', 'eventos.html?id=' + encodeURIComponent(id));
  if (tarjetaId && EVENTO_ACTUAL.tarjetas.some(function(t){ return t.id === tarjetaId; })) {
    _abrirTarjeta(tarjetaId);
  }
}

// Cache-first — si ya visitaste este evento antes en este navegador,
// se pinta con lo último que quedó guardado ANTES de siquiera pedirle
// nada al backend (0ms de espera), y se actualiza sola en segundo
// plano cuando llega la respuesta real, sin volver a mostrar ningún
// spinner. Si es la primera vez (sin caché todavía), no hay forma de
// evitar esperar el primer pedido — ahí sí se ve el spinner, como
// antes. Pedido por Cristian: "necesito que tanto el tablero como las
// tarjetas abran en 0 milisegundos desde caché local mientras se
// sincronizan en segundo plano".
async function _abrirEvento(id, tarjetaId) {
  document.getElementById('ev-vista-tablero').style.display = 'block';
  VISTA_ACTUAL_EV = _vistaPorDefectoEv();

  var cacheado = null;
  try {
    var crudo = localStorage.getItem('ev_cache_' + id);
    if (crudo) cacheado = JSON.parse(crudo);
  } catch(eCache) { cacheado = null; }

  if (cacheado) {
    // Pintado instantáneo desde lo último guardado — sin spinner.
    EVENTO_ACTUAL = cacheado;
    try { localStorage.setItem('ev_ultimo_evento_id', id); } catch(eLs) {}
    _aplicarEventoActualEv(id, tarjetaId);
  } else {
    // Primera vez que se abre este evento en este navegador — no hay
    // nada para mostrar todavía, así que sí hace falta esperar.
    document.getElementById('ev-board').innerHTML = '<div style="padding:30px;text-align:center;"><div class="spinner" style="margin:0 auto 10px;"></div><span style="color:var(--text-muted);font-size:13px;">Cargando eventos...</span></div>';
  }

  // El pedido real SIEMPRE se dispara (haya caché o no) — para
  // refrescar datos que puedan haber cambiado desde otro dispositivo.
  // Si había caché, esto corre en segundo plano sin bloquear nada.
  var pedido = fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ accion:'ev_obtenerEvento', id: id }) })
    .then(function(resp) { return resp.json(); })
    .then(function(r) {
      if (!r.ok) throw new Error(r.error || 'Error desconocido');
      EVENTO_ACTUAL = r.evento;
      try {
        localStorage.setItem('ev_ultimo_evento_id', id);
        localStorage.setItem('ev_cache_' + id, JSON.stringify(r.evento));
      } catch(eLs) {}
      // Repinta siempre, tanto si fue la primera carga (sacando el
      // spinner) como si fue una actualización silenciosa sobre lo
      // que ya se veía desde caché.
      _aplicarEventoActualEv(id, tarjetaId);
    });

  if (!cacheado) {
    // Sin caché, si o si hay que esperar esto — no hay nada más para
    // mostrar mientras tanto.
    try {
      await pedido;
    } catch(e) {
      alert('Error de conexión al abrir el evento.');
      _volverASelectorEventos();
    }
  } else {
    // Con caché ya mostrado, la actualización de fondo no debe
    // interrumpir al usuario si falla — se queda con lo que ya tenía
    // en pantalla (mejor eso que un alert molesto sobre algo que ya
    // estaba viendo bien).
    pedido.catch(function(e) { console.warn('[Eventos] No se pudo refrescar en segundo plano:', e); });
  }
}

function _renderSelectEventos() {
  var opciones = EVENTOS.map(function(e) {
    return '<option value="' + e.id + '"' + (EVENTO_ACTUAL && EVENTO_ACTUAL.id === e.id ? ' selected' : '') + '>📅 ' + _esc(e.nombre) + '</option>';
  }).join('');
  // "+ Crear nuevo evento" al final del desplegable — mismo patrón que
  // el selector de pipelines en cotizaciones.html. Solo Administrador
  // puede crear eventos (ya lo valida el backend), así que este ítem
  // se agrega igual para todos pero, si alguien sin permiso lo elige,
  // el backend lo va a rechazar con el aviso correspondiente.
  opciones += '<option value="__crear__">➕ Crear nuevo evento...</option>';
  document.getElementById('ev-select-evento').innerHTML = opciones;
}
function _cambiarEventoDesdeSelect(id) {
  if (id === '__crear__') {
    // Vuelve el desplegable al evento actual antes de disparar el
    // prompt — si el usuario cancela, no se queda trabado mostrando
    // "Crear nuevo evento..." como si fuera el evento abierto.
    _renderSelectEventos();
    _abrirModalNuevoEvento();
    return;
  }
  if (id) _abrirEvento(id);
}

// ── Vista Tablero / Lista ──
// Por defecto: Tablero en PC (pantalla ancha), Lista en celular
// (pantalla angosta) — la Lista es más liviana y cómoda para tocar
// con el dedo, el Tablero aprovecha mejor el espacio horizontal de un
// monitor. Mismo corte de 640px que ya usa el resto del Portal para
// distinguir mobile/desktop. Pedido por Cristian: "volvé a abrir en
// PC modo tablero y en móvil modo lista".
function _vistaPorDefectoEv() {
  return (window.innerWidth <= 640) ? 'list' : 'board';
}

var CATEGORIAS_EV = {
  'Diseño':        { bg:'rgba(139,92,246,.15)', color:'#8b5cf6' },
  'Logística':     { bg:'rgba(58,134,255,.15)', color:'#3a86ff' },
  'Stand':         { bg:'rgba(6,214,160,.15)',  color:'#06d6a0' },
  'Marketing':     { bg:'rgba(248,150,30,.15)', color:'#f8961e' },
  'Seguros':       { bg:'rgba(239,68,68,.15)',  color:'#f87171' },
  'Equipos':       { bg:'rgba(56,189,248,.15)', color:'#38bdf8' },
  'Merchandising': { bg:'rgba(236,72,153,.15)', color:'#ec4899' },
};

function _fechaLimiteInfo(fecha) {
  if (!fecha) return { html:'', clase:'' };
  var hoy = new Date(); hoy.setHours(0,0,0,0);
  var f = new Date(fecha + 'T00:00:00');
  var diffDias = Math.round((f - hoy) / 86400000);
  var clase = diffDias < 0 ? 'vencida' : (diffDias <= 3 ? 'proxima' : '');
  var txt = f.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' });
  return { html: '📅 ' + txt, clase: clase };
}

function _renderTablero() {
  var board = document.getElementById('ev-board');
  var columnas = (EVENTO_ACTUAL.columnas || []).slice().sort(function(a,b){ return (a.orden||0) - (b.orden||0); });
  var tarjetasPorColumna = {};
  columnas.forEach(function(c) { tarjetasPorColumna[c.id] = []; });
  EVENTO_ACTUAL.tarjetas.forEach(function(t) {
    if (!tarjetasPorColumna[t.columna_id]) tarjetasPorColumna[t.columna_id] = [];
    tarjetasPorColumna[t.columna_id].push(t);
  });
  Object.keys(tarjetasPorColumna).forEach(function(cid) {
    tarjetasPorColumna[cid].sort(function(a,b){ return (a.orden||0) - (b.orden||0); });
  });

  board.innerHTML = columnas.map(function(col) {
    var tarjetas = tarjetasPorColumna[col.id] || [];
    return '<div class="ev-col" id="ev-col-' + col.id + '" ondragover="_dragOverCol(event,\'' + col.id + '\')" ondragleave="_dragLeaveCol(event,\'' + col.id + '\')" ondrop="_dropEnCol(event,\'' + col.id + '\')">' +
      '<div class="ev-col-header">' +
        '<div><span class="ev-col-dot" style="background:' + (col.color||'#3a86ff') + ';"></span><span class="ev-col-nombre">' + _esc(col.nombre) + '</span><span class="ev-col-count">' + tarjetas.length + '</span></div>' +
        '<button class="ev-col-menu-btn" onclick="_menuColumna(event,\'' + col.id + '\')">⋯</button>' +
      '</div>' +
      tarjetas.map(_renderCard).join('') +
      '<button class="ev-col-add-tarjeta" onclick="_abrirModalNuevaTarjeta(\'' + col.id + '\')">+ Nueva tarjeta</button>' +
    '</div>';
  }).join('') + (_esAdministradorEv() ? '<div class="ev-col-nueva" onclick="_abrirModalNuevaColumna()">+ Nueva columna</div>' : '');
  _aplicarFiltrosEv();
}

// ── Filtros — Responsable y Categoría, mismo criterio visual que
//    Ventas/Servicio. Se aplican ocultando tarjetas con CSS, no
//    volviendo a pedir datos al servidor — es instantáneo y no rompe
//    el drag & drop de las que sí quedan visibles.
function _progresoAgregado(t) {
  var checklists = Array.isArray(t.checklists) ? t.checklists : [];
  var total = 0, hechos = 0;
  checklists.forEach(function(g) { (g.items||[]).forEach(function(i){ total++; if (i.hecho) hechos++; }); });
  return { total: total, hechos: hechos, pct: total ? Math.round(hechos/total*100) : 0 };
}
function _hoyISOev() { return new Date().toISOString().slice(0,10); }

function _textoBusquedaTarjetaEv(t) {
  var checklistTxt = (t.checklists||[]).map(function(g) { return g.titulo + ' ' + (g.items||[]).map(function(i){return i.texto;}).join(' '); }).join(' ');
  var notasTxt = (t.notas||[]).map(function(n){ return n.texto; }).join(' ');
  var archivosTxt = (t.adjuntos||[]).map(function(a){ return a.nombre; }).join(' ');
  return [t.titulo, t.descripcion, t.categoria, t.responsable_nombre, checklistTxt, notasTxt, archivosTxt].join(' ').toLocaleLowerCase('es');
}

function _renderFiltrosEv() {
  var selResp = document.getElementById('ev-filtro-responsable');
  var valorPrevioResp = selResp.value;
  selResp.innerHTML = '<option value="">Responsable: todos</option>' +
    (_internosCacheEv || []).map(function(p) { return '<option value="' + _esc(p.email) + '">' + _esc(p.nombre) + '</option>'; }).join('');
  selResp.value = valorPrevioResp;

  var selCat = document.getElementById('ev-filtro-categoria');
  var valorPrevioCat = selCat.value;
  selCat.innerHTML = '<option value="">Categoría: todas</option>' +
    Object.keys(CATEGORIAS_EV).map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
  selCat.value = valorPrevioCat;
}

function _tarjetaPasaFiltrosEv(t) {
  var busqueda = (document.getElementById('ev-search-input') || {}).value || '';
  busqueda = busqueda.trim().toLocaleLowerCase('es');
  var resp = (document.getElementById('ev-filtro-responsable') || {}).value || '';
  var cat = (document.getElementById('ev-filtro-categoria') || {}).value || '';
  var venc = (document.getElementById('ev-filtro-vencimiento') || {}).value || '';
  var prog = (document.getElementById('ev-filtro-progreso') || {}).value || '';

  if (busqueda && _textoBusquedaTarjetaEv(t).indexOf(busqueda) === -1) return false;
  if (resp && t.responsable_email !== resp) return false;
  if (cat && t.categoria !== cat) return false;

  if (venc) {
    var hoy = _hoyISOev();
    if (venc === 'no-date' && t.fecha_limite) return false;
    if (venc !== 'no-date' && !t.fecha_limite) return false;
    if (venc === 'overdue' && !(t.fecha_limite < hoy)) return false;
    if (venc === 'today' && t.fecha_limite !== hoy) return false;
    if (venc === 'next-7') {
      var en7 = new Date(); en7.setDate(en7.getDate()+7);
      var en7iso = en7.toISOString().slice(0,10);
      if (!(t.fecha_limite >= hoy && t.fecha_limite <= en7iso)) return false;
    }
  }

  if (prog) {
    var p = _progresoAgregado(t);
    if (prog === 'no-checklist' && p.total !== 0) return false;
    if (prog === 'not-started' && !(p.total > 0 && p.hechos === 0)) return false;
    if (prog === 'in-progress' && !(p.total > 0 && p.hechos > 0 && p.hechos < p.total)) return false;
    if (prog === 'complete' && !(p.total > 0 && p.hechos === p.total)) return false;
  }

  return true;
}

// Debounce del buscador — con un tablero grande, refiltrar TODAS las
// tarjetas en cada tecla tipeada podía sumar, sobre todo en una compu
// vieja/débil. Espera 200ms de pausa antes de aplicar el filtro.
var _debounceBusquedaEv = null;
function _onBuscarConDebounceEv() {
  clearTimeout(_debounceBusquedaEv);
  _debounceBusquedaEv = setTimeout(_aplicarFiltrosEv, 200);
}

window._aplicarFiltrosEv = function() {
  document.querySelectorAll('.ev-card').forEach(function(card) {
    var t = EVENTO_ACTUAL.tarjetas.find(function(x){ return x.id === card.dataset.idTarjeta; });
    card.classList.toggle('ev-filtrada-fuera', !(t && _tarjetaPasaFiltrosEv(t)));
  });
  var busqueda = (document.getElementById('ev-search-input') || {}).value || '';
  var resp = (document.getElementById('ev-filtro-responsable') || {}).value || '';
  var cat = (document.getElementById('ev-filtro-categoria') || {}).value || '';
  var venc = (document.getElementById('ev-filtro-vencimiento') || {}).value || '';
  var prog = (document.getElementById('ev-filtro-progreso') || {}).value || '';
  var btnLimpiar = document.getElementById('ev-filtro-limpiar');
  if (btnLimpiar) btnLimpiar.style.display = (busqueda || resp || cat || venc || prog) ? 'inline-block' : 'none';
  if (VISTA_ACTUAL_EV === 'list') _renderListaTarjetasEv();
};

window._limpiarFiltrosEv = function() {
  document.getElementById('ev-search-input').value = '';
  document.getElementById('ev-filtro-responsable').value = '';
  document.getElementById('ev-filtro-categoria').value = '';
  document.getElementById('ev-filtro-vencimiento').value = '';
  document.getElementById('ev-filtro-progreso').value = '';
  _aplicarFiltrosEv();
};

// ── Vista Lista — todas las tarjetas del evento, sin agrupar por
// columna, con la misma info que la tarjeta del tablero. Pedido por
// Cristian: "usa todo lo que puedas de la nueva UX eventos-v5".
function _renderListaTarjetasEv() {
  var cont = document.getElementById('ev-list-wrap');
  if (!cont || !EVENTO_ACTUAL) return;
  var visibles = EVENTO_ACTUAL.tarjetas.filter(_tarjetaPasaFiltrosEv);
  if (!visibles.length) { cont.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-muted);">Sin tarjetas para estos filtros.</div>'; return; }
  cont.innerHTML = visibles.map(function(t) {
    var col = (EVENTO_ACTUAL.columnas || []).find(function(c){ return c.id === t.columna_id; });
    var cat = CATEGORIAS_EV[t.categoria] || { bg:'rgba(148,163,184,.15)', color:'#94a3b8' };
    var p = _progresoAgregado(t);
    var fechaInfo = _fechaLimiteInfo(t.fecha_limite);
    var nombrePila = (t.responsable_nombre || '').trim().split(' ')[0] || '';
    var inicialResp = nombrePila.charAt(0).toUpperCase() || '?';
    return '<div class="ev-list-fila" onclick="_onTocarTarjetaEv(event,\'' + t.id + '\')">' +
      '<span class="ev-col-dot" style="background:' + (col ? col.color : '#94a3b8') + ';" title="' + _esc(col ? col.nombre : '') + '"></span>' +
      '<span class="ev-list-titulo">' + _esc(t.titulo) + '</span>' +
      '<div class="ev-list-meta">' +
        (t.categoria ? '<span class="ev-card-cat" style="background:' + cat.bg + ';color:' + cat.color + ';">' + _esc(t.categoria) + '</span>' : '') +
        (fechaInfo.html ? '<span class="ev-card-fecha ' + fechaInfo.clase + '">' + fechaInfo.html + '</span>' : '') +
        (p.total ? '<span class="ev-list-progreso"><span class="ev-list-progreso-bar-wrap"><span class="ev-list-progreso-bar" style="width:' + p.pct + '%;"></span></span><span class="ev-list-progreso-txt">' + p.hechos + '/' + p.total + '</span></span>' : '') +
        (t.responsable_nombre ? '<span class="ev-card-resp-chip" title="' + _esc(t.responsable_nombre) + '"><span class="ev-card-resp">' + inicialResp + '</span><span class="ev-card-resp-nombre">' + _esc(nombrePila) + '</span></span>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

function _renderCard(t) {
  var cat = CATEGORIAS_EV[t.categoria] || { bg:'rgba(148,163,184,.15)', color:'#94a3b8' };
  var p = _progresoAgregado(t);
  var fechaInfo = _fechaLimiteInfo(t.fecha_limite);
  // Nombre de pila completo (no solo la inicial) — el círculo de
  // color solo no dejaba claro quién era el responsable a simple
  // vista, había que pasar el mouse por arriba. Pedido por Cristian:
  // "ponele el nombre de pila completo al menos, así queda bien claro".
  var nombrePila = (t.responsable_nombre || '').trim().split(' ')[0] || '';
  var inicialResp = nombrePila.charAt(0).toUpperCase() || '?';
  var portada = (t.adjuntos || []).find(function(a){ return a.esPortada; });
  return '<div class="ev-card" data-id-tarjeta="' + t.id + '" data-responsable="' + _esc(t.responsable_email||'') + '" data-categoria="' + _esc(t.categoria||'') + '" draggable="true" ondragstart="_dragStartCard(event,\'' + t.id + '\')" ondragend="_dragEndCard(event)" onclick="_onTocarTarjetaEv(event,\'' + t.id + '\')">' +
    (portada ? '<div class="ev-card-portada ev-card-portada-icono" onclick="event.stopPropagation(); _ampliarPortadaEv(\'' + portada.url.replace(/'/g,"\\'") + '\')" title="Tocá para ver la portada">🖼️</div>' : '') +
    (t.categoria ? '<span class="ev-card-cat" style="background:' + cat.bg + ';color:' + cat.color + ';">' + _esc(t.categoria) + '</span>' : '') +
    '<div class="ev-card-titulo">' + _esc(t.titulo) + '</div>' +
    '<div class="ev-card-meta">' +
      (fechaInfo.html ? '<span class="ev-card-fecha ' + fechaInfo.clase + '">' + fechaInfo.html + '</span>' : '<span></span>') +
      (t.responsable_nombre ? '<span class="ev-card-resp-chip" title="' + _esc(t.responsable_nombre) + '"><span class="ev-card-resp">' + inicialResp + '</span><span class="ev-card-resp-nombre">' + _esc(nombrePila) + '</span></span>' : '') +
    '</div>' +
    (p.total ? '<div class="ev-card-progreso-wrap"><div class="ev-card-progreso-bar" style="width:' + p.pct + '%;"></div></div>' +
      '<div class="ev-card-progreso-txt">' + p.hechos + '/' + p.total + ' subtareas · ' + p.pct + '%</div>' : '') +
  '</div>';
}

// ── Drag & drop ──
function _dragStartCard(ev, idTarjeta) { _dragTarjetaId = idTarjeta; ev.target.classList.add('dragging'); }
function _dragEndCard(ev) { ev.target.classList.remove('dragging'); }
function _dragOverCol(ev, idCol) { ev.preventDefault(); document.getElementById('ev-col-' + idCol).classList.add('drag-over'); }
function _dragLeaveCol(ev, idCol) { document.getElementById('ev-col-' + idCol).classList.remove('drag-over'); }
function _dropEnCol(ev, idCol) {
  ev.preventDefault();
  document.getElementById('ev-col-' + idCol).classList.remove('drag-over');
  if (!_dragTarjetaId) return;
  var tarjeta = EVENTO_ACTUAL.tarjetas.find(function(t){ return t.id === _dragTarjetaId; });
  if (!tarjeta || tarjeta.columna_id === idCol) { _dragTarjetaId = null; return; }
  tarjeta.columna_id = idCol;
  tarjeta.orden = Date.now();
  _renderTablero();
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_moverTarjeta', id_evento:EVENTO_ACTUAL.id, id_tarjeta:_dragTarjetaId, columna_id:idCol, orden:tarjeta.orden }) });
  _dragTarjetaId = null;
}

// ── Columnas — crear/borrar solo Administrador (backend ya lo exige;
// acá además no se ofrece el botón "+ Nueva columna" a quien no lo
// es). Renombrar/recolorear queda abierto a cualquier interno. ──
var COLORES_COLUMNA_EV = ['#3a86ff', '#f8961e', '#06d6a0', '#8b5cf6', '#ef4444', '#38bdf8', '#ec4899'];
function _abrirModalNuevaColumna() {
  var nombre = prompt('Nombre de la columna:');
  if (!nombre || !nombre.trim()) return;
  var color = COLORES_COLUMNA_EV[(EVENTO_ACTUAL.columnas || []).length % COLORES_COLUMNA_EV.length];
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_crearColumna', id_evento:EVENTO_ACTUAL.id, nombre:nombre.trim(), color:color, vendedorRol:_session.rol }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert('Error: ' + (r.error||'')); return; }
      EVENTO_ACTUAL.columnas = r.columnas;
      _renderTablero();
    });
}
function _menuColumna(ev, idCol) {
  ev.stopPropagation();
  var col = (EVENTO_ACTUAL.columnas || []).find(function(c){ return c.id === idCol; });
  if (!col) return;
  var accion = prompt('Columna "' + col.nombre + '"\n\nEscribí un nuevo nombre para renombrarla, o "borrar" para eliminarla' + (_esAdministradorEv() ? '' : ' (solo Administrador puede borrar)') + ':', col.nombre);
  if (accion === null) return;
  if (accion.trim().toLowerCase() === 'borrar') {
    if (!confirm('¿Borrar la columna "' + col.nombre + '"? Tiene que estar vacía.')) return;
    fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ accion:'ev_borrarColumna', id_evento:EVENTO_ACTUAL.id, id_columna:idCol, vendedorRol:_session.rol }) })
      .then(function(r){ return r.json(); })
      .then(function(r) {
        if (!r.ok) { alert(r.error || 'No se pudo borrar.'); return; }
        EVENTO_ACTUAL.columnas = r.columnas;
        _renderTablero();
      });
    return;
  }
  if (!accion.trim() || accion.trim() === col.nombre) return;
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_editarColumna', id_evento:EVENTO_ACTUAL.id, id_columna:idCol, nombre:accion.trim() }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert('Error: ' + (r.error||'')); return; }
      EVENTO_ACTUAL.columnas = r.columnas;
      _renderTablero();
    });
}

// ── Tarjetas: crear ──
async function _abrirModalNuevaTarjeta(idCol) {
  var titulo = prompt('Título de la tarjeta:');
  if (!titulo || !titulo.trim()) return;
  var btnRes = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_crearTarjeta', id_evento:EVENTO_ACTUAL.id, titulo:titulo.trim(), columna_id:idCol }) });
  var r = await btnRes.json();
  if (!r.ok) { alert('Error: ' + (r.error||'')); return; }
  // El backend devuelve "adjuntos" como objeto vacío {} (formato
  // crudo de Firebase) — todo el resto del código (_renderCard,
  // filtros, búsqueda) espera un ARRAY. Sin esto, pintar la tarjeta
  // recién creada tiraba un error (.find no es función) que cortaba
  // en seco el resto del refresco del tablero — quedaba viejo hasta
  // volver a entrar (ahí sí pasa por ev_obtenerEvento, que normaliza
  // bien este campo). Mismo criterio acá. Reportado por Cristian: "no
  // se ve en el kanban a menos que salga y vuelva a entrar".
  r.tarjeta.adjuntos = [];
  EVENTO_ACTUAL.tarjetas.push(r.tarjeta);
  _renderTablero();
  _abrirTarjeta(r.tarjeta.id);
}

async function _duplicarTarjetaActual() {

function _borrarTarjetaActual() {
  if (!TARJETA_ACTUAL_ID) return;
  if (!confirm('¿Borrar esta tarjeta? No se puede deshacer.')) return;
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_borrarTarjeta', id_evento:EVENTO_ACTUAL.id, id_tarjeta:TARJETA_ACTUAL_ID }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert('Error: ' + (r.error||'')); return; }
