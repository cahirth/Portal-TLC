// DETALLE DE TARJETA — edición + checklist + chat con reacciones
// ══════════════════════════════════════════════════════════════════
// Feedback visual inmediato al tocar una tarjeta — antes no había
// ninguna señal de que el toque "agarró" hasta que el modal
// realmente aparecía, y si tardaba un poco (viaje al backend), no se
// sabía si había funcionado o no — llevaba a tocar 2 o 3 veces de
// más. Ahora la tarjeta cambia de color al instante, apenas se toca,
// y se mantiene así hasta que el modal se termina de abrir (haya
// caché o no). Pedido por Cristian: "debería marcarse la tarjeta de
// un color diferente cuando la tocás, porque a veces no sabés si la
// tocaste bien o mal".
window._onTocarTarjetaEv = function(event, idTarjeta) {
  var el = event.currentTarget;
  el.classList.add('ev-card-tocada');
  Promise.resolve(_abrirTarjeta(idTarjeta)).finally(function() {
    el.classList.remove('ev-card-tocada');
  });
};

async function _abrirTarjeta(idTarjeta) {
  TARJETA_ACTUAL_ID = idTarjeta;
  if (!_internosCacheEv) {
    _cargarInternosEv().then(function() {
      if (TARJETA_ACTUAL_ID === idTarjeta) _renderOverlayTarjeta();
    });
  }

  var t = _tarjetaActual();
  if (!t) return;

  // Cache-first, mismo criterio que ya usa el tablero (_abrirEvento)
  // — antes esto SIEMPRE esperaba (await) el viaje real al backend
  // para traer notas/mensajes/checklist completo antes de mostrar el
  // modal. Con el tablero ya cargando instantáneo desde caché, esta
  // era la demora que más se sentía al tocar una tarjeta. Ahora: si
  // ya se vio esta tarjeta antes en este navegador, se abre con lo
  // último guardado al instante, y se actualiza sola atrás sin cerrar
  // ni recargar nada. Si es la primera vez, sí hay que esperar el
  // pedido (no hay nada más para mostrar). Reportado por Cristian:
  // "cuando abrís una tarjeta tarda, eso bastante molesta".
  var claveCacheTarjeta = 'ev_cache_tarjeta_' + idTarjeta;
  var cacheado = null;
  try {
    var crudo = localStorage.getItem(claveCacheTarjeta);
    if (crudo) cacheado = JSON.parse(crudo);
  } catch(eCache) { cacheado = null; }

  // Blindaje extra — si por lo que sea el caché guardado tiene la
  // FORMA recortada del tablero (ítems con "hecho" pero sin la clave
  // "texto" siquiera, no solo con texto vacío), se descarta y se trata
  // como si no hubiera caché — mejor esperar el pedido real que
  // mostrar de entrada algo que se sabe incompleto.
  if (cacheado && Array.isArray(cacheado.checklists)) {
    var pareceRecortado = cacheado.checklists.some(function(grupo) {
      return Array.isArray(grupo.items) && grupo.items.some(function(it) { return it && !('texto' in it); });
    });
    if (pareceRecortado) cacheado = null;
  }

  if (cacheado) {
    t.notas = cacheado.notas || [];
    t.mensajes = cacheado.mensajes || [];
    t.checklists = cacheado.checklists || [];
    _renderOverlayTarjeta(); // instantáneo, con lo último guardado
  }

  // BUG REAL — "aparece Sin Texto la primera vez, salgo y vuelvo a
  // entrar y está OK": si este pedido fallaba o tardaba de más (más
  // probable justo después de que el tablero recién terminó su propia
  // carga, con la conexión más ocupada), no había ningún reintento —
  // se pintaba directo con los datos LIVIANOS del tablero, que a
  // propósito NO traen el texto de los ítems del checklist (se
  // recortan para que el tablero cargue rápido, ver ev_obtenerEvento
  // / FotoMap.gs v179) — de ahí el "(sin texto)" que vio Cristian, con
  // ítems que sí tenían contenido real guardado. Al "salir y volver a
  // entrar" se disparaba un pedido NUEVO, que esa vez sí funcionaba.
  // Ahora, si el primer intento falla, se reintenta UNA vez más antes
  // de rendirse — la mayoría de estos son baches cortos de red, no
  // errores de verdad. Reportado por Cristian: "la primera vez que
  // abro una ficha del tablero aparece Sin Texto".
  function _pedirDetalleTarjetaEv(reintentando) {
    return fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ accion:'ev_obtenerTarjetaEv', id_evento:EVENTO_ACTUAL.id, id_tarjeta:idTarjeta }) })
      .then(function(resp) { return resp.json(); })
      .then(function(r) {
        if (!r.ok) throw new Error(r.error || 'Error desconocido');
        t.notas = r.tarjeta.notas || [];
        t.mensajes = r.tarjeta.mensajes || [];
        t.checklists = r.tarjeta.checklists || [];
        try { localStorage.setItem(claveCacheTarjeta, JSON.stringify({ notas:t.notas, mensajes:t.mensajes, checklists:t.checklists })); } catch(eLs) {}
        // Solo repinta si esta tarjeta sigue siendo la que está abierta
        // (si el usuario ya cerró o abrió otra mientras tanto, no hace
        // falta tocar nada).
        if (TARJETA_ACTUAL_ID === idTarjeta) _renderOverlayTarjeta();
      })
      .catch(function(e) {
        if (!reintentando) {
          console.warn('[Eventos] Falló el detalle de la tarjeta, reintentando una vez:', e);
          return _pedirDetalleTarjetaEv(true);
        }
        throw e; // ya reintentó una vez y volvió a fallar — ahí sí se rinde
      });
  }
  var pedido = _pedirDetalleTarjetaEv(false);

  if (!cacheado) {
    // Sin caché — no hay nada que mostrar todavía, así que sí hay que
    // esperar. Si falla incluso DESPUÉS del reintento, igual hace
    // falta UN render (con lo liviano que ya había) para no dejar el
    // modal vacío — mejor mostrar algo que nada, aunque le falte el
    // texto de los ítems.
    try { await pedido; } catch(e) { _renderOverlayTarjeta(); }
  } else {
    // Con caché ya mostrado, la actualización de fondo no debe
    // interrumpir — si falla incluso con el reintento, se queda con
    // lo que ya se estaba viendo.
    pedido.catch(function(e) { console.warn('[Eventos] No se pudo refrescar la tarjeta en segundo plano (tras reintentar):', e); });
  }

  // El overlay arranca con display:none — medir scrollHeight de un
  // elemento adentro de algo con display:none SIEMPRE da 0 en
  // cualquier navegador, así que el auto-resize dejaba TODOS los
  // ítems con height:0px clavado (colapsados, texto invisible aunque
  // estuviera guardado bien) si se llamaba antes de mostrar el modal.
  // Por eso pasaba con TODOS los ítems de TODOS los checklists por
  // igual. Se invierte el orden: primero mostrar (.open), recién ahí
  // medir. Reportado por Cristian con captura: "siguen sin verse los
  // ítems" (2da vuelta — la 1ra vez pensé que era un dato vacío
  // puntual, pero pasaba con absolutamente todos).
  document.getElementById('ev-overlay-tarjeta').classList.add('open');
  _autoResizeTodosItemsChecklistEv();
}
function _cerrarOverlayTarjeta() {
  document.getElementById('ev-overlay-tarjeta').classList.remove('open');
  TARJETA_ACTUAL_ID = null;
}
function _tarjetaActual() { return EVENTO_ACTUAL.tarjetas.find(function(t){ return t.id === TARJETA_ACTUAL_ID; }); }

async function _cargarInternosEv() {
  try {
    var resp = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ accion:'listarInternos' }) });
    var r = await resp.json();
    _internosCacheEv = (r.ok && Array.isArray(r.internos)) ? r.internos : [];
  } catch(e) { _internosCacheEv = []; }
}

function _renderOverlayTarjeta() {
  var t = _tarjetaActual();
  if (!t) return;
  var opcionesCategoria = Object.keys(CATEGORIAS_EV).map(function(c) {
    return '<option value="' + c + '"' + (t.categoria === c ? ' selected' : '') + '>' + c + '</option>';
  }).join('');
  var opcionesResp = (_internosCacheEv || []).map(function(p) {
    return '<option value="' + p.email + '"' + (t.responsable_email === p.email ? ' selected' : '') + '>' + _esc(p.nombre) + '</option>';
  }).join('');

  var colActual = (EVENTO_ACTUAL.columnas || []).find(function(c){ return c.id === t.columna_id; });
  var fechaCreado = t.creado_en ? new Date(t.creado_en).toLocaleDateString('es-AR', {day:'2-digit', month:'short', year:'numeric'}) : '';
  var portada = (t.adjuntos || []).find(function(a){ return a.esPortada; });

  document.getElementById('ev-overlay-body').innerHTML =
    '<div class="ev-overlay-col-principal">' +
      (portada ? '<div class="ev-portada-banner"><img src="' + portada.url + '" alt="" style="cursor:pointer;" onclick="_ampliarPortadaEv(\'' + portada.url.replace(/'/g,"\\'") + '\')"><div><div style="font-size:11.5px;font-weight:700;">' + _esc(portada.nombre) + '</div><div style="font-size:10px;color:var(--text-muted);">Portada de la tarjeta — tocá para ampliar</div></div></div>' : '') +
      '<input type="text" class="ev-det-titulo-input" id="ev-t-titulo" value="' + _esc(t.titulo) + '" onchange="_guardarCampoTarjeta(\'titulo\',this.value)" placeholder="Título de la tarjeta">' +
      '<div class="ev-det-header-info">' +
        (fechaCreado ? 'Creada el <b>' + fechaCreado + '</b> · ' : '') +
        'En <b>' + _esc((colActual && colActual.nombre) || '—') + '</b>' +
        (EVENTO_ACTUAL.nombre ? ' · ' + _esc(EVENTO_ACTUAL.nombre) : '') +
      '</div>' +

      '<div class="ev-campo"><label>Descripción / Propósito</label>' +
        '<textarea class="ev-descripcion-input" id="ev-t-descripcion" rows="3" placeholder="Explicá brevemente de qué trata esta tarjeta y para qué sirve..." onchange="_guardarCampoTarjeta(\'descripcion\',this.value)">' + _esc(t.descripcion||'') + '</textarea>' +
      '</div>' +

      '<div class="ev-det-grid">' +
        '<div class="ev-det-card"><div class="ev-det-card-label">Categoría</div><select id="ev-t-categoria" onchange="_guardarCampoTarjeta(\'categoria\',this.value)"><option value="">Sin categoría</option>' + opcionesCategoria + '</select></div>' +
        '<div class="ev-det-card"><div class="ev-det-card-label">Fecha límite</div><input type="date" id="ev-t-fecha" value="' + (t.fecha_limite||'') + '" onchange="_guardarCampoTarjeta(\'fecha_limite\',this.value)"></div>' +
      '</div>' +
      '<div class="ev-det-card"><div class="ev-det-card-label">Responsable Principal</div><select id="ev-t-resp" onchange="_guardarResponsable(this.value)"><option value="">Sin asignar</option>' + opcionesResp + '</select></div>' +

      '<div class="ev-section-titulo">✅ Checklists</div>' +
      '<button class="ev-btn-crear-checklist" onclick="_crearChecklistGrupoEv()">+ Crear nuevo Checklist</button>' +
      '<div id="ev-checklists-cont">' + _renderChecklistsGrupos(t) + '</div>' +

      '<div class="ev-section-titulo">📌 Notas Generales</div>' +
      '<textarea class="ev-textarea-nota" id="ev-t-nueva-nota" rows="3" placeholder="Escribí una nota de seguimiento..."></textarea>' +
      '<button class="ev-btn-secundario" style="margin-top:8px;" onclick="_agregarNotaEv()">+ Agregar Nota</button>' +
      '<div id="ev-notas-cont" style="margin-top:10px;">' + _renderNotasGenerales(t) + '</div>' +

      '<div class="ev-section-titulo">📎 Archivos Adjuntos</div>' +
      '<div class="ev-dropzone" onclick="document.getElementById(\'ev-input-archivo\').click()">' +
        '<div class="l">📁 Seleccionar archivo (Máx 10 MB por archivo)</div>' +
        '<div class="s">Formatos permitidos: PDF, PNG, JPG, XLSX</div>' +
      '</div>' +
      '<input type="file" id="ev-input-archivo" accept=".pdf,.png,.jpg,.jpeg,.xlsx" style="display:none;" onchange="_subirAdjuntoEv(event)">' +
      '<div id="ev-adjuntos-cont">' + _renderAdjuntos(t) + '</div>' +
    '</div>' +

    '<div class="ev-overlay-col-mensajes">' +
      '<div class="ev-msg-titulo">💬 Mensajes internos</div>' +
      '<div class="ev-msg-lista-box" id="ev-msg-lista">' + _construirHtmlListaMensajesEv(t) + '</div>' +
      '<div style="margin-top:10px;">' +
        '<textarea id="ev-msg-nuevo" class="ev-msg-textarea" placeholder="Escribí un mensaje... usá @ para mencionar a alguien del equipo" ' +
          'oninput="_onMsgInputEv(event)" onkeydown="_onMsgKeydownEv(event)" ' +
          'onclick="_mencionUltimoCursorEv=this.selectionStart;" onkeyup="_mencionUltimoCursorEv=this.selectionStart;" ontouchend="_mencionUltimoCursorEv=this.selectionStart;"></textarea>' +
        '<div id="ev-msg-sugerencias" class="ev-mencion-sug"></div>' +
        '<button type="button" class="ev-btn-primario" style="margin-top:8px;" onclick="_enviarMensajeEv()">Enviar</button>' +
      '</div>' +
    '</div>';
}

function _guardarCampoTarjeta(campo, valor) {
  var t = _tarjetaActual();
  if (!t) return;
  t[campo] = valor;
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(Object.assign({ accion:'ev_editarTarjeta', id_evento:EVENTO_ACTUAL.id, id_tarjeta:t.id }, (function(){ var o={}; o[campo]=valor; return o; })())) });
  _renderTablero();
}
function _guardarResponsable(email) {
  var t = _tarjetaActual();
  if (!t) return;
  var persona = (_internosCacheEv || []).find(function(p){ return p.email === email; });
  t.responsable_email = email;
  t.responsable_nombre = persona ? persona.nombre : '';
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_editarTarjeta', id_evento:EVENTO_ACTUAL.id, id_tarjeta:t.id, responsable_email:t.responsable_email, responsable_nombre:t.responsable_nombre }) });
  _renderTablero();
}

// ── Checklists agrupados (v161 — reemplaza el checklist único) ──
// Los ítems de checklist son <textarea rows="1"> que crecen solos
// según el contenido — antes eran <input> de una sola línea y el
// texto largo quedaba cortado en vez de wrappear a varias líneas.
// Pedido por Cristian con captura: "fijate que los campos de ítems
// sean responsivos, resalté cómo se corta el texto".
function _autoResizeTextareaEv(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
function _autoResizeTodosItemsChecklistEv() {
  document.querySelectorAll('.ev-check-item-texto-fija').forEach(_autoResizeTextareaEv);
}

function _crearChecklistGrupoEv() {
  var t = _tarjetaActual();
  if (!t) return;
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_crearChecklistGrupo', id_evento:EVENTO_ACTUAL.id, id_tarjeta:t.id, titulo:'Nuevo Checklist' }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert(r.error||'Error'); return; }
      t.checklists = r.checklists;
      document.getElementById('ev-checklists-cont').innerHTML = _renderChecklistsGrupos(t); _autoResizeTodosItemsChecklistEv();
      _renderTablero();
    });
}
function _renombrarChecklistGrupoEv(idGrupo, nuevoTitulo) {
  var t = _tarjetaActual();
  if (!t || !nuevoTitulo || !nuevoTitulo.trim()) return;
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_editarChecklistGrupo', id_evento:EVENTO_ACTUAL.id, id_tarjeta:t.id, id_grupo:idGrupo, titulo:nuevoTitulo.trim() }) })
    .then(function(r){ return r.json(); })
    .then(function(r) { if (r.ok) t.checklists = r.checklists; });
}
function _borrarChecklistGrupoEv(idGrupo) {
  var t = _tarjetaActual();
  if (!t) return;
  if (!confirm('¿Borrar este checklist completo con todos sus ítems?')) return;
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_borrarChecklistGrupo', id_evento:EVENTO_ACTUAL.id, id_tarjeta:t.id, id_grupo:idGrupo }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert(r.error||'Error'); return; }
      t.checklists = r.checklists;
      document.getElementById('ev-checklists-cont').innerHTML = _renderChecklistsGrupos(t); _autoResizeTodosItemsChecklistEv();
      _renderTablero();
    });
}
function _renderChecklistsGrupos(t) {
  var grupos = Array.isArray(t.checklists) ? t.checklists : [];
  if (!grupos.length) return '<div style="font-size:12px;color:var(--text-muted);padding:6px 0 4px;">Todavía no hay checklists en esta tarjeta.</div>';
  return grupos.map(function(g) {
    var items = g.items || [];
    var hechos = items.filter(function(i){ return i.hecho; }).length;
    return '<div class="ev-checklist-grupo" id="ev-cl-grupo-' + g.id + '">' +
      '<div class="ev-checklist-grupo-header">' +
        '<input class="ev-checklist-titulo-input" value="' + _esc(g.titulo) + '" onchange="_renombrarChecklistGrupoEv(\'' + g.id + '\', this.value)">' +
        (items.length ? '<span class="ev-checklist-progreso-chico">' + hechos + '/' + items.length + '</span>' : '') +
        '<button class="ev-btn-borrar-checklist" onclick="_borrarChecklistGrupoEv(\'' + g.id + '\')" title="Borrar checklist">🗑</button>' +
      '</div>' +
      '<div>' + items.map(function(item) {
        return '<div class="ev-check-item-fila' + (item.hecho?' hecho':'') + '">' +
          '<input type="checkbox"' + (item.hecho?' checked':'') + ' onchange="_toggleChecklistItem(\'' + g.id + '\',\'' + item.id + '\')">' +
          '<textarea rows="1" class="ev-check-item-texto-fija" placeholder="(sin texto — tocá para escribir o el ✕ para borrarlo)" oninput="_autoResizeTextareaEv(this)" onchange="_editarChecklistItemEv(\'' + g.id + '\',\'' + item.id + '\',this.value)">' + _esc(item.texto) + '</textarea>' +
          '<button class="ev-btn-borrar-item" onclick="_eliminarChecklistItemEv(\'' + g.id + '\',\'' + item.id + '\')" title="Eliminar ítem">✕</button>' +
        '</div>';
      }).join('') + '</div>' +
      '<div class="ev-check-add-row-chico">' +
        '<input type="text" id="ev-cl-nuevo-' + g.id + '" placeholder="Agregar ítem... @ para mencionar" ' +
          'oninput="_onChecklistInput(event,\'' + g.id + '\')" onkeydown="_onChecklistKeydown(event,\'' + g.id + '\')">' +
        '<button onclick="_agregarChecklistItem(\'' + g.id + '\')">+ Agregar</button>' +
      '</div>' +
      '<div id="ev-cl-sug-' + g.id + '" class="ev-mencion-sug"></div>' +
      '<div class="ev-mencion-aviso">Al mencionar con @ a un colaborador en un ítem, se le enviará un correo y una notificación Push.</div>' +
    '</div>';
  }).join('');
}
function _toggleChecklistItem(idGrupo, idItem) {
  var t = _tarjetaActual();
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_toggleChecklistItem', id_evento:EVENTO_ACTUAL.id, id_tarjeta:t.id, id_grupo:idGrupo, id_item:idItem, autor_email:_session.username, autor_nombre:_session.name }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert(r.error||'Error'); return; }
      t.checklists = r.checklists;
      document.getElementById('ev-checklists-cont').innerHTML = _renderChecklistsGrupos(t); _autoResizeTodosItemsChecklistEv();
      _renderTablero();
    });
}
function _eliminarChecklistItemEv(idGrupo, idItem) {
  var t = _tarjetaActual();
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_eliminarChecklistItem', id_evento:EVENTO_ACTUAL.id, id_tarjeta:t.id, id_grupo:idGrupo, id_item:idItem }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert(r.error||'Error'); return; }
      t.checklists = r.checklists;
      document.getElementById('ev-checklists-cont').innerHTML = _renderChecklistsGrupos(t); _autoResizeTodosItemsChecklistEv();
      _renderTablero();
    });
}
function _editarChecklistItemEv(idGrupo, idItem, nuevoTexto) {
  var t = _tarjetaActual();
  nuevoTexto = (nuevoTexto || '').trim();
  if (!nuevoTexto) { document.getElementById('ev-checklists-cont').innerHTML = _renderChecklistsGrupos(t); _autoResizeTodosItemsChecklistEv(); return; }
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_editarChecklistItem', id_evento:EVENTO_ACTUAL.id, id_tarjeta:t.id, id_grupo:idGrupo, id_item:idItem, texto:nuevoTexto }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert(r.error||'Error'); document.getElementById('ev-checklists-cont').innerHTML = _renderChecklistsGrupos(t); _autoResizeTodosItemsChecklistEv(); return; }
      t.checklists = r.checklists;
    });
}
var _mencionChecklistSeleccionada = [];
function _onChecklistInput(ev, idGrupo) { _mencionAutocompletarGenerico(ev.target, 'ev-cl-sug-'+idGrupo, 'ev-cl-nuevo-'+idGrupo); }
function _onChecklistKeydown(ev, idGrupo) {
  var boxAbierto = _mencionKeydownGenerico(ev, 'ev-cl-sug-'+idGrupo, 'ev-cl-nuevo-'+idGrupo);
  // Si el picker de menciones NO estaba abierto (o la tecla no era
  // ninguna de las suyas), Enter dispara "+ Agregar" — antes no hacía
  // nada, el usuario tenía que ir a tocar el botón a mano. Pedido por
  // Cristian con captura: "al apretar enter qué acciona el botón
  // agregar ítem" (nada, hasta ahora).
  if (!boxAbierto && ev.key === 'Enter') { ev.preventDefault(); _agregarChecklistItem(idGrupo); }
}
function _agregarChecklistItem(idGrupo) {
  var input = document.getElementById('ev-cl-nuevo-' + idGrupo);
  var texto = input.value.trim();
  if (!texto) return;
  var menciones = _extraerMencionesDeTexto(texto);
  var t = _tarjetaActual();
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'ev_agregarChecklistItem', id_evento:EVENTO_ACTUAL.id, id_tarjeta:t.id, id_grupo:idGrupo, texto:texto, menciones:menciones, autor_email:_session.username, autor_nombre:_session.name }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert(r.error||'Error'); return; }
      t.checklists = r.checklists;

var ADJUNTOS_EXT_IMAGEN_EV = ['png', 'jpg', 'jpeg'];
function _renderAdjuntos(t) {

    // Ya NO se carga ninguna imagen automáticamente — antes ponía
    // <img src="..."> directo (con loading="lazy"), pero en una
    // tarjeta con pocos adjuntos, todos entran en pantalla de una, así
    // que el navegador los pedía a todos igual apenas se abría la
    // tarjeta. Ahora es un ÍCONO nada más — la imagen real (URL de
    // Storage) recién se pide cuando el usuario TOCA el ícono, ahí se
    // abre la vista ampliada. Cero pedidos de imagen hasta que alguien
    // los pide de verdad. Pedido por Cristian: "que abras de una el
    // texto... a los adjuntos ni los abras, solamente cuando el
    // usuario cliquea uno, ahí empieza a abrir".
    var iconoHtml = esImagen
      ? '<span class="ic ev-adjunto-thumb-icono" onclick="_ampliarPortadaEv(\'' + a.url.replace(/'/g,"\\'") + '\')" title="Tocá para ver la imagen">🖼️</span>'
      : '<span class="ic">' + (ADJUNTOS_ICONOS_EV[ext] || '📎') + '</span>';
    return '<div class="ev-adjunto-fila">' +
      iconoHtml +
      '<a class="info" href="' + a.url + '" target="_blank" style="text-decoration:none;color:inherit;">' +

      '</a>' +

// Comprime imágenes ANTES de subir — antes se guardaban tal cual
// salían de la cámara del celular (hasta 10MB cada una, sin tocar).
// Un tablero con varias tarjetas con portada terminaba bajando y
// decodificando decenas de MB solo para mostrar miniaturas chicas —
// en una compu potente casi no se nota, pero en una vieja/débil se
// vuelve larguísimo de cargar. Mismo criterio ya probado en
// servicio.html (_comprimirImagen): máximo 800px de ancho, JPEG al
// 65% de calidad — para PDF/XLSX no aplica, esos se suben igual.
// Reportado por Cristian: "el módulo de eventos es lentísimo... en
// una compu antigua se nota mucho".
function _comprimirImagenEv(file, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var maxAncho = 800;
      var escala = Math.min(1, maxAncho / img.width);
      var w = Math.max(1, Math.round(img.width * escala));
      var h = Math.max(1, Math.round(img.height * escala));
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.65));
    };
    img.onerror = function() { callback(null); };
    img.src = e.target.result;
  };
  reader.onerror = function() { callback(null); };
  reader.readAsDataURL(file);
}

function _subirAdjuntoEv(ev) {
  var file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { alert('El archivo pesa más de 10MB — no se puede subir.'); return; }
  var extPermitidas = ['pdf','png','jpg','jpeg','xlsx'];
  var ext = (file.name.split('.').pop() || '').toLowerCase();
  if (extPermitidas.indexOf(ext) === -1) { alert('Formato no permitido — solo PDF, PNG, JPG, XLSX.'); return; }
  var t = _tarjetaActual();
  var esImagen = ['png','jpg','jpeg'].indexOf(ext) !== -1;

  var enviar = function(base64DataUrl, nombreFinal, tipoMimeFinal) {
    var base64 = base64DataUrl.split(',')[1];
    fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({
      accion:'subirAdjunto', modulo:'eventos', idRegistro: EVENTO_ACTUAL.id + '/tarjetas/' + t.id,
      nombre:nombreFinal, tipoMime:tipoMimeFinal, base64:base64, subidoPorNombre:_session.name,
    }) })
      .then(function(r){ return r.json(); })
      .then(function(r) {
        if (!r.ok) { alert('Error al subir: ' + (r.error||'')); return; }
        if (!Array.isArray(t.adjuntos)) t.adjuntos = [];
        var adj = r.adjunto; adj.id = r.adjId;
        t.adjuntos.push(adj);
        document.getElementById('ev-adjuntos-cont').innerHTML = _renderAdjuntos(t);
      });
  };

  if (esImagen) {
    _comprimirImagenEv(file, function(dataUrlComprimido) {
      if (!dataUrlComprimido) { alert('No se pudo procesar la imagen — probá con otro archivo.'); return; }
      enviar(dataUrlComprimido, file.name, 'image/jpeg');
    });
  } else {
    var reader = new FileReader();
    reader.onload = function() { enviar(reader.result, file.name, file.type); };
    reader.readAsDataURL(file);
  }
}

// ── @Menciones — helper genérico compartido por checklist y chat.
// Mismo formato visual y comportamiento que Negocios (cotizaciones.html).
//
// BUG REAL encontrado y confirmado con test (jsdom + click simulado):
// antes, el "qué hacer al elegir una mención" se pasaba como una
// función JS (closure) que se convertía a TEXTO con .toString() para
// poder meterla adentro del atributo onclick="..." del botón. Eso
// funciona SOLO si esa función no depende de ninguna variable externa
// — el closure del CHAT usaba 'ev-msg-nuevo' (string fijo, sobrevive
// perfecto), pero el closure del CHECKLIST usaba 'ev-cl-nuevo-'+idGrupo
// (variable local del scope original) — al convertir esa función a
// texto y volver a ejecutarla en el scope global (así funcionan los
// atributos onclick), "idGrupo" ya no existe en ningún lado →
// ReferenceError silencioso, el click no hacía nada. Por eso Enter sí
// funcionaba (llama a la función real, con su closure intacto) pero
// el click no. Fix: se saca el patrón de función-a-texto por completo
// — ahora se pasa el ID del input destino como un STRING PLANO (nunca
// se pierde al convertir a texto), y una única función global
// (_seleccionarMencionEv) hace la inserción. Reportado por Cristian:
// "al hacer click en el mencionado que lo seleccione, actualmente
// solo deja hacerlo con enter".
var _mencionUltimoCursorEv = 0;
var _ultimaMencionElegidaEnEv = 0;

function _seleccionarMencionEv(idInputDestino, nombre) {
  var ahora = Date.now();
  if (ahora - _ultimaMencionElegidaEnEv < 400) return; // anti doble-toque (mousedown+click en algunos Android)
  _ultimaMencionElegidaEnEv = ahora;
  _insertarMencionEnInput(idInputDestino, nombre);
}

function _extraerMencionesDeTexto(texto) {
  if (!_internosCacheEv) return [];
  var emails = [];
  _internosCacheEv.forEach(function(p) {
    if (texto.indexOf('@' + p.nombre) !== -1) emails.push(p.email);
  });
  return emails;
}
function _mencionAutocompletarGenerico(inputEl, idSugerencias, idInputDestino) {
  var val = inputEl.value;
  var cursor = inputEl.selectionStart;
  _mencionUltimoCursorEv = cursor;
  var antesDeCursor = val.slice(0, cursor);
  var match = antesDeCursor.match(/@([^\s@]*)$/);
  var box = document.getElementById(idSugerencias);
  if (!match) { box.style.display = 'none'; return; }
  var busqueda = match[1].toLowerCase();
  _mencionCandidatosEv = (_internosCacheEv || []).filter(function(p) { return p.nombre.toLowerCase().indexOf(busqueda) !== -1; }).slice(0, 20);
  if (!_mencionCandidatosEv.length) { box.style.display = 'none'; return; }
  // Resalta el PRIMER candidato apenas se despliega la lista, y cierra
  // cualquier OTRO picker que hubiera quedado abierto (de otro ítem de
  // checklist o del chat) — si no, dos listas podían quedar visibles a
  // la vez y un click en la vieja terminaba disparando la selección
  // sobre el input nuevo.
  document.querySelectorAll('.ev-mencion-sug').forEach(function(b) { if (b !== box) b.style.display = 'none'; });
  _mencionIndiceResaltadoEv = 0;
  _renderSugerenciasMencionEv(box, idInputDestino);
  box.style.display = 'block';
}
function _renderSugerenciasMencionEv(box, idInputDestino) {
  box.innerHTML = _mencionCandidatosEv.map(function(p, i) {
    var nombreEsc = p.nombre.replace(/'/g,"\\'");
    return '<button type="button" class="' + (i===_mencionIndiceResaltadoEv?'activo':'') + '" ' +
      'onclick="_seleccionarMencionEv(\'' + idInputDestino + '\', \'' + nombreEsc + '\')" ' +
      'onmouseenter="_mencionIndiceResaltadoEv=' + i + ';_resaltarMencionEv(this.parentNode);">👤 ' + _esc(p.nombre) + '</button>';
  }).join('');
  var activo = box.querySelector('.activo');
  if (activo && activo.scrollIntoView) activo.scrollIntoView({ block: 'nearest' });
}
function _mencionKeydownGenerico(ev, idSugerencias, idInputDestino) {
  var box = document.getElementById(idSugerencias);
  if (box.style.display !== 'block' || !_mencionCandidatosEv.length) return false;
  if (ev.key === 'ArrowDown') { ev.preventDefault(); _mencionIndiceResaltadoEv = (_mencionIndiceResaltadoEv + 1) % _mencionCandidatosEv.length; _resaltarMencionEv(box); return true; }
  if (ev.key === 'ArrowUp') { ev.preventDefault(); _mencionIndiceResaltadoEv = (_mencionIndiceResaltadoEv - 1 + _mencionCandidatosEv.length) % _mencionCandidatosEv.length; _resaltarMencionEv(box); return true; }
  if ((ev.key === 'Enter' || ev.key === 'Tab') && _mencionIndiceResaltadoEv !== -1) { ev.preventDefault(); box.style.display = 'none'; _insertarMencionEnInput(idInputDestino, _mencionCandidatosEv[_mencionIndiceResaltadoEv].nombre); return true; }
  if (ev.key === 'Escape') { box.style.display = 'none'; return true; }
  return false;
}
function _resaltarMencionEv(box) {
  Array.from(box.children).forEach(function(el, i) { el.classList.toggle('activo', i === _mencionIndiceResaltadoEv); });
  var activo = box.querySelector('.activo');
  if (activo && activo.scrollIntoView) activo.scrollIntoView({ block: 'nearest' });
}
function _insertarMencionEnInput(idInput, nombre) {
  var input = document.getElementById(idInput);
  if (!input) return;
  var cursor = (idInput === 'ev-msg-nuevo' ? _mencionUltimoCursorEv : null) || input.selectionStart || input.value.length;
  var val = input.value;
  var antes = val.slice(0, cursor).replace(/@([^\s@]*)$/, '@' + nombre + ' ');
  input.value = antes + val.slice(cursor);
  input.focus();
  document.querySelectorAll('.ev-mencion-sug').forEach(function(b){ b.style.display = 'none'; });
}

// ══════════════════════════════════════════════════════════════════
// CAMPANITA — mismo patrón que servicio.html/cotizaciones.html
// ══════════════════════════════════════════════════════════════════
function _esTactilEv() { return window.matchMedia ? window.matchMedia('(hover: none)').matches : ('ontouchstart' in window); }

async function _cargarNotificaciones(silencioso) {
  try {
    var resp = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ accion:'listarNotificaciones', email: _session.username }) });
    var r = await resp.json();
    var lista = (r.ok && Array.isArray(r.notificaciones)) ? r.notificaciones : [];
    var noLeidas = lista.filter(function(n){ return !n.leido; }).length;
    var badge = document.getElementById('ev-campana-badge');
    if (noLeidas > 0) { badge.style.display = 'flex'; badge.textContent = noLeidas > 9 ? '9+' : noLeidas; }
    else { badge.style.display = 'none'; }
    var cont = document.getElementById('campana-lista');
    if (!silencioso || document.getElementById('campana-panel').classList.contains('open')) {
      cont.innerHTML = !lista.length ? '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12px;">Sin actividad todavía.</div>' :
        lista.map(function(n) {
          var noLeidaBg = n.leido ? 'transparent' : 'rgba(58,134,255,.06)';
          return '<div class="notif-fila" tabindex="0" onclick="_clickNotificacionEv(event,\'' + n.id + '\',\'' + n.ticket_id + '\',\'' + (n.origen||'evento') + '\',\'' + (n.tarjeta_id||'') + '\')" style="background:' + noLeidaBg + ';">' +
            '<span style="font-size:16px;flex-shrink:0;">' + (n.tipo === 'reaccion' ? '👍' : '💬') + '</span>' +
            '<div style="flex:1;min-width:0;">' +
              (n.autor_nombre ? '<div style="font-size:12px;font-weight:700;color:var(--text-main);">' + _esc(n.autor_nombre) + '</div>' : '') +
              '<div class="notif-texto">' + _esc(n.texto || '') + '</div>' +
              '<div style="font-size:10px;color:var(--text-muted);margin-top:2px;">' + _esc(n.ticket_titulo || '') +
                (n.reaccion ? '<span class="notif-reaccion-guardada">' + (n.reaccion === 'ok' ? '👍' : n.reaccion === 'no_ok' ? '👎' : '❤️') + '</span>' : '') +
              '</div>' +
            '</div>' +
            '<div class="reaccion-trigger-wrap">' +
              '<button class="reaccion-trigger-btn" onclick="_abrirReaccionPicker(event,this,\'notif\',\'' + n.id + '\',\'' + (n.origen||'') + '\',\'' + (n.ticket_id||'') + '\',\'' + (n.mensaje_indice!==undefined?n.mensaje_indice:'') + '\',\'' + (n.tarjeta_id||'') + '\')" title="Reaccionar">🙂</button>' +
            '</div>' +
          '</div>';
        }).join('');
    }
  } catch(e) {}
}

window._toggleCampanaEv = function(ev) {
  if (ev) ev.stopPropagation();
  document.getElementById('campana-panel').classList.toggle('open');
  _cargarNotificaciones(false);
};
document.addEventListener('click', function(ev) {
  var panel = document.getElementById('campana-panel');
  if (panel.classList.contains('open') && !panel.contains(ev.target) && !ev.target.closest('.ev-icon-btn')) panel.classList.remove('open');
});

window._clickNotificacionEv = function(ev, idNoti, ticketId, origen, tarjetaId) {
  var fila = ev && ev.currentTarget;
  if (_esTactilEv() && fila && !fila.classList.contains('notif-expandida')) { fila.classList.add('notif-expandida'); return; }
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ accion:'marcarNotificacionLeida', email:_session.username, id:idNoti }) })
    .then(function(){ _cargarNotificaciones(true); });
  document.getElementById('campana-panel').classList.remove('open');
  if (!ticketId) return;
  if (origen === 'cotizacion') { window.location.href = 'https://cahirth.github.io/Portal-TLC/cotizaciones.html?id=' + encodeURIComponent(ticketId); return; }
  if (origen === 'evento') { _abrirEvento(ticketId, tarjetaId); return; }
  window.location.href = 'https://cahirth.github.io/Portal-TLC/servicio.html?ticket=' + encodeURIComponent(ticketId);
};

// ============================================================
// Picker de reacciones — v ROBUSTO: un solo picker GLOBAL, con
// position:fixed calculado por JS según getBoundingClientRect()
// del botón que lo abrió. Antes cada mensaje/notificación tenía su
// propio picker con position:absolute anclado a su fila (bottom:
// 100%), y quedaba cortado/tapado por el overflow-y:auto del
// contenedor que lo rodea cuando el mensaje estaba cerca del
// borde — a veces no se veía completo, a veces no dejaba clickear.
// Ahora hay un solo picker compartido en <body>, se reposiciona en
// cada apertura eligiendo abrir arriba o abajo del botón según el
// espacio libre en pantalla, y nunca depende de qué contenedor lo
// rodea. Reportado por Cristian con captura: "a veces aparece solo
// el corazón, a veces te deja clickear y a veces no".
// ============================================================
var _reaccionPickerCtx = null;

function _crearPickerGlobalReacciones() {
  var el = document.getElementById('reaccion-picker-global');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'reaccion-picker-global';
  el.className = 'reaccion-picker';
  el.style.position = 'fixed';
  el.style.zIndex = '9500';
  el.innerHTML =
    '<button data-tipo="ok" title="Ok">👍</button>' +
    '<button data-tipo="no_ok" title="No ok">👎</button>' +
    '<button data-tipo="corazon" title="Me encanta">❤️</button>';
  el.addEventListener('click', function(ev) {
    var btn = ev.target.closest('button[data-tipo]');
    if (!btn || !_reaccionPickerCtx) return;
    ev.stopPropagation();
    var ctx = _reaccionPickerCtx;
    var tipo = btn.getAttribute('data-tipo');
    _cerrarPickerGlobalReacciones();
    _despacharReaccion(ctx, tipo);
  });
  document.body.appendChild(el);
  return el;
}

function _cerrarPickerGlobalReacciones() {
  var el = document.getElementById('reaccion-picker-global');
  if (el) { el.classList.remove('abierto'); el._btnActual = null; }
  _reaccionPickerCtx = null;
}

function _despacharReaccion(ctx, tipo) {
  if (ctx.tipo === 'msg') {
    window._reaccionarMensajeEv(null, ctx.a1, tipo);
  } else if (ctx.tipo === 'notif') {
    window._reaccionarNotifEv(null, ctx.a1, tipo, ctx.a2, ctx.a3, ctx.a4, ctx.a5);
  }
}

window._abrirReaccionPicker = function(ev, btnEl, tipoCtx, a1, a2, a3, a4, a5) {
  if (ev) ev.stopPropagation();
  var el = _crearPickerGlobalReacciones();
  if (el.classList.contains('abierto') && el._btnActual === btnEl) { _cerrarPickerGlobalReacciones(); return; }
  _reaccionPickerCtx = { tipo: tipoCtx, a1:a1, a2:a2, a3:a3, a4:a4, a5:a5 };
  el._btnActual = btnEl;
  el.classList.add('abierto');
  var rect = btnEl.getBoundingClientRect();
  var pw = el.offsetWidth || 100, ph = el.offsetHeight || 36;
  var top = (rect.top - ph - 6 > 4) ? (rect.top - ph - 6) : (rect.bottom + 6);
  if (top + ph > window.innerHeight - 4) top = Math.max(4, window.innerHeight - ph - 4);
  var left = rect.right - pw;
  if (left < 4) left = 4;
  if (left + pw > window.innerWidth - 4) left = window.innerWidth - pw - 4;
  el.style.top = top + 'px';
  el.style.left = left + 'px';
  el.style.right = 'auto';
  el.style.bottom = 'auto';
  el.style.margin = '0';
};

document.addEventListener('click', _cerrarPickerGlobalReacciones);
document.addEventListener('scroll', _cerrarPickerGlobalReacciones, true);

window._reaccionarNotifEv = function(ev, idNoti, tipo, origen, ticketId, mensajeIndice, tarjetaId) {
  if (ev) ev.stopPropagation();
  var email = _session.username, nombre = _session.name;
  if (mensajeIndice !== '' && mensajeIndice !== undefined && ticketId) {
    var accionMsg = origen === 'cotizacion' ? 'cot_reaccionarMensaje' : origen === 'evento' ? 'ev_reaccionarMensaje' : 'st_reaccionarMensaje';
    var payloadMsg = { accion: accionMsg, indice: parseInt(mensajeIndice, 10), autor_email: email, autor_nombre: nombre, reaccion: tipo };
    if (origen === 'cotizacion') payloadMsg.id_cotizacion = ticketId;
    else if (origen === 'evento') { payloadMsg.id_evento = ticketId; payloadMsg.id_tarjeta = tarjetaId; }
    else payloadMsg.id_ticket = ticketId;
    fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payloadMsg) })
      .then(function(){ return fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ accion:'marcarNotificacionLeida', email:email, id:idNoti }) }); })
      .then(function(){ _cargarNotificaciones(true); });
    return;
  }
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ accion:'reaccionarNotificacion', email:email, id:idNoti, reaccion:tipo }) })
    .then(function(){ _cargarNotificaciones(true); });
};

window._marcarTodasLeidasEv = function(ev) {
  if (ev) ev.stopPropagation();
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ accion:'marcarTodasLeidas', email:_session.username }) })
    .then(function(){ _cargarNotificaciones(false); });
};
</script>
