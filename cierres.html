<!DOCTYPE html>
<!-- Portal TLC | cierres.html | v2026.10.08.6 (Ahora se entra desde Administración → Reportes y se habilita con el tilde "Reportes" de la hoja de permisos, no por Rol.) -->
<!-- Portal TLC | cierres.html | v2026.10.06.8 (NUEVO — Cristian: cierre de semana de los viernes. Resumen para Administradores: quién cerró la semana y quién no, qué está trabado, qué espera repuesto o al cliente, y qué "no le corresponde" a quien lo tenía asignado. Lee st_listarCierres de la función servicio v10.) -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cierres de semana · Portal TLC</title>
<link rel="manifest" href="manifest.json">
<script src="version.js"></script>
<script src="permisos.js"></script>
<style>
:root{--bg:#f0f4f8;--panel:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#3a86ff;--green:#16a34a;--red:#dc2626;--amber:#b45309}
body.oscuro{--bg:#080d14;--panel:#0f1a30;--border:#1e3050;--text:#f1f5f9;--muted:#94a3b8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.back{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:18px;cursor:pointer}
h1{font-size:16px;margin:0}.sub{font-size:11px;color:var(--muted)}
.wrap{max-width:860px;margin:0 auto;padding:14px}
.sem{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sem select{flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:24px}.kpi span{font-size:11px;color:var(--muted);font-weight:700}
.sec{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.pend{display:flex;justify-content:space-between;align-items:center;border-left:4px solid var(--red)}
.persona{display:flex;justify-content:space-between;gap:8px;align-items:baseline;cursor:pointer}
.persona .n{font-weight:800;font-size:14px}.persona .f{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;background:rgba(58,134,255,.1)}
.items{margin-top:8px;display:none}.card.abierta .items{display:block}
.it{padding:7px 0;border-top:1px solid var(--border);font-size:12.5px;display:flex;gap:8px}
.it .e{flex-shrink:0;width:20px;text-align:center}
.it .t{font-weight:700}.it .x{color:var(--muted);font-size:11.5px;margin-top:1px}
.alerta{border-left:4px solid var(--red)}
.vacio{color:var(--muted);font-size:13px;text-align:center;padding:24px}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <button class="back" onclick="history.length>1?history.back():location.href='servicio.html'">←</button>
  <div style="flex:1"><h1>📋 Cierres de semana</h1><div class="sub" id="sub">Cargando…</div></div>
</header>
<div class="wrap">
  <div class="sem"><select id="sel-semana" onchange="cargar(this.value)"></select></div>
  <div id="contenido"><div class="vacio">Cargando…</div></div>
</div>
<script>
var URL_FN = 'https://us-central1-portal-tlc.cloudfunctions.net/servicio';
var EMO = { sale:'✅', proxima:'🔧', repuesto:'⏳', cliente:'🧑‍💼', trabado:'⚠️', no_mio:'🔁' };
var CORTO = { sale:'Sale', proxima:'Semana que viene', repuesto:'Espera repuesto', cliente:'Espera cliente', trabado:'Trabado', no_mio:'No le corresponde' };
var ORDEN = ['trabado','no_mio','repuesto','cliente','proxima','sale'];
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sesion(){try{var r=JSON.parse(localStorage.getItem('tlc_session_v1')||'null');return r?(r.account||r):null;}catch(e){return null;}}
try{ if((localStorage.getItem('tlc_tema')||'dark')!=='light') document.body.classList.add('oscuro'); }catch(e){ document.body.classList.add('oscuro'); }
var cuenta = sesion();
function fechaViernes(s){var d=new Date(s+'T12:00:00Z');return isNaN(d)?s:d.toLocaleDateString('es-AR',{day:'numeric',month:'short',timeZone:'UTC'});}
function hora(iso){var d=new Date(iso);return isNaN(d)?'':d.toLocaleString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}

async function cargar(semana){
  if(!cuenta){document.getElementById('contenido').innerHTML='<div class="vacio">Iniciá sesión en el Portal.</div>';document.getElementById('sub').textContent='';return;}
  document.getElementById('contenido').innerHTML='<div class="vacio">Cargando…</div>';
  var r;
  try{ r = await (await fetch(URL_FN,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({accion:'st_listarCierres',semana:semana||'',vendedorRol:cuenta.rol,email_usuario:cuenta.username})})).json(); }
  catch(e){ document.getElementById('contenido').innerHTML='<div class="vacio">Error de conexión.</div>'; return; }
  if(!r.ok){ document.getElementById('contenido').innerHTML='<div class="vacio">'+esc(r.error||'Error')+'</div>'; return; }
  var sel=document.getElementById('sel-semana');
  sel.innerHTML=(r.semanas.length?r.semanas:[r.semana]).map(function(s){return '<option value="'+s+'"'+(s===r.semana?' selected':'')+'>Viernes '+esc(fechaViernes(s))+(s===r.actual?' (esta semana)':'')+'</option>';}).join('');
  document.getElementById('sub').textContent='Viernes '+fechaViernes(r.semana);
  render(r);
}
function render(r){
  var cierres=r.cierres||[], pend=r.pendientes||[];
  var todos=[]; cierres.forEach(function(c){(c.items||[]).forEach(function(it){todos.push({c:c,it:it});});});
  var cuenta=function(k){return todos.filter(function(x){return x.it.estado===k;}).length;};
  var html='<div class="kpis">'+
    '<div class="kpi"><b>'+cierres.length+(r.semana===r.actual?' / '+(cierres.length+pend.length):'')+'</b><span>cerraron</span></div>'+
    '<div class="kpi"><b style="color:var(--red)">'+(cuenta('trabado')+cuenta('no_mio'))+'</b><span>para revisar</span></div>'+
    '<div class="kpi"><b style="color:var(--amber)">'+(cuenta('repuesto')+cuenta('cliente'))+'</b><span>esperando</span></div>'+
    '<div class="kpi"><b style="color:var(--green)">'+cuenta('sale')+'</b><span>salen</span></div></div>';
  if(pend.length){
    html+='<div class="sec">⏰ Todavía no cerraron</div>'+pend.map(function(p){return '<div class="card pend"><span><b>'+esc(p.nombre)+'</b></span><span class="sub">'+p.total+' a cargo</span></div>';}).join('');
  }
  var urg=todos.filter(function(x){return x.it.estado==='trabado'||x.it.estado==='no_mio';});
  if(urg.length){
    html+='<div class="sec">🚨 Para revisar</div>'+urg.map(function(x){return '<div class="card alerta"><div class="it" style="border:none;padding:0"><span class="e">'+EMO[x.it.estado]+'</span><div><div class="t">'+esc(x.it.titulo)+'</div><div class="x">'+esc(x.c.nombre)+' · '+esc(x.it.etapa||'')+(x.it.nota?' — “'+esc(x.it.nota)+'”':'')+'</div></div></div></div>';}).join('');
  }
  html+='<div class="sec">👥 Por persona</div>';
  if(!cierres.length) html+='<div class="vacio">Nadie cerró esta semana todavía.</div>';
  html+=cierres.sort(function(a,b){return String(a.nombre).localeCompare(String(b.nombre));}).map(function(c){
    var items=(c.items||[]).slice().sort(function(a,b){return ORDEN.indexOf(a.estado)-ORDEN.indexOf(b.estado);});
    var chips=ORDEN.map(function(k){var n=items.filter(function(i){return i.estado===k;}).length;return n?'<span class="chip">'+EMO[k]+' '+n+' '+CORTO[k]+'</span>':'';}).join('');
    return '<div class="card" onclick="this.classList.toggle(\'abierta\')"><div class="persona"><span class="n">'+esc(c.nombre)+'</span><span class="f">'+esc(hora(c.fecha))+' · '+items.length+' equipos ▾</span></div>'+
      '<div class="chips">'+chips+'</div><div class="items">'+items.map(function(i){return '<div class="it"><span class="e">'+EMO[i.estado]+'</span><div><div class="t">'+esc(i.titulo)+'</div><div class="x">'+esc(i.etapa||'')+(i.nota?' — “'+esc(i.nota)+'”':'')+'</div></div></div>';}).join('')+'</div></div>';
  }).join('');
  document.getElementById('contenido').innerHTML=html;
}
(async function(){ if(typeof validarAccesoModulo==='function'){ var ok=await validarAccesoModulo('Reportes'); if(!ok) return; cuenta=sesion(); } cargar(''); })();
</script>
</body>
</html>
