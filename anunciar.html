<!DOCTYPE html>
<!-- Portal TLC | anunciar.html | v2026.10.15.4 (texto sugerido para la novedad 📎 adjuntos en mensajes) -->
<!-- Portal TLC | anunciar.html | v2026.10.15.3 (NUEVO — 📣 Anunciar novedad. Cristian: "cada vez que hacemos un tutorial nuevo, pushearlo al usuario... mandarle un mensaje a todos, pero ese mensaje tiene que tener la imagen". El Administrador elige una imagen de los tutoriales, escribe título y texto, y se lo manda a todo el equipo (o a quienes elija) por campanita, push al celular con la imagen y mail con la imagen. Al tocarlo se abre el módulo justo en esa imagen del tutorial. Función servicio v18 (anunciarNovedad).) -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anunciar novedad · Portal TLC</title>
<link rel="manifest" href="manifest.json">
<script src="version.js"></script>
<script src="permisos.js"></script>
<script src="tutorial.js"></script>
<style>
:root{--bg:#f0f4f8;--panel:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#3a86ff;--green:#16a34a;--red:#dc2626}
body.oscuro{--bg:#080d14;--panel:#0f1a30;--border:#1e3050;--text:#f1f5f9;--muted:#94a3b8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.back{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:18px;cursor:pointer;flex-shrink:0}
h1{font-size:16px;margin:0}.sub{font-size:11px;color:var(--muted)}
.wrap{max-width:1000px;margin:0 auto;padding:12px;display:grid;grid-template-columns:1fr 340px;gap:14px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
.sec{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.sec:first-child{margin-top:2px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px}
.grupo{font-size:12px;font-weight:800;margin:10px 2px 6px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.imgs button{position:relative;border:2px solid transparent;border-radius:10px;padding:0;background:var(--bg);cursor:pointer;overflow:hidden;aspect-ratio:4/5}
.imgs button img{width:100%;height:100%;object-fit:cover;display:block}
.imgs button.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,134,255,.25)}
.imgs button .nv{position:absolute;top:4px;left:4px;background:#ef4444;color:#fff;font-size:9px;font-weight:900;padding:1px 6px;border-radius:8px}
label.f{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin:10px 0 4px}
input[type=text],textarea,select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
textarea{min-height:70px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;padding:5px 0}
.chk input{width:18px;height:18px}
.chk small{color:var(--muted);font-weight:500}
.dest{max-height:180px;overflow:auto;border:1px solid var(--border);border-radius:9px;padding:4px 10px;margin-top:6px;display:none}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:11px;background:var(--blue);color:#fff;font-weight:900;font-size:15px;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.5;cursor:default}
.prev-push{background:#1f2937;color:#fff;border-radius:14px;padding:10px;font-size:12px}
.prev-push .h{display:flex;align-items:center;gap:6px;font-size:10.5px;opacity:.75;margin-bottom:4px}
.prev-push b{display:block;font-size:13px}
.prev-push img{display:block;width:100%;height:140px;object-fit:cover;object-position:top;border-radius:10px;margin-top:8px}
.prev-mail{background:#fff;color:#0f172a;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:10px;font-family:Arial,sans-serif}
.prev-mail h3{margin:0 0 4px;color:#1a4b8c;font-size:15px}
.prev-mail p{margin:0 0 8px;font-size:12.5px}
.prev-mail img{width:100%;border-radius:8px;display:block;margin-bottom:8px}
.prev-mail span{display:inline-block;background:#3a86ff;color:#fff;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700}
.vacio{color:var(--muted);font-size:13px;text-align:center;padding:24px}
.ok{background:rgba(22,163,74,.12);border:1px solid rgba(22,163,74,.4);color:var(--green);border-radius:11px;padding:10px 12px;font-weight:700;font-size:13px;margin-top:12px;display:none}
.historial .it{font-size:12px;padding:7px 0;border-top:1px solid var(--border)}
.historial .it:first-child{border-top:none}
.historial .it small{color:var(--muted)}
</style>
</head>
<body>
<header>
  <button class="back" onclick="history.length>1?history.back():location.href='index.html'">←</button>
  <div style="flex:1"><h1>📣 Anunciar novedad</h1><div class="sub">Avisale al equipo, con la imagen del tutorial</div></div>
</header>
<div id="app" class="wrap"><div class="vacio" style="grid-column:1/-1">Cargando…</div></div>
<script>
var URL_FN = 'https://us-central1-portal-tlc.cloudfunctions.net/servicio';
var INTERNOS_URL = 'https://us-central1-portal-tlc.cloudfunctions.net/internos';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function sesion(){try{var r=JSON.parse(localStorage.getItem('tlc_session_v1')||'null');return r?(r.account||r):null;}catch(e){return null;}}
try{ if((localStorage.getItem('tlc_tema')||'dark')!=='light') document.body.classList.add('oscuro'); }catch(e){ document.body.classList.add('oscuro'); }

// Página que abre cada tutorial
var PAGINA = { index:'index.html', calendario:'calendario.html', servicio:'servicio.html', cotizaciones:'cotizaciones.html',
  'selector-dispositivos':'selector-dispositivos.html', comisiones:'comisiones.html', eventos:'eventos.html', empresas:'empresas.html',
  comex:'eventos.html?modulo=comex', regulatoria:'eventos.html?modulo=regulatoria', contabilidad:'eventos.html?modulo=contabilidad',
  parte:'parte.html', 'cuenta-corriente':'cuenta-corriente.html' };
// Texto sugerido para las novedades
var SUGERIDO = {
  'nov-adjuntos': ['Fotos, PDF y Excel en los mensajes', 'Ahora podés adjuntar una foto, un PDF o un Excel a los mensajes internos. Tocá 📎 al lado de Enviar.'],
  'nov-comprobantes': ['Comprobante en cada gasto', 'Ahora podés sacarle la foto al ticket de compra y queda pegada al gasto. Tocá 📷 Comprobante.'],
  'nov-orden-items': ['¿Faltó algo en la Orden de Preparación?', 'Si cambia el presupuesto, los ítems nuevos se pasan a la Orden con un botón.'],
  'contabilidad-1': ['Nuevo módulo: Contabilidad', 'Las tareas contables con su propio tablero, igual que Comex.'],
};
var SETS = (window.TLCTutorial && TLCTutorial.SETS) || {};
var sel = null, internos = [];

function listaImagenes() {
  var vistas = {}, grupos = [], novedades = [];
  Object.keys(SETS).forEach(function(k) {
    var items = [];
    SETS[k].slides.forEach(function(s) {
      if (vistas[s]) return; vistas[s] = { clave: k };
      if (/^nov-/.test(s) || s === 'contabilidad-1') novedades.push({ s: s, k: k }); else items.push({ s: s, k: k });
    });
    if (items.length) grupos.push({ titulo: SETS[k].titulo, items: items });
  });
  return { novedades: novedades, grupos: grupos };
}
function botonImg(it, nuevo) {
  return '<button type="button" data-s="' + esc(it.s) + '" data-k="' + esc(it.k) + '" title="' + esc(it.s) + '" onclick="elegir(this)">' +
    (nuevo ? '<span class="nv">NUEVO</span>' : '') + '<img loading="lazy" src="tutoriales/' + esc(it.s) + '.jpg" alt=""></button>';
}
function render() {
  var L = listaImagenes();
  var app = document.getElementById('app');
  app.innerHTML =
    '<div>' +
      '<div class="sec">1 · Elegí la imagen</div>' +
      '<div class="card">' +
        '<div class="grupo">🆕 Novedades</div><div class="imgs">' + L.novedades.map(function(it){ return botonImg(it, true); }).join('') + '</div>' +
        L.grupos.map(function(g){ return '<div class="grupo">' + esc(g.titulo) + '</div><div class="imgs">' + g.items.map(function(it){ return botonImg(it, false); }).join('') + '</div>'; }).join('') +
      '</div>' +
    '</div>' +
    '<div>' +
      '<div class="sec">2 · El mensaje</div>' +
      '<div class="card">' +
        '<label class="f">Título</label><input type="text" id="titulo" maxlength="120" placeholder="Ej: Comprobante en cada gasto" oninput="vista()">' +
        '<label class="f">Texto</label><textarea id="texto" maxlength="600" placeholder="Una o dos líneas: qué hay de nuevo" oninput="vista()"></textarea>' +
        '<label class="f">Al tocarlo se abre</label><select id="destino" onchange="vista()"></select>' +
        '<label class="f">Por dónde</label>' +
        '<label class="chk"><input type="checkbox" id="c-push" checked onchange="vista()"> 📱 Push al celular <small>(con imagen en Android y PC)</small></label>' +
        '<label class="chk"><input type="checkbox" id="c-campanita" checked> 🔔 Campanita del Portal</label>' +
        '<label class="chk"><input type="checkbox" id="c-mail" checked onchange="vista()"> ✉️ Mail con la imagen</label>' +
        '<label class="f">A quién</label>' +
        '<label class="chk"><input type="radio" name="a" value="todos" checked onchange="destinos()"> Todo el equipo (Internos)</label>' +
        '<label class="chk"><input type="radio" name="a" value="elegir" onchange="destinos()"> Elegir personas</label>' +
        '<div class="dest" id="dest"></div>' +
        '<button class="btn" id="enviar" onclick="enviar()" disabled>📣 Enviar</button>' +
        '<div class="ok" id="ok"></div>' +
      '</div>' +
      '<div class="sec">Así le llega</div>' +
      '<div class="card" id="vista"><div class="vacio" style="padding:10px">Elegí una imagen.</div></div>' +
    '</div>';
  var primera = app.querySelector('.imgs button');
  if (primera) elegir(primera);
}
window.elegir = function(btn) {
  document.querySelectorAll('.imgs button.sel').forEach(function(b){ b.classList.remove('sel'); });
  btn.classList.add('sel');
  var s = btn.getAttribute('data-s');
  var claves = Object.keys(SETS).filter(function(k){ return SETS[k].slides.indexOf(s) !== -1; });
  sel = { s: s };
  var dest = document.getElementById('destino');
  dest.innerHTML = claves.map(function(k){ var pg = PAGINA[k] || 'index.html'; return '<option value="' + esc(pg + (pg.indexOf('?') === -1 ? '?' : '&') + 'tutorial=' + s) + '">' + esc(SETS[k].titulo) + '</option>'; }).join('');
  var sug = SUGERIDO[s];
  if (sug) { document.getElementById('titulo').value = sug[0]; document.getElementById('texto').value = sug[1]; }
  vista();
};
window.destinos = function() {
  var el = document.getElementById('dest');
  var elegir = document.querySelector('input[name=a]:checked').value === 'elegir';
  el.style.display = elegir ? 'block' : 'none';
  if (elegir && !el.innerHTML) el.innerHTML = internos.length ? internos.map(function(p){ return '<label class="chk"><input type="checkbox" class="pers" value="' + esc(p.email) + '"> ' + esc(p.nombre) + '</label>'; }).join('') : '<div class="vacio" style="padding:8px">No se pudo cargar la lista.</div>';
};
window.vista = function() {
  var t = document.getElementById('titulo').value.trim(), x = document.getElementById('texto').value.trim();
  document.getElementById('enviar').disabled = !(sel && t);
  if (!sel) return;
  var img = 'tutoriales/' + sel.s + '.jpg';
  document.getElementById('vista').innerHTML =
    (document.getElementById('c-push').checked ? '<div class="prev-push"><div class="h">🔵 Portal TLC · ahora</div><b>📣 ' + esc(t || 'Título') + '</b>' + esc(x || 'Tocá para verlo') + '<img src="' + img + '" alt=""></div>' : '') +
    (document.getElementById('c-mail').checked ? '<div class="prev-mail"><h3>📣 ' + esc(t || 'Título') + '</h3>' + (x ? '<p>' + esc(x) + '</p>' : '') + '<img src="' + img + '" alt=""><span>Verlo en el Portal</span></div>' : '');
};
window.enviar = async function() {
  var btn = document.getElementById('enviar');
  var cuenta = sesion() || {};
  var body = { accion: 'anunciarNovedad', titulo: document.getElementById('titulo').value.trim(), texto: document.getElementById('texto').value.trim(),
    imagen: 'tutoriales/' + sel.s + '.jpg', link: document.getElementById('destino').value,
    canales: { push: document.getElementById('c-push').checked, campanita: document.getElementById('c-campanita').checked, mail: document.getElementById('c-mail').checked },
    email_usuario: cuenta.username || '' };
  if (document.querySelector('input[name=a]:checked').value === 'elegir') {
    body.solo_emails = [].map.call(document.querySelectorAll('.pers:checked'), function(c){ return c.value; });
    if (!body.solo_emails.length) { alert('Elegí al menos una persona.'); return; }
  }
  btn.disabled = true; btn.textContent = 'Revisando…';
  try {
    var sim = await (await fetch(URL_FN, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(Object.assign({}, body, { simular: true })) })).json();
    if (!sim || !sim.ok) throw new Error((sim && sim.error) || 'error');
    if (!confirm('Se le manda a ' + sim.destinatarios.length + ' persona(s):\n' + sim.destinatarios.join(', ') + '\n\n¿Enviar?')) return;
    btn.textContent = 'Enviando…';
    var r = await (await fetch(URL_FN, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(body) })).json();
    if (!r || !r.ok) throw new Error((r && r.error) || 'error');
    var ok = document.getElementById('ok');
    ok.style.display = 'block';
    ok.textContent = '✅ Enviado a ' + r.enviados + ' persona(s)' + (body.canales.push ? ' · ' + r.push + ' push' : '') + (body.canales.mail ? ' · ' + r.mails + ' mails' : '') + '.';
  } catch (e) { alert('No se pudo enviar: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = '📣 Enviar'; }
};
(async function() {
  if (typeof validarAccesoModulo === 'function') { var ok = await validarAccesoModulo('Administracion'); if (!ok) return; }
  var c = sesion();
  if (!c) { document.getElementById('app').innerHTML = '<div class="vacio" style="grid-column:1/-1">Iniciá sesión en el Portal.</div>'; return; }
  render();
  try {
    var r = await (await fetch(INTERNOS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ accion:'listarInternos' }) })).json();
    internos = (r && r.ok && r.internos) || [];
  } catch (e) { internos = []; }
})();
</script>
</body>
</html>
