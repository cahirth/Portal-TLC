<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TLC — Dispositivos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #030712; color: #f8fafc; min-height: 100vh; }

        /* HEADER */
        .header { background: rgba(11,19,41,0.98); backdrop-filter: blur(12px); padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #222e50; position: sticky; top: 0; z-index: 100; }
        .logo { width: 38px; height: 38px; flex-shrink: 0; border-radius: 8px; object-fit: contain; background: #1c2541; }
        .header-text h1 { font-size: 15px; font-weight: 700; color: #f8fafc; line-height: 1.2; }
        .header-text p { font-size: 11px; color: #94a3b8; margin-top: 1px; }

        /* CONTENEDOR PRINCIPAL */
        .main-container { max-width: 1400px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1024px) { .main-container { grid-template-columns: 320px 1fr; padding: 24px; gap: 24px; } }

        /* FILTROS LATERALES */
        .sidebar { background: #0b1329; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; height: fit-content; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .search-wrapper { position: relative; }
        .search-input { width: 100%; background: #111a36; border: 1px solid #334155; border-radius: 10px; padding: 12px 14px 12px 40px; color: #f8fafc; font-size: 14px; outline: none; transition: all 0.2s; }
        .search-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 16px; pointer-events: none; }
        
        .filter-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 10px; font-weight: 600; }
        .filter-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .filter-btn { background: #111a36; border: 1px solid #1e293b; color: #94a3b8; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; user-select: none; }
        .filter-btn:hover { border-color: #334155; color: #f8fafc; }
        .filter-btn.active { background: #2563eb; border-color: #3b82f6; color: #ffffff; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }

        /* LISTA DE EQUIPOS */
        .content-area { display: flex; flex-direction: column; gap: 16px; }
        .grid-equipos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        
        .equipo-card { background: #0b1329; border: 1px solid #1e293b; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; height: 100%; position: relative; transition: border-color 0.2s, transform 0.2s; }
        .equipo-card:hover { border-color: #334155; transform: translateY(-2px); }
        .equipo-card.selected { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb, 0 8px 24px rgba(37,99,235,0.15); }

        .img-container { width: 100%; height: 200px; background: #070d1e; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #1e293b; }
        .equipo-img { max-width: 100%; max-height: 100%; object-fit: contain; padding: 12px; transition: transform 0.3s; cursor: zoom-in; }
        .equipo-card:hover .equipo-img { transform: scale(1.03); }
        
        .badge-brand { position: absolute; top: 12px; left: 12px; background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(8px); color: #f1f5f9; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .select-indicator { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #334155; background: #0b1329; display: flex; align-items: center; justify-content: center; transition: all 0.2s; cursor: pointer; }
        .equipo-card.selected .select-indicator { background: #2563eb; border-color: #2563eb; }
        .equipo-card.selected .select-indicator::after { content: ''; width: 6px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); margin-bottom: 2px; }

        .equipo-info { padding: 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; }
        .equipo-title-desc { display: flex; flex-direction: column; gap: 4px; }
        .equipo-name { font-size: 15px; font-weight: 700; color: #f8fafc; line-height: 1.3; }
        .equipo-desc { font-size: 12px; color: #94a3b8; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 33px; }
        
        .compat-pills { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; }
        .pill { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .pill.laser { background: rgba(239,68,68,0.1); color: #f87171; border-color: rgba(239,68,68,0.2); }
        .pill.micro { background: rgba(245,158,11,0.1); color: #fbbf24; border-color: rgba(245,158,11,0.2); }
        .pill.tomo { background: rgba(59,130,246,0.1); color: #60a5fa; border-color: rgba(59,130,246,0.2); }

        .price-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: auto; padding-top: 8px; border-top: 1px solid #1e293b; }
        .price-label { font-size: 11px; color: #64748b; font-weight: 500; }
        .price-val { font-size: 18px; font-weight: 800; color: #10b981; }

        /* FLOATING ACTION BAR */
        .action-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(11,19,41,0.95); border: 1px solid #222e50; backdrop-filter: blur(16px); padding: 12px 24px; border-radius: 100px; display: flex; align-items: center; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 90; max-width: 90vw; width: max-content; }
        .action-bar.visible { transform: translateX(-50%) translateY(0); }
        .bar-count { font-size: 13px; color: #94a3b8; font-weight: 500; white-space: nowrap; }
        .bar-count strong { color: #f8fafc; font-size: 14px; }
        .bar-btn { background: #2563eb; color: white; border: none; padding: 10px 22px; border-radius: 100px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; box-shadow: 0 4px 14px rgba(37,99,235,0.4); }
        .bar-btn:hover { background: #1d4ed8; transform: scale(1.02); }

        /* OVERLAY CARRITO */
        .overlay { position: fixed; inset: 0; background: rgba(3,7,18,0.85); backdrop-filter: blur(8px); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: #0b1329; border: 1px solid #1e293b; border-radius: 20px; width: 100%; max-width: 650px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.7); animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-header { padding: 18px 24px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
        .modal-header h2 { font-size: 16px; font-weight: 700; color: #f8fafc; }
        .close-btn { background: none; border: none; color: #64748b; font-size: 20px; cursor: pointer; padding: 4px; transition: color 0.2s; }
        .close-btn:hover { color: #f8fafc; }

        .modal-body { padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        
        /* ITEMS RESUMEN */
        .resumen-lista { display: flex; flex-direction: column; gap: 10px; }
        .resumen-item { background: #111a36; border: 1px solid #1e293b; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .item-main { display: flex; flex-direction: column; gap: 2px; }
        .item-name { font-size: 13px; font-weight: 700; color: #f8fafc; }
        .item-brand { font-size: 10px; text-transform: uppercase; font-weight: 600; color: #64748b; letter-spacing: 0.05em; }
        .item-p { font-size: 14px; font-weight: 700; color: #10b981; white-space: nowrap; }

        /* FORMULARIO INTERNO */
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 500px) { .form-grid { grid-template-columns: 1fr 1fr; } .grid-full { grid-column: span 2; } }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.03em; }
        .form-input { background: #111a36; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 12px; color: #f8fafc; font-size: 13px; outline: none; transition: border-color 0.2s; width: 100%; }
        .form-input:focus { border-color: #2563eb; }
        .form-select { background: #111a36; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 12px; color: #f8fafc; font-size: 13px; outline: none; cursor: pointer; width: 100%; -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 14px; padding-right: 36px; }
        .form-select:focus { border-color: #2563eb; }

        /* CONDICIONES BOX */
        .condiciones-box { background: rgba(16,185,129,0.06); border: 1px dashed rgba(16,185,129,0.3); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
        .condiciones-box h4 { font-size: 11px; font-weight: 700; color: #34d399; text-transform: uppercase; letter-spacing: 0.05em; }
        .condiciones-box p { font-size: 12px; color: #a7f3d0; line-height: 1.4; white-space: pre-line; }

        .modal-footer { padding: 16px 24px; border-top: 1px solid #1e293b; display: flex; flex-direction: column; gap: 12px; }
        .total-row { display: flex; align-items: baseline; justify-content: space-between; }
        .total-l { font-size: 13px; font-weight: 600; color: #94a3b8; }
        .total-v { font-size: 22px; font-weight: 800; color: #10b981; }
        
        .submit-btn { background: #10b981; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; width: 100%; box-shadow: 0 4px 14px rgba(16,185,129,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .submit-btn:hover { background: #059669; transform: scale(1.01); }
        .submit-btn:disabled { background: #1f293d; color: #4b5563; cursor: not-allowed; box-shadow: none; }
        
        .form-status { display: none; font-size: 12px; padding: 10px 12px; border-radius: 8px; text-align: center; font-weight: 500; }
        .form-status.error { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
        .form-status.loading { background: rgba(59,130,246,0.1); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); }

        /* LOADING INICIAL */
        .loader-screen { position: fixed; inset: 0; background: #030712; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity 0.3s; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(37,99,235,0.1); border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-screen p { font-size: 13px; color: #64748b; font-weight: 500; }
    </style>
</head>
<body>

<div id="loader" class="loader-screen">
    <div class="spinner"></div>
    <p>Cargando catálogo TLC...</p>
</div>

<header class="header">
    <img src="https://img.icons8.com/fluency/96/laser-beam.png" alt="TLC" class="logo">
    <div class="header-text">
        <h1>TECNOLOGÍA LÁSER CORNEAL</h1>
        <p>Ecosistema Comercial Unificado — TLC SRL</p>
    </div>
</header>

<div class="main-container">
    <!-- FILTROS -->
    <aside class="sidebar">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="txt-buscar" class="search-input" placeholder="Buscar equipo o marca...">
        </div>
        
        <div class="filter-section">
            <h3>Categorías</h3>
            <div id="grp-categorias" class="filter-group">
                <button class="filter-btn active" data-cat="TODOS">Todos</button>
                <button class="filter-btn" data-cat="laser">Láseres</button>
                <button class="filter-btn" data-cat="micro">Microquerátomos</button>
                <button class="filter-btn" data-cat="tomo">Tomógrafos</button>
            </div>
        </div>

        <div class="filter-section">
            <h3>Marcas</h3>
            <div id="grp-marcas" class="filter-group">
                <!-- Se llena dinámicamente -->
            </div>
        </div>
    </aside>

    <!-- GRILLA -->
    <main class="content-area">
        <div id="grilla" class="grid-equipos"></div>
    </main>
</div>

<!-- BARRA FLOTANTE -->
<div id="action-bar" class="action-bar">
    <div class="bar-count">Seleccionados: <strong id="bar-cant">0</strong></div>
    <button id="btn-abrir-carrito" class="bar-btn">Configurar Propuesta</button>
</div>

<!-- OVERLAY FORMULARIO/CARRITO -->
<div id="overlay-carrito" class="overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h2>Configuración de Propuesta Comercial</h2>
            <button id="btn-cerrar-modal" class="close-btn">✕</button>
        </div>
        <div class="modal-body">
            
            <div class="input-group">
                <label>Vendedor Asesor</label>
                <select id="f-vendedor" class="form-select">
                    <option value="Cristian Hirth">Cristian Hirth</option>
                    <option value="Lucio Raineri">Lucio Raineri</option>
                    <option value="Lourdes Davalos">Lourdes Davalos</option>
                    <option value="Asesor Externo">Asesor Externo</option>
                </select>
            </div>

            <div class="resumen-lista" id="modal-items">
                <!-- Items del carrito -->
            </div>

            <div class="form-grid">
                <div class="input-group">
                    <label>Nombre y Apellido del Médico</label>
                    <input type="text" id="f-medico" class="form-input" placeholder="Ej: Dr. Alejandro Martínez">
                </div>
                <div class="input-group">
                    <label>Razón Social / Institución</label>
                    <input type="text" id="f-institucion" class="form-input" placeholder="Ej: Clínica de Ojos San Vicente">
                </div>
                <div class="input-group">
                    <label>CUIT</label>
                    <input type="text" id="f-cuit" class="form-input" placeholder="Ej: 30-71458963-9">
                </div>
                <div class="input-group">
                    <label>Teléfono de Contacto</label>
                    <input type="text" id="f-tel" class="form-input" placeholder="Ej: +54 9 11 5555-1234">
                </div>
                <div class="input-group grid-full">
                    <label>Modalidad de Financiación</label>
                    <select id="f-financ" class="form-select">
                        <option value="CONTADO USD">Pago Contado (Billete USD)</option>
                        <option value="LEASING 36c ARS">Leasing Financiero 36 Meses (Pesos ARS)</option>
                        <option value="CUOTAS TLC USD">Financiación Directa TLC (Cuotas USD)</option>
                    </select>
                </div>
                <div class="input-group grid-full">
                    <label>Notas / Aclaraciones Particulares</label>
                    <input type="text" id="f-notas" class="form-input" placeholder="Ej: Entrega inmediata. No incluye camilla.">
                </div>
            </div>

            <div class="condiciones-box" id="box-condiciones">
                <h4>Condiciones Comerciales Aplicadas</h4>
                <p id="txt-condiciones">Cargando términos...</p>
            </div>

            <div id="form-status" class="form-status"></div>

        </div>
        <div class="modal-footer">
            <div class="total-row">
                <span class="total-l">Valor de Referencia (Neto):</span>
                <span id="modal-total" class="total-v">USD 0</span>
            </div>
            <button id="btn-enviar" class="submit-btn">
                <span>Generar propuesta y enviar por WhatsApp</span>
            </button>
        </div>
    </div>
</div>

<script>
// ─── CONFIGURACIÓN DE URLS ──────────────────────────────────────────────────
// IMPORTANTE CRISTIAN: Recordá actualizar este string con tu URL nueva de Apps Script que termina en /exec
const FOTO_MAP_URL = 'https://script.google.com/macros/s/AKfycbxOZsC8_FfappFkx8Dj8KdsUCuVqz5QQ-jSzChKiAe6a_F_Me6GY1tFC8q42YnW00vv/exec';

// ─── ESTADO GLOBAL DE LA APLICACIÓN ─────────────────────────────────────────
let DB_RAW = [];
let MARCAS = [];
let SELECCIONADOS = [];
let FILTRO_CAT = 'TODOS';
let FILTRO_MARCA = 'TODOS';
let BUSQUEDA = '';

// ─── INICIALIZACIÓN ─────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('precios.json');
        if (!res.ok) throw new Error('No se pudo descargar precios.json');
        DB_RAW = await res.json();
        
        // Extraer marcas únicas
        const marcasSet = new Set();
        DB_RAW.forEach(e => { if (e.Marca) marcasSet.add(e.Marca.trim()); });
        MARCAS = Array.from(marcasSet).sort();
        
        renderizarFiltrosMarca();
        filtrarYRenderizar();
        configurarEventos();
        
        document.getElementById('loader').style.opacity = '0';
        setTimeout(() => document.getElementById('loader').style.display = 'none', 300);
    } catch (err) {
        console.error(err);
        document.getElementById('loader').innerHTML = `<p style="color:#f87171;padding:20px;text-align:center;">❌ Error crítico al inicializar catálogo: ${err.message}</p>`;
    }
});

// ─── RENDERS DE COMPONENTES ─────────────────────────────────────────────────
function renderizarFiltrosMarca() {
    const contenedor = document.getElementById('grp-marcas');
    let html = `<button class="filter-btn active" data-marca="TODOS">Todas</button>`;
    MARCAS.forEach(m => {
        html += `<button class="filter-btn" data-marca="${m}">${m}</button>`;
    });
    contenedor.innerHTML = html;
}

function filtrarYRenderizar() {
    const grilla = document.getElementById('grilla');
    let filtrados = DB_RAW.filter(e => {
        // Filtro Categoría
        if (FILTRO_CAT !== 'TODOS' && String(e.Tipo).toLowerCase() !== FILTRO_CAT.toLowerCase()) return false;
        // Filtro Marca
        if (FILTRO_MARCA !== 'TODOS' && e.Marca !== FILTRO_MARCA) return false;
        // Filtro Buscador
        if (BUSQUEDA) {
            const term = BUSQUEDA.toLowerCase();
            const nom = String(e.Equipo || '').toLowerCase();
            const mrc = String(e.Marca || '').toLowerCase();
            const dsc = String(e.Descripcion || '').toLowerCase();
            if (!nom.includes(term) && !mrc.includes(term) && !dsc.includes(term)) return false;
        }
        return true;
    });

    if (filtrados.length === 0) {
        grilla.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#64748b;font-size:14px;">Ningún equipo coincide con los filtros aplicados.</div>`;
        return;
    }

    let html = '';
    filtrados.forEach(e => {
        const idStr = String(e.ID);
        const isSel = SELECCIONADOS.includes(idStr);
        const pStr = e.Precio_Lista ? fmtUSD(e.Precio_Lista) : 'Consultar';
        const fotoUrl = e.Foto_Url || 'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.0.3';
        
        let pillClass = 'tomo';
        if (String(e.Tipo).toLowerCase().includes('laser')) pillClass = 'laser';
        if (String(e.Tipo).toLowerCase().includes('micro')) pillClass = 'micro';

        html += `
            <div class="equipo-card ${isSel ? 'selected' : ''}" data-id="${idStr}">
                <div class="img-container">
                    <span class="badge-brand">${e.Marca}</span>
                    <div class="select-indicator"></div>
                    <img src="${fotoUrl}" alt="${e.Equipo}" class="equipo-img" loading="lazy" onclick="abrirLightbox('${fotoUrl}'); event.stopPropagation();">
                </div>
                <div class="equipo-info">
                    <div class="equipo-title-desc">
                        <h2 class="equipo-name">${e.Equipo}</h2>
                        <p class="equipo-desc">${e.Descripcion || 'Sin descripción disponible.'}</p>
                    </div>
                    <div class="compat-pills">
                        <span class="pill ${pillClass}">${e.Tipo}</span>
                    </div>
                    <div class="price-row">
                        <span class="price-label">FOB / Lista</span>
                        <span class="price-val">${pStr}</span>
                    </div>
                </div>
            </div>
        `;
    });
    grilla.innerHTML = html;
    actualizarBarraFlotante();
}

function actualizarBarraFlotante() {
    const bar = document.getElementById('action-bar');
    const cant = document.getElementById('bar-cant');
    cant.textContent = SELECCIONADOS.length;
    if (SELECCIONADOS.length > 0) {
        bar.classList.add('visible');
    } else {
        bar.classList.remove('visible');
    }
}

// ─── LOGICA COMERCIAL Y CALCULOS CARRITO ───────────────────────────────────
function calcularCarrito() {
    let items = [];
    let netoBase = 0;
    
    SELECCIONADOS.forEach(idSel => {
        const eq = DB_RAW.find(e => String(e.ID) === idSel);
        if (eq) {
            items.push(eq);
            netoBase += Number(eq.Precio_Lista || 0);
        }
    });

    let tieneLaser = items.some(e => String(e.Tipo).toLowerCase().includes('laser'));
    let tieneMicro = items.some(e => String(e.Tipo).toLowerCase().includes('micro'));
    let tieneTomo  = items.some(e => String(e.Tipo).toLowerCase().includes('tomo'));

    let stringsCondiciones = [];
    
    if (tieneLaser && tieneMicro) {
        stringsCondiciones.push("• Bonificación Pack Quirúrgico: Incluye 2 cajas de cuchillas Moria originales de cortesía.");
    }
    if (tieneLaser && tieneTomo) {
        stringsCondiciones.push("• Garantía de Conectividad Certificada TLC: Interconexión directa de datos del mapa topográfico incluida.");
    }
    stringsCondiciones.push("• Tipo de Cambio Oficial: Billete vendedor Banco Nación al cierre del día anterior.");
    stringsCondiciones.push("• Validez de la Oferta: 7 días corridos a partir del envío de la presente.");

    return {
        items: items,
        netoBase: netoBase,
        condicionesTexto: stringsCondiciones.join("\n")
    };
}

function actualizarModalCarrito() {
    const c = calcularCarrito();
    const contenedorItems = document.getElementById('modal-items');
    const txtCond = document.getElementById('txt-condiciones');
    const txtTotal = document.getElementById('modal-total');

    let html = '';
    c.items.forEach(e => {
        html += `
            <div class="resumen-item">
                <div class="item-main">
                    <span class="item-name">${e.Equipo}</span>
                    <span class="item-brand">${e.Marca} — ${e.Tipo}</span>

// ─── CONTROL DE EVENTOS ─────────────────────────────────────────────────────
function configurarEventos() {
    // Buscador
    document.getElementById('txt-buscar').addEventListener('input', (e) => {
        BUSQUEDA = e.target.value;
        filtrarYRenderizar();
    });

    // Categorías
    document.getElementById('grp-categorias').addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('#grp-categorias .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        FILTRO_CAT = btn.dataset.cat;
        filtrarYRenderizar();
    });

    // Marcas
    document.getElementById('grp-marcas').addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('#grp-marcas .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        FILTRO_MARCA = btn.dataset.marca;
        filtrarYRenderizar();
    });

    // Selección de tarjetas
    document.getElementById('grilla').addEventListener('click', (e) => {
        const card = e.target.closest('.equipo-card');
        if (!card) return;
        const id = card.dataset.id;
        
        if (SELECCIONADOS.includes(id)) {
            SELECCIONADOS = SELECCIONADOS.filter(x => x !== id);
            card.classList.remove('selected');
        } else {
            SELECCIONADOS.push(id);
            card.classList.add('selected');
        }
        actualizarBarraFlotante();
    });

    // Modales abrir y cerrar
    document.getElementById('btn-abrir-carrito').addEventListener('click', () => {
        actualizarModalCarrito();
        document.getElementById('overlay-carrito').classList.add('active');
    });
    document.getElementById('btn-cerrar-modal').addEventListener('click', () => {
        document.getElementById('overlay-carrito').classList.remove('active');
    });

    document.getElementById('btn-enviar').addEventListener('click', ejecutarFlujoEnvio);
}

// ─── PROCESO DE ENVIOS COMBINADO ────────────────────────────────────────────
async function ejecutarFlujoEnvio() {
    const btn = document.getElementById('btn-enviar');
    
    const vendedor = document.getElementById('f-vendedor').value;
    const medico = document.getElementById('f-medico').value.trim();
    const inst = document.getElementById('f-institucion').value.trim();
    const cuit = document.getElementById('f-cuit').value.trim();
    const tel = document.getElementById('f-tel').value.trim();
    const financ = document.getElementById('f-financ').value;
    const notas = document.getElementById('f-notas').value.trim();

    if (!medico || !tel) {
        msgStatus("❌ Error: Los campos Nombre del Médico y Teléfono son obligatorios para el seguimiento.", "error");
        return;
    }

    btn.disabled = true;
    msgStatus("🔄 Sincronizando datos y compilando propuesta interactiva...", "loading");

    const c = calcularCarrito();
    const idCotActual = 'TLC-' + new Date().getFullYear() + String(new Date().getMonth() + 1).padStart(2,'0') + String(new Date().getDate()).padStart(2,'0') + '-' + Math.random().toString(36).substring(2,6).toUpperCase();
    
    const stringModelos = c.items.map(i => i.Equipo).join(" + ");
    const htmlPresupuesto = generarHTMLCotizacion(c, idCotActual, medico, inst, cuit, financ, notas, vendedor);

    try {
        // Impacto 1: Subir presupuesto interactivo a GitHub Pages
        const resGit = await fetch(FOTO_MAP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
                accion: 'subirCotizacion',
                idCot: idCotActual,
                html: htmlPresupuesto
            })
        });
        
        const rawGitText = await resGit.text();
        let gitObj;
        try { gitObj = JSON.parse(rawGitText); } catch(e) { throw new Error("La Web App devolvió texto plano en vez de JSON. Verifica la versión de despliegue en Apps Script."); }
        
        if (gitObj.status === 'ERROR' || !gitObj.ok) {
            throw new Error(gitObj.message || gitObj.error || "Fallo en la API de GitHub");
        }
        
        const urlPublicaMedico = gitObj.link;

        // Impacto 2: Escribir fila física de auditoría en Google Sheets
        const resSheet = await fetch(FOTO_MAP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
                accion: 'registrarCotizacion',
                idCotizacion: idCotActual,
                vendedor: vendedor,
                nombreMedico: medico,
                razonSocial: inst,
                cuit: cuit,
                telefono: tel,
                equipoModelo: stringModelos,
                precioEquipo: c.netoBase,
                modalidadFinanciacion: financ,
                detalleFinanciacion: obtenerDetalleFinanc(financ, c.netoBase),
                condicionesComerciales: c.condicionesTexto,
                notas: notas,
                linkPdf: urlPublicaMedico
            })
        });

        const rawSheetText = await resSheet.text();
        let sheetObj = JSON.parse(rawSheetText);
        
        if (sheetObj.status !== 'SUCCESS') {
            throw new Error(sheetObj.message || "Error al escribir en Google Sheets");
        }

        // Éxito: Lanzar WhatsApp Link
        msgStatus("✅ Propuesta generada con éxito. Redirigiendo a WhatsApp...", "loading");
        
        const txtWhatsApp = `Hola Dr. ${medico}, un gusto saludarlo. Le adjunto por este medio la propuesta comercial formal de TLC SRL correspondiente al equipamiento oftalmológico consultado:\n\n📊 *Detalle:* ${stringModelos}\n📋 *Cotización N°:* ${idCotActual}\n\n🔗 *Acceso a la propuesta interactiva con opciones de pago:* ${urlPublicaMedico}\n\nQuedo a su entera disposición para coordinar una reunión técnica o evacuar cualquier duda comercial.\n\nAtentamente,\n*${vendedor}* - Tecnología Láser Corneal`;
        
        const cleanTel = tel.replace(/[^0-9+]/g, '');
        window.open(`https://api.whatsapp.com/send?phone=${cleanTel}&text=${encodeURIComponent(txtWhatsApp)}`, '_blank');

        // Resetear carrito de compras
        SELECCIONADOS = [];
        document.querySelectorAll('.equipo-card').forEach(c => c.classList.remove('selected'));
        actualizarBarraFlotante();
        document.getElementById('overlay-carrito').classList.remove('active');
        msgStatus("", "");

    } catch (err) {
        console.error(err);
        msgStatus(`❌ Error registrando en Sheets: ${err.message}. El backend interrumpió el proceso.`, "error");
    } finally {
        btn.disabled = false;
    }
}

// ─── HELPERS AUXILIARES ─────────────────────────────────────────────────────
function fmtUSD(num) {
    return 'USD ' + Number(num).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function msgStatus(msg, tipo) {
    const el = document.getElementById('form-status');
    el.textContent = msg;
    el.className = `form-status${tipo ? ' ' + tipo : ''}`;
    el.style.display = msg ? 'block' : 'none';
}

function obtenerDetalleFinanc(m, total) {
    if (m.includes('CONTADO')) return 'Pago 100% Contado Billete contra entrega.';
    if (m.includes('LEASING')) {
        const adelanto = Math.round(total * 0.3 * 1630);
        const cuota = Math.round((total * 0.85 / 36) * 1680);
        return `Adelanto inicial 30% aprox ARS ${adelanto.toLocaleString()} / 36 cuotas fijas mensuales de ARS ${cuota.toLocaleString()}`;
    }
    const c = Math.round((total * 1.05) / 12);
    return `Financiación directa TLC: 12 cuotas mensuales en USD de ${fmtUSD(c)}`;
}
