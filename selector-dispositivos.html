<!DOCTYPE html>
<html lang="es">

        .comision-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(6,214,160,0.15); color: #06d6a0; border: 1px solid #06d6a0; border-radius: 8px; padding: 10px 14px; font-size: 15px; font-weight: 700; }
        .btn-enviar { width: 100%; padding: 14px; border-radius: 10px; background: #3a86ff; border: none; color: white; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }

</head>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.min.js"></script>
<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const CLIENT_ID    = '59d36de7-90e9-41ce-9566-27bcb563b5ab';
const TENANT_ID    = 'bbd111b8-0522-4e3d-9f43-78d1ca0e71cf';
const SHEET_ID     = '1WNEOD8qtHJfyM0wVgQqCEKOkDNg4Z6mJU1KrCIfh2nU';
const SCOPES       = ['User.Read'];

// Mapa nombre_archivo → URL lh3 (cargado desde Apps Script)
const FOTO_MAP_URL = 'https://script.google.com/macros/s/AKfycbxD37pl_gc0wADzn0d2NgQ1on6wx1LZGQoP861rdrQXZqJxqx1OEaRYvK06GHQBlaYw/exec';
let fotoMap = {};

const msalConfig = {
    auth: {
        clientId: CLIENT_ID,
        authority: `https://login.microsoftonline.com/${TENANT_ID}`,
        redirectUri: 'https://cahirth.github.io/Portal-TLC/selector-dispositivos.html'
    },
    cache: { cacheLocation: 'sessionStorage' }
};

// Modalidades — el descKey es el GATILLO: si está vacío, no se muestra el botón
const MODALIDADES = [
    {
        key: 'CONTADO', label: 'Contado USD',
        triggerKey: 'Descripcion_USD_CONTADO',
        precioKey: 'Precio CONTADO CNO', cuotaKey: null,
        descKey: 'Descripcion_USD_CONTADO', moneda: 'USD'
    },
    {
        key: 'TLC6', label: 'Directo 6c AR$',
        triggerKey: 'Descripcion_TLC_$_6',
        precioKey: 'Adelanto_TLC_$_6', cuotaKey: 'CUOTA_TLC_$_6',
        descKey: 'Descripcion_TLC_$_6', moneda: 'ARS'
    },
    {
        key: 'TLC12', label: 'Directo 12c AR$',
        triggerKey: 'Descripcion_TLC_$_12',
        precioKey: 'Adelanto_TLC_$_12', cuotaKey: 'CUOTA_TLC_$_12',
        descKey: 'Descripcion_TLC_$_12', moneda: 'ARS'
    },
    {
        key: 'TLC6USD', label: 'Directo 6c USD',
        triggerKey: 'Descripcion_TLC_USD_6',
        precioKey: 'Adelanto_TLC_USD_6', cuotaKey: 'CUOTA_TLC_USD_6',
        descKey: 'Descripcion_TLC_USD_6', moneda: 'USD'
    },
    {
        key: 'TLC12USD', label: 'Directo 12c USD',
        triggerKey: 'Descripcion_TLC_USD_12',
        precioKey: 'Adelanto_TLC_USD_12', cuotaKey: 'CUOTA_TLC_USD_12',
        descKey: 'Descripcion_TLC_USD_12', moneda: 'USD'
    },
    {
        key: 'LEASING', label: 'Leasing 36c AR$',
        triggerKey: 'Descripcion_L$_36',
        precioKey: 'Adelanto_L$_36', cuotaKey: 'Cuota_L$_36',
        descKey: 'Descripcion_L$_36', moneda: 'ARS'
    },
    {
        key: 'LEASINGUSD', label: 'Leasing 36c USD',
        triggerKey: 'Descripcion_L_USD_36',
        precioKey: 'Adelanto_L_USD_36', cuotaKey: 'Cuota_L_USD_36',
        descKey: 'Descripcion_L_USD_36', moneda: 'USD'
    },
    {
        key: 'CREDITO', label: 'Crédito',
        triggerKey: 'Descripcion_$_CREDICOOP_36',
        precioKey: 'Adelanto_$_CREDICOOP', cuotaKey: 'Cuotas_$_CREDICOOP_36',
        descKey: 'Descripcion_$_CREDICOOP_36', moneda: 'ARS'
    },
];

let msal_app = null;
let currentUser = null;
let currentUserRol = 'Vend_Externo';
let dispositivos = [];
let dispositivoActual = null;
let modalidadActual = null;

// ─── MSAL ─────────────────────────────────────────────────────────────────────
async function initMsal() {
    msal_app = new msal.PublicClientApplication(msalConfig);
    await msal_app.initialize();
    const resp = await msal_app.handleRedirectPromise();
    if (resp?.account) { await mostrarApp(resp.account); return; }
    const accounts = msal_app.getAllAccounts();
    if (accounts.length > 0) { await mostrarApp(accounts[0]); }
}

async function mostrarApp(account) {
    currentUser = account;
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('app-section').style.display = 'block';
    const nombre = account.name || account.username;
    document.getElementById('user-greeting').textContent = `Hola, ${nombre}`;
    await cargarTodo();
}

// ─── MAPA DE FOTOS DESDE APPS SCRIPT ──────────────────────────────────────────
async function cargarFotoMap() {
    try {
        const res = await fetch(FOTO_MAP_URL, { redirect: 'follow' });
        const text = await res.text();
        const data = JSON.parse(text);
        if (data.error) { console.warn('FotoMap Apps Script error:', data.error); return; }
        fotoMap = data;
        console.log(`FotoMap cargado: ${Object.keys(fotoMap).length} archivos`, Object.keys(fotoMap).slice(0,5));
    } catch(e) {
        console.warn('No se pudo cargar fotoMap:', e.message);
    }
}

// ─── CARGAR DATOS ─────────────────────────────────────────────────────────────
async function fetchSheet(sheetName) {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const cols = json.table.cols.map(c => c.label);
    return (json.table.rows || [])
        .filter(row => row?.c?.some(c => c?.v !== null && c?.v !== ''))
        .map(row => {
            const obj = {};
            cols.forEach((col, i) => {
                const cell = row.c?.[i];
                obj[col] = (cell && cell.v !== null && cell.v !== undefined) ? cell.v : '';
            });
            return obj;
        });
}

async function cargarTodo() {
    try {
        // Cargar fotoMap primero, luego los sheets en paralelo
        await cargarFotoMap();

        const [dispRows, vendRows] = await Promise.all([
            fetchSheet('Lista_Precios'),
            fetchSheet('Vendedores')
        ]);

        dispositivos = dispRows.filter(d => d['Nombre de Dispositivo']?.toString().trim());

        // Determinar rol del usuario logueado
        const email = currentUser?.username?.toLowerCase() || '';
        const vendedor = vendRows.find(v => v['Email']?.toLowerCase() === email);
        currentUserRol = vendedor?.['Rol'] || 'Vend_Externo';

        renderLista(dispositivos);
    } catch(e) {
        document.getElementById('lista').innerHTML = `<div class="empty">❌ Error cargando datos: ${e.message}</div>`;
    }
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function tieneValor(v) {
    return v !== null && v !== undefined && v !== '' && v !== 0 && v !== '0';
}

function fmtARS(n) {
    const num = parseFloat(String(n).replace(/\./g, '').replace(',', '.'));
    if (isNaN(num)) return null;
    return 'AR$ ' + Math.round(num).toLocaleString('es-AR');
}

function fmtUSD(n) {
    const num = parseFloat(String(n).replace(/\./g, '').replace(',', '.'));
    if (isNaN(num)) return null;
    return 'USD ' + Math.round(num).toLocaleString('es-AR');
}

function fotoUrl(foto) {
    if (!foto) return '';
    const s = foto.toString().trim();

    // Ya es lh3 directa
    if (s.includes('lh3.googleusercontent.com')) return s;

    // URL de Drive tipo /file/d/ID/view  →  lh3
    const mDrive = s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (mDrive) return `https://lh3.googleusercontent.com/d/${mDrive[1]}`;

    // Ruta relativa tipo "Fotos/HVS1.png"  →  buscar en fotoMap
    const mFotos = s.match(/^Fotos\/(.+)$/i);
    if (mFotos) {
        const nombre = mFotos[1].toLowerCase();
        return fotoMap[nombre] || '';
    }

    return '';
}

// ─── RENDER LISTA ─────────────────────────────────────────────────────────────
function renderLista(items) {
    const lista = document.getElementById('lista');
    if (!items.length) { lista.innerHTML = '<div class="empty">Sin resultados</div>'; return; }

    lista.innerHTML = items.map((d, i) => {
        const nombre   = d['Nombre de Dispositivo'] || '';
        const cat      = d['Categoria'] || '';
        const oferta   = d['Oferta'] === true || d['Oferta'] === 'TRUE';
        const precio   = d['Precio CONTADO CNO'];
        const foto     = fotoUrl(d['Foto'] || '');
        const precioStr = tieneValor(precio) ? fmtUSD(precio) : 'Consultar';

        // Pills: modalidades disponibles
        const pills = MODALIDADES
            .filter(m => tieneValor(d[m.precioKey]))
            .map(m => `<span class="card-pill">${m.label}</span>`)
            .join('');

        const fotoEl = foto
            ? `<img class="card-foto" src="${foto}" loading="lazy" onerror="this.outerHTML='<div class=\\'card-foto-placeholder\\'>🔬</div>'">`
            : `<div class="card-foto-placeholder">🔬</div>`;

        return `<div class="dispositivo-card ${oferta ? 'oferta' : ''}" onclick="abrirDetalle(${i})">
            <div class="card-header">
                ${fotoEl}
                <div class="card-info">
                    ${oferta ? '<span class="oferta-badge">⭐ OFERTA</span>' : ''}
                    <div class="card-nombre">${nombre}</div>
                    <div class="card-categoria">${cat}</div>
                    <div class="card-precio">${precioStr}</div>
                </div>
                <span style="color:#94a3b8;font-size:18px">›</span>
            </div>
            ${pills ? `<div class="card-pills">${pills}</div>` : ''}
        </div>`;
    }).join('');
}

// ─── FILTROS Y BÚSQUEDA ───────────────────────────────────────────────────────
document.querySelectorAll('.filtro-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtrar();
    });
});

document.getElementById('buscador').addEventListener('input', filtrar);

function filtrar() {
    const cat = document.querySelector('.filtro-btn.active')?.dataset.cat || 'TODOS';
    const q = document.getElementById('buscador').value.toLowerCase().trim();
    const filtrados = dispositivos.filter(d => {
        const esOferta = d['Oferta'] === true || d['Oferta'] === 'TRUE';
        const matchCat = cat === 'TODOS' || cat === 'OFERTAS'
            ? (cat === 'OFERTAS' ? esOferta : true)
            : d['Categoria'] === cat;
        const nombre = (d['Nombre de Dispositivo'] || '').toLowerCase();
        const desc = (d['Descripcion'] || '').toLowerCase();
        const matchQ = !q || nombre.includes(q) || desc.includes(q);
        return matchCat && matchQ;
    });
    renderLista(filtrados);
}

// ─── DETALLE ─────────────────────────────────────────────────────────────────
function abrirDetalle(idx) {
    const cat = document.querySelector('.filtro-btn.active')?.dataset.cat || 'TODOS';
    const q = document.getElementById('buscador').value.toLowerCase().trim();
    const filtrados = dispositivos.filter(d => {
        const matchCat = cat === 'TODOS' || d['Categoria'] === cat;
        const nombre = (d['Nombre de Dispositivo'] || '').toLowerCase();
        const desc = (d['Descripcion'] || '').toLowerCase();
        const matchQ = !q || nombre.includes(q) || desc.includes(q);
        return matchCat && matchQ;
    });

    dispositivoActual = filtrados[idx];
    if (!dispositivoActual) return;
    const d = dispositivoActual;

    const nombre  = d['Nombre de Dispositivo'] || '';
    const desc    = d['Descripcion'] || '';
    const foto    = fotoUrl(d['Foto'] || '');
    const folleto = d['Link_Folleto'] || '';

    document.getElementById('detalle-titulo').textContent = nombre;
    document.getElementById('detalle-nombre').textContent = nombre;
    document.getElementById('detalle-desc').textContent = desc;

    // Foto
    const wrap = document.getElementById('detalle-foto-wrap');
    wrap.innerHTML = foto
        ? `<img class="detalle-foto" src="${foto}" onerror="this.outerHTML='<div class=\\'detalle-foto-placeholder\\'>🔬</div>'">`
        : `<div class="detalle-foto-placeholder">🔬</div>`;

    // Precio Lista (siempre mostrar si tiene valor)
    const precioLista = d['Precio LISTA'];
    const plWrap = document.getElementById('precio-lista-wrap');
    const plValor = document.getElementById('precio-lista-valor');
    if (tieneValor(precioLista)) {
        plValor.textContent = fmtUSD(precioLista);
        plWrap.style.display = 'block';
    } else {
        plWrap.style.display = 'none';
    }

    // Folleto
    const btnFolleto = document.getElementById('btn-folleto');
    if (folleto) { btnFolleto.href = folleto; btnFolleto.style.display = 'flex'; }
    else { btnFolleto.style.display = 'none'; }

    // Modalidades disponibles — usar triggerKey (Descripcion) como gatillo
    const modalDisp = MODALIDADES.filter(m => tieneValor(d[m.triggerKey]));
    const secMod = document.getElementById('sec-modalidades');
    const grid = document.getElementById('modalidades-grid');
    const precioDetalle = document.getElementById('precio-detalle');

    if (modalDisp.length > 0) {
        secMod.style.display = 'block';
        precioDetalle.style.display = 'block';
        grid.innerHTML = modalDisp.map(m =>
            `<button class="modalidad-btn" data-key="${m.key}" onclick="seleccionarModalidad('${m.key}')">${m.label}</button>`
        ).join('');
        seleccionarModalidad(modalDisp[0].key);
    } else {
        secMod.style.display = 'none';
        grid.innerHTML = '';
        precioDetalle.style.display = 'none';
        modalidadActual = null;
    }

    document.getElementById('detalle-overlay').classList.add('open');
    document.getElementById('detalle-overlay').scrollTop = 0;
}

function seleccionarModalidad(key) {
    modalidadActual = key;
    document.querySelectorAll('.modalidad-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.key === key);
    });

    const d = dispositivoActual;
    const m = MODALIDADES.find(x => x.key === key);
    if (!m || !d) return;

    const precio = d[m.precioKey];
    const cuota  = m.cuotaKey ? d[m.cuotaKey] : null;
    const desc   = d[m.descKey] || '';
    const precioContado = d['Precio CONTADO CNO'];

    // Precio principal
    let precioStr = 'Consultar';
    if (tieneValor(precio)) {
        precioStr = m.moneda === 'USD' ? fmtUSD(precio) : fmtARS(precio);
    }
    document.getElementById('precio-principal').textContent = precioStr;

    // Referencia USD para modalidades en ARS
    const refEl = document.getElementById('precio-usd-ref');
    if (m.moneda === 'ARS' && tieneValor(precioContado)) {
        refEl.textContent = `Ref. contado: ${fmtUSD(precioContado)}`;
    } else {
        refEl.textContent = '';
    }

    document.getElementById('precio-desc').textContent = desc;

    // Cuota
    const cuotaEl = document.getElementById('precio-cuota');
    if (tieneValor(cuota)) {
        const cuotaStr = m.moneda === 'USD' ? fmtUSD(cuota) : fmtARS(cuota);
        cuotaEl.textContent = `Cuota: ${cuotaStr}`;
    } else {
        cuotaEl.textContent = '';
    }
}

document.getElementById('btn-back').addEventListener('click', () => {
    document.getElementById('detalle-overlay').classList.remove('open');
});

// ─── FORMULARIO ───────────────────────────────────────────────────────────────
document.getElementById('btn-cotizar').addEventListener('click', abrirFormulario);
document.getElementById('btn-form-back').addEventListener('click', () => {
    document.getElementById('form-overlay').classList.remove('open');
});

function abrirFormulario() {
    const d = dispositivoActual;
    if (!d) return;

    const modalLabel = MODALIDADES.find(m => m.key === modalidadActual)?.label || '';
    document.getElementById('form-disp').textContent =
        `${d['Nombre de Dispositivo']}${modalLabel ? ' — ' + modalLabel : ''}`;

    // Vendedor = nombre completo del usuario logueado
    document.getElementById('f-vendedor').value = currentUser?.name || currentUser?.username || '';

    // Comisión solo para externos
    const esExterno = currentUserRol === 'Vend_Externo';
    const comGrp = document.getElementById('f-comision-group');
    const comVal = document.getElementById('f-comision-valor');
    if (esExterno && tieneValor(d['COMISIONES'])) {
        comGrp.style.display = 'block';
        comVal.textContent = `💰 ${d['COMISIONES']}`;
    } else {
        comGrp.style.display = 'none';
    }

    // Limpiar
    ['f-nombre','f-telefono','f-notas'].forEach(id => document.getElementById(id).value = '');
    const st = document.getElementById('form-status');
    st.className = 'form-status';
    st.style.display = 'none';

    document.getElementById('form-overlay').classList.add('open');
    document.getElementById('form-overlay').scrollTop = 0;
}

document.getElementById('btn-enviar').addEventListener('click', guardarCotizacion);

async function guardarCotizacion() {
    const nombre   = document.getElementById('f-nombre').value.trim();
    const telefono = document.getElementById('f-telefono').value.trim();
    const notas    = document.getElementById('f-notas').value.trim();
    const vendedor = document.getElementById('f-vendedor').value.trim();

    if (!nombre) { mostrarFormStatus('Completá el nombre y apellido.', 'error'); return; }

    const btn = document.getElementById('btn-enviar');
    btn.disabled = true;

    const d = dispositivoActual;
    const modalLabel = MODALIDADES.find(m => m.key === modalidadActual)?.label || '';
    const fecha = new Date().toLocaleString('es-AR');

    console.log('Cotización:', { fecha, dispositivo: d['Nombre de Dispositivo'], modalidad: modalLabel, nombre, telefono, notas, vendedor });

    // Por ahora simula éxito — próximo paso: conectar al Excel
    setTimeout(() => {
        btn.disabled = false;
        mostrarFormStatus(`✅ Cotización guardada para ${nombre}`, 'ok');
        ['f-nombre','f-telefono','f-notas'].forEach(id => document.getElementById(id).value = '');
    }, 600);
}

function mostrarFormStatus(msg, tipo) {
    const el = document.getElementById('form-status');
    el.textContent = msg;
    el.className = `form-status${tipo ? ' ' + tipo : ''}`;
    el.style.display = 'block';
}

// ─── ARRANCAR ─────────────────────────────────────────────────────────────────
document.getElementById('btn-login').addEventListener('click', () => msal_app.loginRedirect({ scopes: SCOPES }));
initMsal().catch(console.error);
</script>
