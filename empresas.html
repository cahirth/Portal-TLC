<html lang="es">
<head>
<script src="version.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empresas — Portal TLC</title>
<style>
  :root {
    --bg:#080d14; --panel-dark:#0f1a30; --panel-darker:#080d14; --border-glow:#1e3050;
    --text-main:#f1f5f9; --text-muted:#64748b; --text-dim:#475569;
    --accent-blue:#3a86ff; --accent-green:#06d6a0; --accent-orange:#f8961e; --accent-red:#f87171;
  }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',sans-serif; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text-main); min-height:100vh; }

  .header { background:linear-gradient(135deg,#05111f,#0c1e3a); padding:0 16px; display:flex; align-items:center; gap:12px;
    border-bottom:1px solid rgba(58,134,255,0.15); position:sticky; top:0; z-index:100; height:58px; }
  .header::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:linear-gradient(90deg,#3a86ff,#06d6a0,#3a86ff); }
  .btn-back { width:34px; height:34px; border-radius:50%; background:#3a86ff; border:none; color:#fff; font-size:18px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .logo { height:30px; width:auto; flex-shrink:0; cursor:pointer; }
  .header-text h1 { font-size:14px; font-weight:700; }
  .header-text p { font-size:10px; color:var(--text-muted); margin-top:1px; }

  .avatar-wrap { position:relative; margin-left:auto; flex-shrink:0; }
  .avatar-btn { width:36px; height:36px; border-radius:50%; background:#1c2541; border:1px solid #222e50; color:#3a86ff;
    font-size:13px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .avatar-menu { display:none; position:absolute; top:44px; right:0; width:220px; background:#0d1520; border:1px solid var(--border-glow);
    border-radius:14px; padding:14px; z-index:200; box-shadow:0 16px 48px rgba(0,0,0,.5); }
  .avatar-menu.open { display:block; }
  .avatar-menu-label { font-size:9px; color:var(--text-dim); text-transform:uppercase; font-weight:700; margin-bottom:8px; }
  .tema-toggle { display:flex; background:#080d14; border:1px solid var(--border-glow); border-radius:8px; overflow:hidden; }
  .tema-toggle button { flex:1; padding:8px; font-size:11px; font-weight:700; border:none; background:transparent; color:var(--text-muted); cursor:pointer; }
  .tema-toggle button.active { background:var(--accent-blue); color:#fff; }

  .wrap { max-width:900px; margin:0 auto; padding:20px 16px 60px; }

  /* ── BUSCADOR + LISTA ── */
  .buscador-row { display:flex; gap:10px; margin-bottom:16px; }
  .buscador-input { flex:1; background:var(--panel-dark); border:1px solid var(--border-glow); border-radius:10px;
    padding:11px 14px; color:var(--text-main); font-size:13px; outline:none; }
  .buscador-input:focus { border-color:var(--accent-blue); }
  .btn-nueva { padding:11px 18px; border-radius:10px; background:var(--accent-blue); border:none; color:#fff; font-size:13px;
    font-weight:700; cursor:pointer; white-space:nowrap; }

  .empresa-card { background:var(--panel-dark); border:1px solid var(--border-glow); border-radius:12px; padding:16px;
    margin-bottom:10px; cursor:pointer; transition:border-color .15s; }
  .empresa-card:hover { border-color:var(--accent-blue); }
  .empresa-card-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .empresa-card-razon { font-size:15px; font-weight:500; color:var(--text-main); }
  .empresa-card-cuit { font-size:11px; color:var(--text-muted); margin-top:2px; }
  .empresa-card-meta { display:flex; gap:14px; margin-top:10px; }
  .empresa-card-meta span { font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:5px; }
  .empresa-card-meta b { color:var(--accent-blue); }
  .empty-lista { text-align:center; padding:40px 20px; color:var(--text-dim); font-size:13px; }

  /* ── DETALLE EMPRESA ── */
  .section { background:var(--panel-dark); border:1px solid var(--border-glow); border-radius:14px; padding:18px; margin-bottom:16px; }
  .section-title { font-size:11px; font-weight:800; color:var(--accent-blue); text-transform:uppercase; letter-spacing:0.6px;
    margin-bottom:14px; display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .section-title .hint { font-size:10px; font-weight:600; color:var(--text-dim); text-transform:none; letter-spacing:0; }

  .det-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .det-campo label { font-size:9px; color:var(--text-dim); text-transform:uppercase; font-weight:700; display:block; margin-bottom:4px; }
  .det-campo input { width:100%; background:var(--panel-darker); border:1px solid var(--border-glow); border-radius:8px;
    padding:9px 11px; color:var(--text-main); font-size:12px; outline:none; }
  .det-campo input:focus { border-color:var(--accent-blue); }
  .det-campo.full { grid-column:1 / -1; }

  .acciones-empresa { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .btn-guardar-empresa { flex:1; padding:11px; border-radius:9px; background:var(--accent-blue); border:none; color:#fff;
    font-size:12px; font-weight:700; cursor:pointer; }
  .btn-borrar-empresa { padding:11px 16px; border-radius:9px; background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.25);
    color:var(--accent-red); font-size:12px; font-weight:700; cursor:pointer; }

  /* ── CONTACTOS ── */
  .contacto-card { background:var(--panel-darker); border:1px solid var(--border-glow); border-radius:10px; padding:12px 14px;
    margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .contacto-info .nombre { font-size:13px; font-weight:700; color:var(--text-main); }
  .contacto-info .cargo { font-size:11px; color:var(--accent-blue); margin-top:1px; }
  .contacto-info .datos { font-size:10px; color:var(--text-muted); margin-top:3px; }
  .contacto-acciones { display:flex; gap:6px; flex-shrink:0; }
  .btn-icon-mini { width:28px; height:28px; border-radius:7px; background:transparent; border:1px solid var(--border-glow);
    color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .btn-icon-mini:hover { border-color:var(--accent-blue); color:var(--accent-blue); }
  .btn-icon-mini.danger:hover { border-color:var(--accent-red); color:var(--accent-red); }

  .btn-agregar-contacto { width:100%; padding:11px; border-radius:10px; background:transparent; border:1px dashed rgba(58,134,255,.4);
    color:var(--accent-blue); font-size:12px; font-weight:600; cursor:pointer; margin-top:4px; }

  .form-contacto { background:var(--panel-darker); border:1px solid var(--accent-blue); border-radius:10px; padding:14px; margin-top:10px; }
  .form-contacto .det-grid { margin-bottom:10px; }

  /* ── NEGOCIOS ASOCIADOS ── */
  .negocio-card { background:var(--panel-darker); border:1px solid var(--border-glow); border-radius:10px; padding:12px 14px;
    margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; text-decoration:none; }
  .negocio-tipo-tag { font-size:9px; font-weight:800; padding:3px 8px; border-radius:8px; flex-shrink:0; }
  .negocio-tipo-tag.ventas { background:rgba(58,134,255,.12); color:#60a5fa; }
  .negocio-tipo-tag.servicio { background:rgba(6,214,160,.12); color:var(--accent-green); }
  .negocio-info { flex:1; min-width:0; }
  .negocio-id { font-size:12px; font-weight:700; color:var(--text-main); }
  .negocio-meta { font-size:10px; color:var(--text-muted); margin-top:2px; }
  .negocio-monto { font-size:13px; font-weight:800; color:var(--accent-green); white-space:nowrap; }
  .negocio-estado { font-size:9px; font-weight:700; padding:2px 7px; border-radius:8px; margin-top:2px; display:inline-block; }

  .btn-nuevo-negocio-wrap { display:flex; gap:10px; margin-top:10px; }
  .btn-nuevo-negocio { flex:1; padding:12px; border-radius:10px; border:none; font-size:12px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn-nuevo-negocio.ventas { background:rgba(58,134,255,.12); color:#60a5fa; border:1px solid rgba(58,134,255,.3); }
  .btn-nuevo-negocio.servicio { background:rgba(6,214,160,.12); color:var(--accent-green); border:1px solid rgba(6,214,160,.3); }

  @media (max-width:640px) { .det-grid { grid-template-columns:1fr; } }

  /* ── MODAL NUEVO NEGOCIO ── */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:300;
    align-items:center; justify-content:center; padding:16px; }
  .modal-overlay.open { display:flex; }
  .modal-panel { background:var(--panel-dark); border:1px solid var(--border-glow); border-radius:16px; padding:20px;
    width:100%; max-width:420px; max-height:90vh; overflow-y:auto; }
  .modal-titulo { font-size:14px; font-weight:800; margin-bottom:4px; }
  .modal-sub { font-size:11px; color:var(--text-muted); margin-bottom:16px; }
  .modal-campo { margin-bottom:14px; }
  .modal-campo label { font-size:9px; color:var(--text-dim); text-transform:uppercase; font-weight:700; display:block; margin-bottom:5px; }
  .modal-campo select, .modal-campo input { width:100%; background:var(--panel-darker); border:1px solid var(--border-glow); border-radius:8px;
    padding:10px 11px; color:var(--text-main); font-size:12px; outline:none; }
  .modal-campo select:focus, .modal-campo input:focus { border-color:var(--accent-blue); }
  .modal-acciones { display:flex; gap:10px; margin-top:6px; }
  .modal-warning { background:rgba(248,150,30,.08); border:1px solid rgba(248,150,30,.3); border-radius:9px; padding:10px 12px;
    font-size:11px; color:var(--accent-orange); margin-bottom:14px; }

  /* ═══════ MODO CLARO ═══════ */
  body.tema-claro { background:#f0f4f8; color:#1e293b; }
  body.tema-claro .header { background:linear-gradient(135deg,#ffffff,#f1f5f9); border-bottom-color:#cbd5e1; }
  body.tema-claro .header-text h1 { color:#0f172a; }
  body.tema-claro .avatar-btn { background:#ffffff; border-color:#cbd5e1; }
  body.tema-claro .avatar-menu { background:#ffffff; border-color:#e2e8f0; }
  body.tema-claro .tema-toggle { background:#f1f5f9; border-color:#cbd5e1; }
  body.tema-claro .tema-toggle button { color:#64748b; }
  body.tema-claro .buscador-input, body.tema-claro .empresa-card, body.tema-claro .section,
  body.tema-claro .det-campo input, body.tema-claro .contacto-card, body.tema-claro .form-contacto,
  body.tema-claro .negocio-card, body.tema-claro .modal-panel, body.tema-claro .modal-campo select,
  body.tema-claro .modal-campo input { background:#ffffff; border-color:#e2e8f0; }
  body.tema-claro .modal-campo select, body.tema-claro .modal-campo select option,
  body.tema-claro .modal-campo input { color:#0f172a; }
  body.tema-claro .empresa-card:hover { border-color:#1a4b8c; }
  body.tema-claro .empresa-card-razon, body.tema-claro .det-campo input, body.tema-claro .contacto-info .nombre,
  body.tema-claro .negocio-id, body.tema-claro .section-title .hint, body.tema-claro .buscador-input { color:#0f172a; }
  body.tema-claro .section-title .hint { color:#94a3b8; }
  body.tema-claro .btn-icon-mini { border-color:#e2e8f0; color:#64748b; }
  body.tema-claro .form-contacto { border-color:#1a4b8c; }
</style>
</head>

  <div class="wrap">

    <!-- VISTA LISTA -->
    <div id="vista-lista">

        <button class="btn-nueva" onclick="_toggleFormNuevaEmpresa()">+ Nueva empresa</button>
        <button class="btn-nueva" style="background:transparent;border:1px solid var(--border-glow);color:var(--text-muted);" onclick="document.getElementById('input-excel-empresas').click()">📥 Importar Excel</button>
        <input type="file" id="input-excel-empresas" accept=".xlsx,.xls" style="display:none;" onchange="_onSeleccionarExcel(this.files[0])">
      </div>

      <div class="section" id="import-preview-panel" style="display:none;">
        <div class="section-title">📥 Importar desde Excel</div>
        <div id="import-resumen" style="font-size:12px;color:var(--text-muted);margin-bottom:12px;"></div>
        <div id="import-lista" style="max-height:260px;overflow-y:auto;margin-bottom:12px;"></div>
        <div class="acciones-empresa">

        <div class="section-title">🏢 Nueva empresa</div>
        <div class="det-grid">

            <label>CUIT</label>
            <input type="text" id="ne-cuit" placeholder="30-XXXXXXXX-X">
          </div>
          <div class="det-campo">
            <label>Teléfono</label>
            <input type="text" id="ne-telefono" placeholder="+54...">
          </div>
          <div class="det-campo full">
            <label>Razón Social *</label>
            <input type="text" id="ne-razon" placeholder="Nombre de la empresa">
          </div>
          <div class="det-campo full">
            <label>Domicilio</label>
            <input type="text" id="ne-domicilio" placeholder="Domicilio fiscal">

        </div>
        <div class="acciones-empresa">

          <button class="btn-borrar-empresa" onclick="_toggleFormNuevaEmpresa()" style="color:var(--text-muted);background:transparent;border-color:var(--border-glow);">Cancelar</button>
        </div>
      </div>

      <div id="lista-empresas"></div>

            <input type="text" id="det-razon">

          <div class="det-campo">
            <label>CUIT</label>
            <input type="text" id="det-cuit">

          <div class="det-campo">
            <label>Teléfono</label>

// ══════════════════════════════════════════════════════════════════
// Empresas y Contactos conectados a Firebase (empresas/{id},
// contactos/{id}) vía GAS. "Negocios asociados" todavía sin cruzar
// con cotizaciones/tickets reales — próxima etapa.
// ══════════════════════════════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycbww2WC4wuvCiZnl59SzaKCMLvF99Zm3DSI7jB2sfo9x7nZis3V79YjfElha2KGDG7sC/exec';

// Sesión compartida con el resto del Portal (login OTP), solo lectura —
// empresas.html no tiene pantalla de login propia, se apoya en la sesión
// que ya haya iniciado sesión desde otro módulo (index.html, servicio.html,
// etc.), guardada en localStorage bajo la misma clave.
const SESSION_KEY = 'tlc_session_v1';
function _leerSesionCompartida() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const payload = JSON.parse(raw);
    if (!payload.expira || Date.now() > payload.expira) { localStorage.removeItem(SESSION_KEY); return null; }
    return payload.account;
  } catch(e) { return null; }
}
var EMPRESAS = []; // se llena con _cargarEmpresas() — ya no hay datos de prueba
var _empresaActualId = null;
var _cargando = false;

async function _cargarEmpresas() {
  _cargando = true;
  var cont = document.getElementById('lista-empresas');
  if (cont && !EMPRESAS.length) cont.innerHTML = '<div class="empty-lista">Cargando...</div>';
  try {
    var resp = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ accion:'listarEmpresas' }) });
    var r = await resp.json();
    if (r.ok) EMPRESAS = r.empresas || [];
    else console.warn('Error listando empresas:', r.error);
  } catch(e) { console.warn('Error de conexión al listar empresas:', e); }
  _cargando = false;
  _renderListaEmpresas();
  _cargarNegociosCruzados(); // en segundo plano — no bloquea el primer pintado de la lista
}

// ══════════════════════════════════════════════════════════════════
// NEGOCIOS ASOCIADOS — cruce real contra Ventas (historico.json) y
// Servicio Técnico (Firebase). Se hace client-side, sin tocar el GAS:
// - Ventas: cruza por CUIT si ambos lo tienen, si no por razón social
//   normalizada (mismo criterio que el resto del módulo Empresas).
// - Servicio: los tickets no tienen CUIT propio, se cruza solo por
//   nombre de cliente normalizado.
// ══════════════════════════════════════════════════════════════════
var HISTORICO_URL = 'https://raw.githubusercontent.com/cahirth/Portal-TLC/main/historico.json';
var RTDB_URL = 'https://portal-tlc-default-rtdb.firebaseio.com';

function _montoCot(c) {
  return parseFloat((c.totales||{}).total_con_iva || c.totalConIva || c.montoUSD || 0) || 0;
}

async function _cargarNegociosCruzados() {
  try {
    var resultados = await Promise.all([
      fetch(HISTORICO_URL + '?t=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }),
      fetch(RTDB_URL + '/servicio_tecnico.json', { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; }),
    ]);
    var cotizaciones = Array.isArray(resultados[0]) ? resultados[0] : [];
    var tickets = resultados[1] || {};

    EMPRESAS.forEach(function(e) {
      var cuitN = _normCuit(e.cuit);
      var razonN = _normRazon(e.razonSocial);
      var negocios = [];

      cotizaciones.forEach(function(c) {
        var cCuit = _normCuit(c.cuit || (c.empresa||{}).cuit);
        var cRazon = _normRazon(c.razonSocial || (c.empresa||{}).razonSocial || (c.cliente||{}).nombre || c.nombreMedico);
        var match = (cuitN && cCuit && cCuit === cuitN) || (razonN && cRazon && cRazon === razonN);
        if (!match) return;
        negocios.push({
          id: c.idCot || c.id_cotizacion || c.id || '—',
          tipo: 'ventas',
          estado: c.estado || 'Cotización',
          monto: _montoCot(c),
          moneda: 'USD',
          fecha: c.fecha || c.fechaCreacion || '',
        });
      });

      Object.keys(tickets).forEach(function(tid) {
        var t = tickets[tid];
        var tRazon = _normRazon(t.cliente);
        if (!razonN || !tRazon || tRazon !== razonN) return; // tickets no tienen CUIT propio
        negocios.push({
          id: t.id_ticket || tid,
          tipo: 'servicio',
          estado: t.deposito || 'recepcion',
          monto: 0,
          moneda: '',
          fecha: t.creado_en || '',
        });
      });

      negocios.sort(function(a, b) { return new Date(b.fecha||0) - new Date(a.fecha||0); });
      e.negocios = negocios;
    });

    // Repintar lo que ya esté en pantalla con los conteos reales
    _renderListaEmpresas(document.getElementById('buscador-empresas').value);
    if (_empresaActualId) {
      var eActual = EMPRESAS.find(function(x){ return x.id === _empresaActualId; });
      if (eActual) _renderNegocios(eActual);
    }
  } catch(e) { console.warn('Error cruzando negocios:', e); }
}

// ── LISTA ──
function _renderListaEmpresas(filtro) {
  var cont = document.getElementById('lista-empresas');
  var q = (filtro || '').toLowerCase();
  var lista = EMPRESAS.filter(function(e) {
    return !q || e.razonSocial.toLowerCase().includes(q) || (e.cuit||'').includes(q);
  }).sort(function(a, b) { return a.razonSocial.localeCompare(b.razonSocial, 'es', { sensitivity:'base' }); });
  if (!lista.length) { cont.innerHTML = '<div class="empty-lista">' + (EMPRESAS.length ? 'Sin resultados.' : 'Todavía no cargaste ninguna empresa.') + '</div>'; return; }
  cont.innerHTML = lista.map(function(e) {
    return '<div class="empresa-card" onclick="_abrirDetalleEmpresa(\'' + e.id + '\')">' +
      '<div class="empresa-card-top">' +
        '<div><div class="empresa-card-razon">' + e.razonSocial + '</div><div class="empresa-card-cuit">CUIT ' + (e.cuit||'sin CUIT') + '</div></div>' +
      '</div>' +
      '<div class="empresa-card-meta">' +
        '<span>👤 <b>' + e.contactos.length + '</b> contacto' + (e.contactos.length!==1?'s':'') + '</span>' +
        '<span>💼 <b>' + e.negocios.length + '</b> negocio' + (e.negocios.length!==1?'s':'') + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}
window._filtrarEmpresas = function(q) { _renderListaEmpresas(q); };

window._toggleFormNuevaEmpresa = function() {
  var panel = document.getElementById('form-nueva-empresa-panel');
  var abrir = panel.style.display !== 'block';
  panel.style.display = abrir ? 'block' : 'none';
  if (abrir) {
    ['ne-cuit','ne-telefono','ne-razon','ne-domicilio'].forEach(function(id){ document.getElementById(id).value = ''; });
    document.getElementById('ne-razon').focus();
  }
};

// ── Normalización y búsqueda de duplicados (compartida entre alta
// manual e importación desde Excel) ──
function _normCuit(s) { return String(s||'').replace(/\D/g, ''); }
function _normRazon(s) { return String(s||'').toUpperCase().trim().replace(/\s+/g, ' '); }

function _buscarEmpresaExistente(razonSocial, cuit) {
  var cuitN = _normCuit(cuit);
  var razonN = _normRazon(razonSocial);
  return EMPRESAS.find(function(e) {
    if (cuitN && _normCuit(e.cuit) === cuitN) return true;
    if (razonN && _normRazon(e.razonSocial) === razonN) return true;
    return false;
  });
}

window._crearNuevaEmpresa = function() {
  var razon = document.getElementById('ne-razon').value.trim();
  if (!razon) { alert('Falta la Razón Social — se completa sola con el CUIT, o cargala vos.'); return; }
  var cuit = document.getElementById('ne-cuit').value.trim();
  var telefono = document.getElementById('ne-telefono').value.trim();
  var domicilio = document.getElementById('ne-domicilio').value.trim();

  var existente = _buscarEmpresaExistente(razon, cuit);
  if (existente) {
    if (!confirm('Ya existe "' + existente.razonSocial + '" (' + (existente.cuit ? 'CUIT ' + existente.cuit : 'mismo nombre') + ').\n\n¿Querés abrir esa empresa en vez de crear una nueva?')) return;
    document.getElementById('form-nueva-empresa-panel').style.display = 'none';
    _abrirDetalleEmpresa(existente.id);
    return;
  }

  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'guardarEmpresa', razonSocial:razon, cuit:cuit, telefono:telefono, domicilio:domicilio }) })
    .then(function(r){ return r.json(); })
    .then(async function(r) {
      if (!r.ok) { alert('Error al crear la empresa: ' + (r.error||'desconocido')); return; }
      document.getElementById('form-nueva-empresa-panel').style.display = 'none';
      await _cargarEmpresas();
      _abrirDetalleEmpresa(r.id);
    })
    .catch(function(){ alert('Error de conexión al crear la empresa.'); });
};

// ── DETALLE ──
window._abrirDetalleEmpresa = function(id) {
  var e = EMPRESAS.find(function(x){ return x.id === id; });
  if (!e) return;
  _empresaActualId = id;
  document.getElementById('vista-lista').style.display = 'none';
  document.getElementById('vista-detalle').style.display = 'block';
  document.getElementById('hdr-titulo').textContent = e.razonSocial;
  document.getElementById('hdr-sub').textContent = 'Ficha de empresa';
  document.getElementById('det-razon').value = e.razonSocial;
  document.getElementById('det-cuit').value = e.cuit;
  document.getElementById('det-telefono').value = e.telefono;
  document.getElementById('det-domicilio').value = e.domicilio;
  _renderContactos(e);
  _renderNegocios(e);
  window.scrollTo(0,0);
};

function _cerrarDetalle() {
  _empresaActualId = null;
  document.getElementById('vista-detalle').style.display = 'none';
  document.getElementById('vista-lista').style.display = 'block';
  document.getElementById('hdr-titulo').textContent = 'Empresas';
  document.getElementById('hdr-sub').textContent = 'Base de clientes y contactos';
  _renderListaEmpresas();
}

window._guardarCambiosEmpresa = function() {
  var e = EMPRESAS.find(function(x){ return x.id === _empresaActualId; });
  if (!e) return;
  var razon = document.getElementById('det-razon').value.trim() || e.razonSocial;
  var cuit = document.getElementById('det-cuit').value.trim();
  var telefono = document.getElementById('det-telefono').value.trim();
  var domicilio = document.getElementById('det-domicilio').value.trim();
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'guardarEmpresa', id:e.id, razonSocial:razon, cuit:cuit, telefono:telefono, domicilio:domicilio }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert('Error al guardar: ' + (r.error||'desconocido')); return; }
      e.razonSocial = razon; e.cuit = cuit; e.telefono = telefono; e.domicilio = domicilio;
      document.getElementById('hdr-titulo').textContent = razon;
    })
    .catch(function(){ alert('Error de conexión al guardar.'); });
};

window._borrarEmpresaActual = function() {
  var e = EMPRESAS.find(function(x){ return x.id === _empresaActualId; });
  if (!e) return;
  if (!confirm('¿Borrar "' + e.razonSocial + '" y todos sus contactos? Esta acción no se puede deshacer.')) return;
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'borrarEmpresa', id:e.id }) })
    .then(function(r){ return r.json(); })
    .then(async function(r) {
      if (!r.ok) { alert('Error al borrar: ' + (r.error||'desconocido')); return; }
      EMPRESAS = EMPRESAS.filter(function(x){ return x.id !== _empresaActualId; });
      _cerrarDetalle();
    })
    .catch(function(){ alert('Error de conexión al borrar.'); });
};

// ── CONTACTOS ──
function _renderContactos(e) {
  document.getElementById('contactos-contador').textContent = e.contactos.length + ' contacto' + (e.contactos.length!==1?'s':'');
  var cont = document.getElementById('lista-contactos');
  if (!e.contactos.length) { cont.innerHTML = '<div class="empty-lista">Sin contactos cargados todavía.</div>'; return; }
  cont.innerHTML = e.contactos.map(function(c) {
    return '<div class="contacto-card">' +
      '<div class="contacto-info">' +
        '<div class="nombre">' + c.nombre + '</div>' +
        (c.cargo ? '<div class="cargo">' + c.cargo + '</div>' : '') +
        '<div class="datos">' + [c.email, c.telefono].filter(Boolean).join(' · ') + '</div>' +
      '</div>' +
      '<div class="contacto-acciones">' +
        '<button class="btn-icon-mini" onclick="_editarContacto(\'' + c.id + '\')" title="Editar">✎</button>' +
        '<button class="btn-icon-mini danger" onclick="_borrarContacto(\'' + c.id + '\')" title="Borrar">✕</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

var _contactoEditandoId = null; // null = modo "agregar nuevo", con valor = editando ese contacto

window._toggleFormContacto = function() {
  var form = document.getElementById('form-contacto');
  var abrir = form.style.display !== 'block';
  form.style.display = abrir ? 'block' : 'none';
  if (abrir) {
    _contactoEditandoId = null;
    document.getElementById('fc-titulo').textContent = '+ Agregar contacto';
    ['fc-nombre','fc-cargo','fc-email','fc-telefono'].forEach(function(id){ document.getElementById(id).value = ''; });
    document.getElementById('fc-nombre').focus();
  }
};

window._editarContacto = function(contactoId) {
  var e = EMPRESAS.find(function(x){ return x.id === _empresaActualId; });
  if (!e) return;
  var c = e.contactos.find(function(x){ return x.id === contactoId; });
  if (!c) return;
  _contactoEditandoId = contactoId;
  document.getElementById('fc-titulo').textContent = '✎ Editando: ' + c.nombre;
  document.getElementById('fc-nombre').value = c.nombre || '';
  document.getElementById('fc-cargo').value = c.cargo || '';
  document.getElementById('fc-email').value = c.email || '';
  document.getElementById('fc-telefono').value = c.telefono || '';
  document.getElementById('form-contacto').style.display = 'block';
  document.getElementById('fc-nombre').focus();
  document.getElementById('form-contacto').scrollIntoView({ behavior:'smooth', block:'center' });
};

window._guardarContacto = function() {
  var e = EMPRESAS.find(function(x){ return x.id === _empresaActualId; });
  if (!e) return;
  var nombre = document.getElementById('fc-nombre').value.trim();
  if (!nombre) { alert('El nombre es obligatorio.'); return; }
  var cargo = document.getElementById('fc-cargo').value.trim();
  var email = document.getElementById('fc-email').value.trim();
  var telefono = document.getElementById('fc-telefono').value.trim();
  var payload = { accion:'guardarContacto', empresaId:e.id, nombre:nombre, cargo:cargo, email:email, telefono:telefono };
  if (_contactoEditandoId) payload.id = _contactoEditandoId;

  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert('Error al guardar el contacto: ' + (r.error||'desconocido')); return; }
      if (_contactoEditandoId) {
        var c = e.contactos.find(function(x){ return x.id === _contactoEditandoId; });
        if (c) { c.nombre = nombre; c.cargo = cargo; c.email = email; c.telefono = telefono; }
      } else {
        e.contactos.push({ id:r.id, nombre:nombre, cargo:cargo, email:email, telefono:telefono });
      }
      _contactoEditandoId = null;
      ['fc-nombre','fc-cargo','fc-email','fc-telefono'].forEach(function(id){ document.getElementById(id).value = ''; });
      document.getElementById('form-contacto').style.display = 'none';
      _renderContactos(e);
    })
    .catch(function(){ alert('Error de conexión al guardar el contacto.'); });
};

window._borrarContacto = function(contactoId) {
  var e = EMPRESAS.find(function(x){ return x.id === _empresaActualId; });
  if (!e) return;
  if (!confirm('¿Borrar este contacto?')) return;
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ accion:'borrarContacto', id:contactoId }) })
    .then(function(r){ return r.json(); })
    .then(function(r) {
      if (!r.ok) { alert('Error al borrar el contacto: ' + (r.error||'desconocido')); return; }
      e.contactos = e.contactos.filter(function(c){ return c.id !== contactoId; });
      _renderContactos(e);
    })
    .catch(function(){ alert('Error de conexión al borrar el contacto.'); });
};

function _fmtFechaNegocio(f) {
  if (!f) return '';
  try { return new Date(f).toLocaleDateString('es-AR', { day:'numeric', month:'short', year:'numeric' }); }
  catch(e) { return f; }
}

function _renderNegocios(e) {
  var total = e.negocios.length;
  document.getElementById('negocios-contador').textContent = total + ' negocio' + (total!==1?'s':'') + (total > 5 ? ' (últimos 5)' : '');
  var cont = document.getElementById('lista-negocios');
  if (!total) { cont.innerHTML = '<div class="empty-lista">Todavía no tiene negocios asociados.</div>'; return; }
  var negociosAMostrar = e.negocios.slice(0, 5); // ya vienen ordenados por fecha desc — los más recientes primero
  cont.innerHTML = negociosAMostrar.map(function(n) {
    var info = ESTADO_INFO[n.estado] || { label:n.estado, c:'#94a3b8', bg:'rgba(148,163,184,.12)' };
    var link = n.tipo === 'ventas'
      ? 'https://cahirth.github.io/Portal-TLC/cotizaciones.html?id=' + encodeURIComponent(n.id)
      : 'https://cahirth.github.io/Portal-TLC/servicio.html?ticket=' + encodeURIComponent(n.id);
    return '<a class="negocio-card" href="' + link + '" target="_blank">' +
      '<span class="negocio-tipo-tag ' + n.tipo + '">' + (n.tipo === 'ventas' ? 'VENTAS' : 'SERVICIO') + '</span>' +
      '<div class="negocio-info">' +
        '<div class="negocio-id">' + n.id + '</div>' +
        '<div class="negocio-meta">' + _fmtFechaNegocio(n.fecha) + '</div>' +
        '<span class="negocio-estado" style="background:' + info.bg + ';color:' + info.c + ';">' + info.label + '</span>' +
      '</div>' +
      (n.monto ? '<div class="negocio-monto">' + n.moneda + ' ' + Math.round(n.monto).toLocaleString('es-AR') + '</div>' : '') +
    '</a>';
  }).join('') + (total > 5 ? '<div class="empty-lista" style="padding:10px;font-style:normal;font-size:11px;">Mostrando los 5 más recientes de ' + total + ' en total.</div>' : '');
}

  }
};

// ══════════════════════════════════════════════════════════════════
// MODAL "NUEVO NEGOCIO (VENTAS)" — pide contacto (obligatorio si la
// empresa tiene 2+) y arma la URL de presupuesto-editor.html con todo
// precargado. No toca el flujo viejo de selector-dispositivos.html.
// ══════════════════════════════════════════════════════════════════
var _mnnEmpresa = null;
var _mnnContactoIdx = null;

function _abrirModalNuevoNegocio(e) {
  _mnnEmpresa = e;
  _mnnContactoIdx = (e.contactos && e.contactos.length === 1) ? 0 : null;
  document.getElementById('mnn-empresa-nombre').textContent =
    (e.razonSocial || 'Sin nombre') + (e.cuit ? ' · CUIT ' + e.cuit : '');
  // Default editable: razón social + fecha corta — Cristian puede
  // reescribirlo completamente antes de confirmar.
  var fechaCorta = new Date().toLocaleDateString('es-AR', { day:'numeric', month:'long' });
  document.getElementById('mnn-nombre-negocio').value = (e.razonSocial || '') + ' — ' + fechaCorta;
  document.getElementById('mnn-etapa').value = '10%';
  _renderModalNuevoNegocio();
  document.getElementById('modal-nuevo-negocio').classList.add('open');
}

function _cerrarModalNuevoNegocio() {
  document.getElementById('modal-nuevo-negocio').classList.remove('open');
  _mnnEmpresa = null;
  _mnnContactoIdx = null;
}

function _renderModalNuevoNegocio() {
  var e = _mnnEmpresa;
  var cont = document.getElementById('mnn-contenido');
  var contactos = (e.contactos || []);
  var btnCrear = document.getElementById('mnn-btn-crear');

  if (!contactos.length) {
    cont.innerHTML = '<div class="modal-warning">Esta empresa todavía no tiene contactos cargados. ' +
      'Agregá uno antes de crear el negocio.</div>';
    btnCrear.disabled = true;
    btnCrear.style.opacity = '.5';
    btnCrear.style.cursor = 'not-allowed';
    return;
  }

  btnCrear.disabled = false;
  btnCrear.style.opacity = '1';
  btnCrear.style.cursor = 'pointer';

  var placeholder = contactos.length > 1 && _mnnContactoIdx === null
    ? '<option value="" selected disabled>Seleccioná un contacto...</option>' : '';
  var opciones = contactos.map(function(c, i) {
    var sel = _mnnContactoIdx === i ? ' selected' : '';
    return '<option value="' + i + '"' + sel + '>' + c.nombre + (c.cargo ? ' — ' + c.cargo : '') + '</option>';
  }).join('');

  cont.innerHTML = '<div class="modal-campo"><label>Contacto</label>' +
    '<select onchange="_mnnContactoIdx = this.value === \'\' ? null : parseInt(this.value,10);">' +
    placeholder + opciones + '</select></div>';
}

async function _confirmarNuevoNegocio() {
  var e = _mnnEmpresa;
  if (!e) return;
  var contactos = (e.contactos || []);
  if (contactos.length && _mnnContactoIdx === null) {
    alert('Elegí un contacto antes de continuar.');
    return;
  }
  var nombreNegocio = document.getElementById('mnn-nombre-negocio').value.trim();
  if (!nombreNegocio) {
    alert('Ponele un nombre al negocio antes de continuar.');
    return;
  }
  var c = (_mnnContactoIdx !== null) ? contactos[_mnnContactoIdx] : null;
  var etapa = document.getElementById('mnn-etapa').value;
  var sesion = _leerSesionCompartida();
  var vendedor = (sesion && sesion.name) || '';

  var btn = document.getElementById('mnn-btn-crear');
  btn.disabled = true;
  var textoOriginal = btn.textContent;
  btn.textContent = 'Creando...';

  try {
    var resp = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({
        accion: 'crearNegocioVacio',
        nombreNegocio: nombreNegocio,
        razonSocial: e.razonSocial || '',
        cuit: e.cuit || '',
        telefono: e.telefono || '',
        vendedor: vendedor,
        estado: etapa,
        empresaId: e.id || '',
        contactoId: c ? (c.id || '') : '',
        contactoNombre: c ? (c.nombre || '') : '',
        contactoEmail: c ? (c.email || '') : '',
        contactoTelefono: c ? (c.telefono || '') : '',
      })
    });
    var r = await resp.json();
    if (!r.ok) {
      alert('No se pudo crear el negocio: ' + (r.error || 'error desconocido'));
      btn.disabled = false; btn.textContent = textoOriginal;
      return;
    }
    window.location.href = 'cotizaciones.html?id=' + encodeURIComponent(r.idCot);
  } catch(err) {
    alert('Error de conexión al crear el negocio.');
    btn.disabled = false; btn.textContent = textoOriginal;
  }
}

// ══════════════════════════════════════════════════════════════════
// IMPORTAR DESDE EXCEL — lee el archivo en el navegador (sin subirlo a
// ningún lado), lo agrupa por CUIT/Razón Social (mismo criterio que el
// resto de la app), lo cruza contra las empresas que YA existen en
// Firebase, y arma un resumen para confirmar antes de escribir nada.
// Formato esperado: mismo de la plantilla — encabezados en la fila 2,
// datos desde la fila 3, columnas: Razón Social, CUIT, Domicilio,
// Teléfono Empresa, Nombre del Contacto, Cargo, Email del Contacto,
// Teléfono del Contacto, Notas (una fila por contacto).
// ══════════════════════════════════════════════════════════════════
var _importPendiente = null; // { nuevas:[...], existentes:[...] }

window._onSeleccionarExcel = function(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var wb = XLSX.read(ev.target.result, { type:'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var filas = XLSX.utils.sheet_to_json(ws, { header:1, range:1 }); // fila 2 = encabezados (índice 1)
      _procesarFilasExcel(filas);
    } catch(e) {
      alert('No se pudo leer el archivo — ¿es un .xlsx válido? (' + e.message + ')');
    }
    document.getElementById('input-excel-empresas').value = '';
  };
  reader.readAsArrayBuffer(file);
};

function _procesarFilasExcel(filas) {
  if (!filas.length) { alert('El archivo no tiene filas de datos.'); return; }
  var encabezados = filas[0].map(function(h){ return String(h||'').trim(); });
  var idxRazon = encabezados.findIndex(function(h){ return h.indexOf('Razón Social') !== -1; });
  var idxCuit = encabezados.indexOf('CUIT');
  var idxDom = encabezados.indexOf('Domicilio');
  var idxTelEmp = encabezados.indexOf('Teléfono Empresa');
  var idxNomC = encabezados.findIndex(function(h){ return h.indexOf('Nombre del Contacto') !== -1; });
  var idxCargo = encabezados.indexOf('Cargo');
  var idxEmail = encabezados.indexOf('Email del Contacto');
  var idxTelC = encabezados.indexOf('Teléfono del Contacto');

  if (idxRazon === -1) { alert('No encuentro la columna "Razón Social" — ¿es el archivo con el formato correcto?'); return; }

  // Agrupar filas por empresa (mismo criterio: CUIT si hay, si no razón social normalizada)
  var grupos = {};
  var ordenGrupos = [];
  for (var i = 1; i < filas.length; i++) {
    var f = filas[i];
    if (!f || !f[idxRazon]) continue;
    var razon = String(f[idxRazon]).trim();
    var cuit = idxCuit !== -1 ? String(f[idxCuit]||'').trim() : '';
    var clave = _normCuit(cuit) || ('N:' + _normRazon(razon));
    if (!grupos[clave]) {
      grupos[clave] = { razonSocial:razon, cuit:cuit, domicilio: idxDom!==-1?String(f[idxDom]||'').trim():'',
        telefono: idxTelEmp!==-1?String(f[idxTelEmp]||'').trim():'', contactos:[] };
      ordenGrupos.push(clave);
    }
    var nomC = idxNomC !== -1 ? String(f[idxNomC]||'').trim() : '';
    if (nomC) {
      grupos[clave].contactos.push({
        nombre: nomC, cargo: idxCargo!==-1?String(f[idxCargo]||'').trim():'',
        email: idxEmail!==-1?String(f[idxEmail]||'').trim():'', telefono: idxTelC!==-1?String(f[idxTelC]||'').trim():'',
      });
    }
  }

  var nuevas = [], existentes = [];
  ordenGrupos.forEach(function(clave) {
    var g = grupos[clave];
    var match = _buscarEmpresaExistente(g.razonSocial, g.cuit);
    if (match) {
      // Solo los contactos que todavía no tiene esa empresa (por nombre, sin importar mayúsculas)
      var nombresYaTiene = (match.contactos||[]).map(function(c){ return c.nombre.toUpperCase(); });
      g.contactosNuevos = g.contactos.filter(function(c){ return nombresYaTiene.indexOf(c.nombre.toUpperCase()) === -1; });
      g.empresaExistenteId = match.id;
      existentes.push(g);
    } else {
      nuevas.push(g);
    }
  });

  _importPendiente = { nuevas: nuevas, existentes: existentes };
  _renderPreviewImportacion();
}

function _renderPreviewImportacion() {
  var p = _importPendiente;
  var totalContactosNuevos = p.nuevas.reduce(function(a,e){ return a + e.contactos.length; }, 0)
    + p.existentes.reduce(function(a,e){ return a + e.contactosNuevos.length; }, 0);

  document.getElementById('import-resumen').innerHTML =
    '<b style="color:var(--accent-green);">' + p.nuevas.length + '</b> empresas nuevas para crear · ' +
    '<b style="color:var(--accent-orange);">' + p.existentes.length + '</b> ya existen (se les agregan contactos nuevos si tienen) · ' +
    '<b>' + totalContactosNuevos + '</b> contactos nuevos en total';

  var items = p.nuevas.map(function(g) {
    return '<div style="padding:8px 10px;border-bottom:1px solid var(--border-glow);font-size:12px;">' +
      '<span style="color:var(--accent-green);font-weight:700;">NUEVA</span> ' + g.razonSocial +
      (g.cuit ? ' <span style="color:var(--text-dim);">(CUIT ' + g.cuit + ')</span>' : '') +
      (g.contactos.length ? ' — ' + g.contactos.length + ' contacto' + (g.contactos.length!==1?'s':'') : '') +
    '</div>';
  }).concat(p.existentes.filter(function(g){ return g.contactosNuevos.length > 0; }).map(function(g) {
    return '<div style="padding:8px 10px;border-bottom:1px solid var(--border-glow);font-size:12px;">' +
      '<span style="color:var(--accent-orange);font-weight:700;">YA EXISTE</span> ' + g.razonSocial +
      ' — se agregan ' + g.contactosNuevos.length + ' contacto' + (g.contactosNuevos.length!==1?'s':'') + ' nuevo' + (g.contactosNuevos.length!==1?'s':'') +
    '</div>';
  }));

  document.getElementById('import-lista').innerHTML = items.length ? items.join('') : '<div class="empty-lista">Nada para importar — todo lo del archivo ya está cargado.</div>';
  document.getElementById('import-preview-panel').style.display = 'block';
  document.getElementById('form-nueva-empresa-panel').style.display = 'none';
  document.getElementById('btn-confirmar-import').style.display = (p.nuevas.length || totalContactosNuevos) ? 'block' : 'none';
  window.scrollTo(0,0);
}

window._cancelarImportacion = function() {
  _importPendiente = null;
  document.getElementById('import-preview-panel').style.display = 'none';
};

window._confirmarImportacion = async function() {
  var p = _importPendiente;
  if (!p) return;
  var btn = document.getElementById('btn-confirmar-import');
  var prog = document.getElementById('import-progreso');
  btn.disabled = true;
  prog.style.display = 'block';

  var total = p.nuevas.length + p.existentes.filter(function(g){return g.contactosNuevos.length>0;}).length;
  var hechos = 0;
  function actualizarProgreso(msg) {
    hechos++;
    prog.textContent = 'Importando... (' + hechos + '/' + total + ') ' + msg;
  }

  // Empresas nuevas — se crean de a una, en tandas chicas para no saturar el Apps Script
  for (var i = 0; i < p.nuevas.length; i++) {
    var g = p.nuevas[i];
    try {
      var r = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({ accion:'guardarEmpresa', razonSocial:g.razonSocial, cuit:g.cuit, telefono:g.telefono, domicilio:g.domicilio }) }).then(function(x){return x.json();});
      if (r.ok) {
        for (var j = 0; j < g.contactos.length; j++) {
          var c = g.contactos[j];
          await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
            body: JSON.stringify({ accion:'guardarContacto', empresaId:r.id, nombre:c.nombre, cargo:c.cargo, email:c.email, telefono:c.telefono }) });
        }
      }
    } catch(e) { console.warn('Error importando', g.razonSocial, e); }
    actualizarProgreso(g.razonSocial);
  }

  // Empresas existentes — solo se agregan los contactos nuevos
  for (var k = 0; k < p.existentes.length; k++) {
    var ge = p.existentes[k];
    if (!ge.contactosNuevos.length) continue;
    for (var m = 0; m < ge.contactosNuevos.length; m++) {
      var cn = ge.contactosNuevos[m];
      try {
        await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({ accion:'guardarContacto', empresaId:ge.empresaExistenteId, nombre:cn.nombre, cargo:cn.cargo, email:cn.email, telefono:cn.telefono }) });
      } catch(e) { console.warn('Error agregando contacto a', ge.razonSocial, e); }
    }
    actualizarProgreso(ge.razonSocial);
  }

  prog.textContent = '✓ Importación terminada.';
  btn.disabled = false;
  _importPendiente = null;
  await _cargarEmpresas();
  setTimeout(function() { document.getElementById('import-preview-panel').style.display = 'none'; }, 1500);
};

// ── Origen: ?empresa=ID para entrar directo a una ficha (ej. desde una tarjeta) ──
(async function() {
  var params = new URLSearchParams(window.location.search);
  var empresaId = params.get('empresa');
  await _cargarEmpresas();
  if (empresaId) _abrirDetalleEmpresa(empresaId);
})();
</script>
