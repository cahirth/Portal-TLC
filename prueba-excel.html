<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLC - Prueba Excel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b1329; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1c2541; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; border: 1px solid #222e50; }
        h2 { font-size: 20px; margin-bottom: 6px; color: #3a86ff; }
        p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; margin-top: 16px; }
        input { width: 100%; background: #0b1329; border: 1px solid #222e50; border-radius: 8px; padding: 12px; color: #f8fafc; font-size: 15px; outline: none; }
        input:focus { border-color: #3a86ff; }
        .btn { width: 100%; margin-top: 24px; padding: 14px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn-primary { background: #3a86ff; color: white; }
        .btn-secondary { background: #222e50; color: #94a3b8; margin-top: 10px; }
        .btn:active { opacity: 0.8; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 20px; padding: 14px; border-radius: 10px; font-size: 13px; display: none; word-break: break-all; }
        .status.ok { background: rgba(6,214,160,0.15); border: 1px solid #06d6a0; color: #06d6a0; display: block; }
        .status.error { background: rgba(255,0,127,0.15); border: 1px solid #ff007f; color: #ff99cc; display: block; }
        .status.loading { background: rgba(58,134,255,0.15); border: 1px solid #3a86ff; color: #93c5fd; display: block; }
        .status.info { background: rgba(58,134,255,0.1); border: 1px solid #3a86ff; color: #93c5fd; display: block; font-family: monospace; font-size: 11px; }
        .rows { margin-top: 20px; }
        .rows h3 { font-size: 14px; color: #94a3b8; margin-bottom: 10px; }
        .row-item { background: #0b1329; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; border: 1px solid #222e50; }
        .row-item span { color: #94a3b8; }
        .divider { border: none; border-top: 1px solid #222e50; margin: 24px 0; }
        .user-info { background: rgba(6,214,160,0.1); border: 1px solid #06d6a0; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #06d6a0; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="card">
    <h2>🧪 Prueba Excel — Portal TLC</h2>
    <p class="sub">Escribir y leer filas en tlc-datos.xlsx via Microsoft Graph</p>

    <div id="login-section">
        <p style="color:#94a3b8;font-size:14px;margin-bottom:20px;">Iniciá sesión con tu cuenta de TLC para continuar.</p>
        <button class="btn btn-primary" id="btn-login">Iniciar sesión con Microsoft</button>
    </div>

    <div id="app-section" style="display:none">
        <div class="user-info" id="user-info"></div>

        <!-- PASO 1: obtener IDs reales -->
        <button class="btn btn-secondary" id="btn-buscar" style="margin-top:0">🔍 Buscar archivo Excel en SharePoint</button>

        <div id="ids-encontrados" style="display:none">
            <label>Nombre</label>
            <input type="text" id="campo-nombre" placeholder="Ej: Cristian">
            <label>Mensaje</label>
            <input type="text" id="campo-mensaje" placeholder="Ej: Prueba de conexión">
            <button class="btn btn-primary" id="btn-escribir">➕ Escribir fila en Excel</button>
            <hr class="divider">
            <button class="btn btn-secondary" id="btn-leer">📖 Leer filas del Excel</button>
        </div>

        <div class="status" id="status"></div>
        <div class="rows" id="rows-container" style="display:none">
            <h3>Filas encontradas:</h3>
            <div id="rows-list"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.min.js"></script>
<script>
const CLIENT_ID  = '59d36de7-90e9-41ce-9566-27bcb563b5ab';
const TENANT_ID  = 'bbd111b8-0522-4e3d-9f43-78d1ca0e71cf';
const TABLE_NAME = 'Tabla1';
const SCOPES     = ['Files.ReadWrite', 'User.Read', 'Sites.Read.All'];

const msalConfig = {
    auth: {
        clientId: CLIENT_ID,
        authority: `https://login.microsoftonline.com/${TENANT_ID}`,
        redirectUri: 'https://cahirth.github.io/Portal-TLC/prueba-excel.html'
    },
    cache: { cacheLocation: 'sessionStorage' }
};

let msal_app = null;
let DRIVE_ID = null;
let ITEM_ID  = null;

async function initMsal() {
    msal_app = new msal.PublicClientApplication(msalConfig);
    await msal_app.initialize();
    const response = await msal_app.handleRedirectPromise();
    if (response && response.account) { mostrarApp(response.account); return; }
    const accounts = msal_app.getAllAccounts();
    if (accounts.length > 0) { mostrarApp(accounts[0]); }
}

async function getToken() {
    const accounts = msal_app.getAllAccounts();
    if (accounts.length === 0) throw new Error('No hay sesión activa');
    const res = await msal_app.acquireTokenSilent({ scopes: SCOPES, account: accounts[0] });
    return res.accessToken;
}

function mostrarApp(account) {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('app-section').style.display = 'block';
    document.getElementById('user-info').textContent = `✅ ${account.name || account.username}`;
}

function mostrarStatus(msg, tipo) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = `status ${tipo}`;
}

// Buscar el archivo por nombre en OneDrive/SharePoint
async function buscarArchivo() {
    mostrarStatus('Buscando tlc-datos.xlsx en SharePoint...', 'loading');
    try {
        const token = await getToken();

        // Buscar el archivo por nombre
        const searchUrl = `https://graph.microsoft.com/v1.0/sites/tlcarg.sharepoint.com:/sites/TLCOperaciones:/drive/root/search(q='tlc-datos.xlsx')`;
        const res = await fetch(searchUrl, {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) {
            const e = await res.json();
            throw new Error(e.error?.message || `Error ${res.status}`);
        }

        const data = await res.json();

        if (!data.value || data.value.length === 0) {
            throw new Error('No se encontró tlc-datos.xlsx en SharePoint. Verificá que esté en TLCOperaciones.');
        }

        const file = data.value[0];
        DRIVE_ID = file.parentReference.driveId;
        ITEM_ID  = file.id;

        mostrarStatus(`✅ Archivo encontrado: ${file.name}\nDrive: ${DRIVE_ID}\nItem: ${ITEM_ID}`, 'ok');
        document.getElementById('ids-encontrados').style.display = 'block';

    } catch(e) {
        mostrarStatus(`❌ ${e.message}`, 'error');
    }
}

async function escribirFila() {
    const nombre  = document.getElementById('campo-nombre').value.trim();
    const mensaje = document.getElementById('campo-mensaje').value.trim();
    if (!nombre || !mensaje) { mostrarStatus('Completá nombre y mensaje.', 'error'); return; }
    if (!DRIVE_ID || !ITEM_ID) { mostrarStatus('Primero buscá el archivo.', 'error'); return; }

    mostrarStatus('Guardando en Excel...', 'loading');
    document.getElementById('btn-escribir').disabled = true;

    try {
        const token = await getToken();
        const fecha = new Date().toLocaleString('es-AR');
        const url = `https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${ITEM_ID}/workbook/tables/${TABLE_NAME}/rows`;

        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ values: [[fecha, nombre, mensaje]] })
        });

        if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `Error ${res.status}`); }
        mostrarStatus('✅ Fila guardada en Excel correctamente.', 'ok');
        document.getElementById('campo-nombre').value = '';
        document.getElementById('campo-mensaje').value = '';
    } catch(e) {
        mostrarStatus(`❌ ${e.message}`, 'error');
    } finally {
        document.getElementById('btn-escribir').disabled = false;
    }
}

async function leerFilas() {
    if (!DRIVE_ID || !ITEM_ID) { mostrarStatus('Primero buscá el archivo.', 'error'); return; }
    mostrarStatus('Leyendo Excel...', 'loading');
    document.getElementById('rows-container').style.display = 'none';

    try {
        const token = await getToken();
        const url = `https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${ITEM_ID}/workbook/tables/${TABLE_NAME}/rows`;

        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `Error ${res.status}`); }

        const data = await res.json();
        const rows = data.value;
        if (!rows || rows.length === 0) { mostrarStatus('El Excel está vacío.', 'ok'); return; }

        const lista = document.getElementById('rows-list');
        lista.innerHTML = '';
        rows.forEach(row => {
            const [fecha, nombre, mensaje] = row.values[0];
            const div = document.createElement('div');
            div.className = 'row-item';
            div.innerHTML = `<strong>${nombre}</strong> — ${mensaje}<br><span>${fecha}</span>`;
            lista.appendChild(div);
        });

        document.getElementById('rows-container').style.display = 'block';
        mostrarStatus(`✅ ${rows.length} fila(s) encontradas.`, 'ok');
    } catch(e) {
        mostrarStatus(`❌ ${e.message}`, 'error');
    }
}

document.getElementById('btn-login').addEventListener('click', () => msal_app.loginRedirect({ scopes: SCOPES }));
document.getElementById('btn-buscar').addEventListener('click', buscarArchivo);
document.getElementById('btn-escribir').addEventListener('click', escribirFila);
document.getElementById('btn-leer').addEventListener('click', leerFilas);

initMsal().catch(console.error);
</script>
</body>
</html>
