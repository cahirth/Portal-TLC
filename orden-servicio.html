<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Orden de Servicio — TLC</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Times New Roman",Times,serif; background:#f1f5f9; color:#0f172a; font-size:13px; }
  .page { max-width:780px; margin:20px auto; background:white; box-shadow:0 4px 32px rgba(0,0,0,0.12); padding:32px 36px; min-height:200px; }
  @media print { body{background:white;} .page{margin:0;box-shadow:none;padding:24px 28px;} .no-print{display:none!important;} }
  @media (max-width:600px) { .page{padding:12px;} }
  table { border-collapse:collapse; width:100%; }
  .badge { display:inline-block; padding:2px 10px; border-radius:8px; font-size:11px; font-weight:700; font-family:Arial,sans-serif; }
  .badge.urgente    { background:#fef2f2; color:#dc2626; }
  .badge.importante { background:#fff7ed; color:#ea580c; }
  .badge.media      { background:#fefce8; color:#ca8a04; }
  .badge.baja       { background:#f8fafc; color:#64748b; }
  .btn-accion { padding:8px 18px; border:none; border-radius:6px; color:white; font-size:12px; font-family:Arial,sans-serif;
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .btn-pdf  { background:#0f172a; }
  .btn-pdf:hover { background:#1e293b; }
  .estado-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:80px 20px; text-align:center; font-family:Arial,sans-serif; }
  .spinner { width:40px; height:40px; border:3px solid #e2e8f0; border-top-color:#0f172a;
    border-radius:50%; animation:girar .8s linear infinite; margin-bottom:20px; }
  @keyframes girar { to { transform:rotate(360deg); } }
  .estado-titulo { font-size:15px; font-weight:700; color:#0f172a; margin-bottom:6px; }
  .estado-msg { font-size:13px; color:#64748b; max-width:340px; line-height:1.5; }
  .btn-reintentar { margin-top:18px; padding:9px 20px; background:#0f172a; color:white;
    border:none; border-radius:6px; font-size:13px; cursor:pointer; font-family:Arial,sans-serif; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0; }
  .field-cell { padding:10px 12px; border:1px solid #e2e8f0; }
  .field-cell:nth-child(even) { border-left:none; }
  .field-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
    color:#64748b; font-family:Arial,sans-serif; margin-bottom:3px; }
  .field-val { font-size:13px; color:#0f172a; font-weight:600; }
  .nota-row { padding:10px 12px; border:1px solid #e2e8f0; border-top:none; }
  .nota-meta { font-size:10px; color:#94a3b8; font-family:Arial,sans-serif; margin-bottom:3px; }
  .nota-texto { font-size:12px; color:#374151; line-height:1.5; }
  @media(max-width:500px) { .grid2{grid-template-columns:1fr;} .field-cell:nth-child(even){border-left:1px solid #e2e8f0;border-top:none;} }
</style>
</head>
<body>
<div class="page" id="page-root">
  <div class="estado-wrap">
    <div class="spinner"></div>
    <div class="estado-titulo">Cargando orden de servicio…</div>
    <div class="estado-msg">Un momento, estamos trayendo los datos.</div>
  </div>
</div>

<script>
(function(){
  var RTDB_URL    = 'https://portal-tlc-default-rtdb.firebaseio.com';
  var LOGO_URL    = 'https://lh3.googleusercontent.com/d/1rKdDTv8Ka5NiXs1-pYd5bA6WWZ6ifT25';
  var MAX_INTENTOS = 5;
  var INTERVALO_MS = 1500;

  var DEPOSITO_LABEL = {
    en_laboratorio:'En Laboratorio', diagnostico:'Diagnóstico', presupuesto:'Presupuesto',
    reparacion:'Reparación', preparacion_control_calidad:'Preparación / Control de Calidad',
    para_facturar:'Para Facturar', para_instalar:'Para Instalar', seguimiento:'Seguimiento',
    servicio_remoto:'Servicio Remoto', consignacion:'Consignación',
    finalizado:'Finalizado', cancelado:'Cancelado',
  };
  var TECNICO_NOMBRE = {
    sin_asignar:'Sin asignar', fernando_del_campo:'Fernando Del Campo',
    cristian_hirth:'Cristian Hirth', veronica_ribaita:'Verónica Ribaita',
    lourdes_davalos:'Lourdes Dávalos', juan_garro:'Juan Garro',
    damian_sosa:'Damián Sosa', lucio_raineri:'Lucio Raineri',
  };

  function esc(s) {
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function getIdFromUrl() {
    return (new URLSearchParams(window.location.search).get('id')||'').trim();
  }
  function mostrarError(titulo, msg, conReintento) {
    document.getElementById('page-root').innerHTML =
      '<div class="estado-wrap"><div style="font-size:36px;margin-bottom:14px;">⚠️</div>' +
      '<div class="estado-titulo">' + esc(titulo) + '</div>' +
      '<div class="estado-msg">' + esc(msg) + '</div>' +
      (conReintento ? '<button class="btn-reintentar" onclick="location.reload()">Reintentar</button>' : '') +
      '</div>';
  }
  function formatFechaISO(iso) {
    try { return new Date(iso).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
    catch(e){ return iso||''; }
  }

  function renderOrden(id, t) {
    document.title = 'OS-' + id + ' — ' + (t.cliente||'');
    var etapa    = DEPOSITO_LABEL[t.deposito] || t.deposito || '—';
    var tecnico  = TECNICO_NOMBRE[t.tecnico_asignado] || t.tecnico_asignado || '—';
    var fechaCreado = t.creado_en ? formatFechaISO(t.creado_en) : '—';
    var prio     = t.prioridad || 'media';

    var notasHtml = '';
    if (t.notas_comentarios && t.notas_comentarios.length) {
      notasHtml = t.notas_comentarios.map(function(n){
        return '<div class="nota-row">' +
          '<div class="nota-meta">' + esc(n.autor||'—') + ' · ' +
          (n.fecha ? formatFechaISO(n.fecha) : '') + '</div>' +
          '<div class="nota-texto">' + esc(n.texto||'') + '</div>' +
        '</div>';
      }).join('');
    } else {
      notasHtml = '<div class="nota-row" style="color:#94a3b8;font-family:Arial,sans-serif;font-size:12px;">Sin notas registradas.</div>';
    }

    document.getElementById('page-root').innerHTML =
      // BOTONES
      '<div class="no-print" style="text-align:right;margin-bottom:16px;">' +
        '<button class="btn-accion btn-pdf" onclick="window.print()">↓ Guardar PDF</button>' +
      '</div>' +

      // HEADER
      '<div style="display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;">' +
        '<img src="' + LOGO_URL + '" alt="TLC" style="max-width:180px;width:45%;height:auto;" onerror="this.style.display=\'none\'">' +
        '<div style="text-align:right;flex:1;min-width:160px;font-family:Arial,sans-serif;">' +
          '<div style="font-size:11px;color:#64748b;margin-bottom:4px;border:1px solid #cbd5e1;padding:2px 10px;display:inline-block;">Documento interno · No válido como factura</div>' +
          '<div style="font-size:14px;font-weight:700;color:#0f172a;margin-top:6px;">Orden de Servicio</div>' +
          '<div style="font-size:12px;color:#374151;margin-top:3px;font-weight:600;">' + esc(id) + '</div>' +
          '<div style="font-size:11px;color:#64748b;margin-top:3px;">Fecha: ' + fechaCreado + '</div>' +
        '</div>' +
      '</div>' +

      // DATOS DEL EQUIPO
      '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#64748b;font-family:Arial,sans-serif;margin-bottom:8px;">Datos del equipo</div>' +
      '<div style="border:1px solid #e2e8f0;border-radius:4px;overflow:hidden;margin-bottom:16px;">' +
        '<div class="grid2">' +
          '<div class="field-cell">' +
            '<div class="field-label">Cliente / Clínica</div>' +
            '<div class="field-val">' + esc(t.cliente||'—') + '</div>' +
          '</div>' +
          '<div class="field-cell">' +
            '<div class="field-label">Técnico asignado</div>' +
            '<div class="field-val">' + esc(tecnico) + '</div>' +
          '</div>' +
          '<div class="field-cell" style="border-top:none;">' +
            '<div class="field-label">Modelo de equipo</div>' +
            '<div class="field-val">' + esc(t.equipo_modelo||'—') + '</div>' +
          '</div>' +
          '<div class="field-cell" style="border-top:none;border-left:none;">' +
            '<div class="field-label">Nº de serie</div>' +
            '<div class="field-val" style="font-family:monospace;font-size:12px;">' + esc(t.equipo_serie||'—') + '</div>' +
          '</div>' +
          '<div class="field-cell" style="border-top:none;">' +
            '<div class="field-label">Etapa actual (depósito)</div>' +
            '<div class="field-val">' + esc(etapa) + '</div>' +
          '</div>' +
          '<div class="field-cell" style="border-top:none;border-left:none;">' +
            '<div class="field-label">Prioridad</div>' +
            '<div class="field-val"><span class="badge ' + esc(prio) + '">' + esc(prio) + '</span></div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      // NOTAS Y SEGUIMIENTO
      '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#64748b;font-family:Arial,sans-serif;margin-bottom:8px;">Notas y seguimiento</div>' +
      '<div style="border:1px solid #e2e8f0;border-radius:4px;overflow:hidden;margin-bottom:24px;">' +
        notasHtml +
      '</div>' +

      // FIRMA
      '<div style="text-align:right;font-family:Arial,sans-serif;font-size:12px;color:#374151;margin-bottom:24px;">' +
        'Generado por:<br><strong>' + esc(t.creado_por||'TLC') + '</strong><br>info@tlcsrl.com.ar' +
      '</div>' +

      // FOOTER
      '<div style="border-top:2px solid #0f172a;padding-top:12px;display:flex;align-items:center;gap:16px;">' +
        '<img src="' + LOGO_URL + '" alt="TLC" style="width:70px;height:auto;" onerror="this.style.display=\'none\'">' +
        '<div style="font-size:11px;color:#0f172a;font-family:Arial,sans-serif;line-height:1.6;">' +
          '<strong>TECNOLOGÍA LÁSER CORNEAL S.R.L.</strong><br>' +
          'Pasaje del Carmen 716 LOCAL PB C1019AAB · Buenos Aires, Argentina' +
        '</div>' +
      '</div>';
  }

  function buscarConReintento(id, intento) {
    intento = intento || 0;
    fetch(RTDB_URL + '/servicio_tecnico/' + encodeURIComponent(id) + '.json?_=' + Date.now(), { cache:'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){
      if (data && data.id_ticket) { renderOrden(id, data); return; }
      if (intento < MAX_INTENTOS) setTimeout(function(){ buscarConReintento(id, intento+1); }, INTERVALO_MS);
      else mostrarError('Orden no encontrada', 'No pudimos encontrar esta orden de servicio. Verificá el link.', true);
    })
    .catch(function(){
      if (intento < MAX_INTENTOS) setTimeout(function(){ buscarConReintento(id, intento+1); }, INTERVALO_MS);
      else mostrarError('Error de conexión', 'Revisá tu internet y volvé a intentar.', true);
    });
  }

  var id = getIdFromUrl();
  if (!id) mostrarError('Link incompleto', 'Este link no incluye un ID de orden válido.', false);
  else buscarConReintento(id, 0);
})();
</script>
</body>
</html>
